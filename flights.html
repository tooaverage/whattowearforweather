<script>
"use strict";

const num = (v, fallback = 0) => {
  const n = typeof v === "number" ? v : Number(v);
  return Number.isFinite(n) ? n : fallback;
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const CFG = {
  origin: { iata: "YVR", city: "Vancouver" },
  currency: "cad",
  defaultWindowDays: 60,
  nightsPresets: [
    { key: "weekend", label: "Weekend (2-3)", min: 2, max: 3 },

  maxOptionsPerDest: 6,
  maxDestsShown: 40,

  tp: { base: "https://api.travelpayouts.com/v2/prices/latest", limit: 1000, pages: 2, periodType: "year" },
  demo: { minLeadDays: 2, maxLeadDays: 85, optionsPerDest: 6, priceJitterLo: 0.82, priceJitterSpan: 0.55 },

};

const CITIES = {

  LAS: "Las Vegas", PHX: "Phoenix", DEN: "Denver", SLC: "Salt Lake City", ORD: "Chicago", CHI: "Chicago",
  MSP: "Minneapolis", DFW: "Dallas", IAH: "Houston", HOU: "Houston", ATL: "Atlanta", MIA: "Miami",
  MCO: "Orlando", JFK: "New York", EWR: "New York", NYC: "New York", BOS: "Boston", WAS: "Washington",
  IAD: "Washington", DCA: "Washington", PHL: "Philadelphia", AUS: "Austin", ANC: "Anchorage",
  HNL: "Honolulu", OGG: "Maui", KOA: "Kona", LIH: "Kauai",
  YLW: "Kelowna", YYJ: "Victoria", YYC: "Calgary", YEG: "Edmonton", YXE: "Saskatoon", YQR: "Regina",
  YWG: "Winnipeg", YYZ: "Toronto", YTO: "Toronto", YUL: "Montreal", YMQ: "Montreal", YOW: "Ottawa",
  YHZ: "Halifax", YQB: "Quebec City",
  MEX: "Mexico City", CUN: "Cancun", PVR: "Puerto Vallarta", SJD: "Los Cabos", GDL: "Guadalajara",
  SJO: "San Jose, CR", PTY: "Panama City", LIM: "Lima", BOG: "Bogota", HAV: "Havana",
  NAS: "Nassau", BDA: "Bermuda", SJU: "San Juan",
  LHR: "London", LGW: "London", LON: "London", CDG: "Paris", PAR: "Paris", AMS: "Amsterdam",
  FRA: "Frankfurt", MUC: "Munich", ZRH: "Zurich", DUB: "Dublin", MAD: "Madrid", BCN: "Barcelona",
  LIS: "Lisbon", FCO: "Rome", ROM: "Rome", IST: "Istanbul", ATH: "Athens", KEF: "Reykjavik",
  NRT: "Tokyo", HND: "Tokyo", TYO: "Tokyo", KIX: "Osaka", ICN: "Seoul", SEL: "Seoul", TPE: "Taipei",
  HKG: "Hong Kong", PVG: "Shanghai", SHA: "Shanghai", PEK: "Beijing", BJS: "Beijing", CAN: "Guangzhou",
  MNL: "Manila", BKK: "Bangkok", SGN: "Ho Chi Minh City", SIN: "Singapore", KUL: "Kuala Lumpur",
  DPS: "Bali", DEL: "Delhi", BOM: "Mumbai", SYD: "Sydney", MEL: "Melbourne", BNE: "Brisbane",
  AKL: "Auckland", NAN: "Fiji", PPT: "Tahiti", DXB: "Dubai", DOH: "Doha", TLV: "Tel Aviv",
};

// ---- Engine (pure: no DOM, no fetch, no clock) ----

function nightsBetween(depISO, retISO) {
  const a = Date.parse(depISO + "T12:00:00Z"), b = Date.parse(retISO + "T12:00:00Z");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return NaN;
  return Math.round((b - a) / 86400000);
}

function estHours(distanceKm) {
  const km = num(distanceKm, 0);
  if (km <= 0) return null;
  return km / CFG.cruiseKmh + CFG.taxiPadH;
}

function tripFits(f, o) {
  if (!f || !f.departDate || !f.returnDate) return false;
  if (!(f.price > 0)) return false;
  if (f.departDate < o.windowStart || f.departDate > o.windowEnd) return false;
  if (f.returnDate > o.windowEnd) return false;
  const n = nightsBetween(f.departDate, f.returnDate);
  if (!Number.isFinite(n) || n < o.minNights || n > o.maxNights) return false;
  if (o.maxPrice > 0 && f.price > o.maxPrice) return false;
  if (o.maxHours > 0) {
    const h = estHours(f.distanceKm);
    if (h !== null && h > o.maxHours) return false;
  }
  return true;
}

function rankDestinations(fares, o) {
  const byDest = new Map();
  for (const f of fares) {
    if (!tripFits(f, o)) continue;
    if (!byDest.has(f.dest)) byDest.set(f.dest, []);
    byDest.get(f.dest).push(f);
  }
  const out = [];
  for (const [dest, list] of byDest) {
    list.sort((a, b) => a.price - b.price || (a.departDate < b.departDate ? -1 : 1));
    out.push({ dest, best: list[0], options: list.slice(0, CFG.maxOptionsPerDest) });
  }
  out.sort((a, b) => a.best.price - b.best.price);
  return out.slice(0, CFG.maxDestsShown);
}

// Open-jaw: origin -> hub (stay hubMin..hubMax nights) -> X (stay awayMin..awayMax nights) -> origin.
// legsA: origin->hub one-ways. legsB: hub->anywhere. legsC: anywhere->origin.
// Returns [{dest, best combo, options}] ranked by total price.
function planVia(legsA, legsB, legsC, o) {
  const inWin = l => l && l.date >= o.windowStart && l.date <= o.windowEnd && l.price > 0;
  const A = legsA.filter(inWin).sort((x, y) => x.price - y.price).slice(0, CFG.via.maxOutboundLegs);
  const byDest = new Map(), toHome = new Map();
  for (const l of legsB) {
    if (!inWin(l) || !l.to || l.to === o.hub || l.to === o.origin) continue;
    if (!byDest.has(l.to)) byDest.set(l.to, []);
    byDest.get(l.to).push(l);
  }
  for (const l of legsC) {
    if (!inWin(l) || !l.from || l.from === o.hub || l.from === o.origin) continue;
    if (!toHome.has(l.from)) toHome.set(l.from, []);
    toHome.get(l.from).push(l);
  }
  const out = [];
  for (const [dest, bList] of byDest) {
    const cList = toHome.get(dest);
    if (!cList) continue;
    const bs = bList.sort((x, y) => x.price - y.price).slice(0, CFG.via.maxLegsPerDest);
    const cs = cList.sort((x, y) => x.price - y.price).slice(0, CFG.via.maxLegsPerDest);
    const combos = [];
    for (const a of A) {
      for (const b of bs) {
        const hubN = nightsBetween(a.date, b.date);
        if (!Number.isFinite(hubN) || hubN < o.hubMin || hubN > o.hubMax) continue;
        for (const c of cs) {
          const awayN = nightsBetween(b.date, c.date);
          if (!Number.isFinite(awayN) || awayN < o.awayMin || awayN > o.awayMax) continue;
          const total = a.price + b.price + c.price;
          if (o.maxPrice > 0 && total > o.maxPrice) continue;
          combos.push({ a, b, c, total, hubNights: hubN, awayNights: awayN });
        }
      }
    }
    if (!combos.length) continue;
    combos.sort((x, y) => x.total - y.total);
    out.push({ dest, best: combos[0], options: combos.slice(0, CFG.maxOptionsPerDest) });
  }
  out.sort((x, y) => x.best.total - y.best.total);
  return out.slice(0, CFG.maxDestsShown);
}

// ---- Demo data (sample fares so the page works with no token) ----

const DEMO_DESTS = [
  { c: "SEA", km: 200, base: 158 }, { c: "YLW", km: 270, base: 138 }, { c: "PDX", km: 450, base: 208 },
  { c: "YYC", km: 685, base: 178 }, { c: "YEG", km: 820, base: 196 }, { c: "SFO", km: 1290, base: 258 },
  { c: "LAX", km: 1740, base: 228 }, { c: "LAS", km: 1750, base: 198 }, { c: "DEN", km: 1770, base: 296 },
  { c: "YWG", km: 1870, base: 258 }, { c: "SAN", km: 1950, base: 278 }, { c: "PHX", km: 2270, base: 312 },
  { c: "ORD", km: 2850, base: 368 }, { c: "SJD", km: 2960, base: 458 }, { c: "YYZ", km: 3360, base: 348 },
  { c: "PVR", km: 3480, base: 448 }, { c: "YUL", km: 3690, base: 392 }, { c: "JFK", km: 3910, base: 412 },
  { c: "MEX", km: 3930, base: 486 }, { c: "OGG", km: 4350, base: 528 }, { c: "HNL", km: 4390, base: 478 },
  { c: "CUN", km: 4870, base: 562 }, { c: "DUB", km: 7250, base: 758 }, { c: "NRT", km: 7560, base: 978 },
  { c: "LHR", km: 7580, base: 842 }, { c: "AMS", km: 7830, base: 868 }, { c: "CDG", km: 7900, base: 896 },
  { c: "ICN", km: 8070, base: 1024 }, { c: "TPE", km: 9550, base: 918 }, { c: "HKG", km: 10250, base: 942 },
  { c: "BKK", km: 11800, base: 1088 }, { c: "AKL", km: 11350, base: 1180 }, { c: "SYD", km: 12500, base: 1240 },
];

// One-way demo tables for via mode. kmB/baseB: hub to dest. kmC/baseC: dest back to YVR.
const DEMO_VIA_DESTS = [
  { c: "YUL", kmB: 500, baseB: 120, kmC: 3690, baseC: 260 },
  { c: "YOW", kmB: 360, baseB: 110, kmC: 3550, baseC: 250 },
  { c: "YQB", kmB: 720, baseB: 150, kmC: 3830, baseC: 280 },

  { c: "LAS", kmB: 3260, baseB: 180, kmC: 1750, baseC: 160 },

function hashSeed(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const addDaysISO = (iso, n) => {
  const d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const dowISO = iso => new Date(iso + "T12:00:00Z").getUTCDay();

function buildDemoFares(todayISO) {
  const NIGHTS_POOL = [2, 2, 3, 3, 4, 5, 7, 9];
  const fares = [];
  for (const d of DEMO_DESTS) {
    const rng = mulberry32(hashSeed(d.c + todayISO.slice(0, 7)));
    for (let i = 0; i < CFG.demo.optionsPerDest; i++) {
      const lead = CFG.demo.minLeadDays + Math.floor(rng() * (CFG.demo.maxLeadDays - CFG.demo.minLeadDays));
      const nights = NIGHTS_POOL[Math.floor(rng() * NIGHTS_POOL.length)];
      const price = Math.round(d.base * (CFG.demo.priceJitterLo + rng() * CFG.demo.priceJitterSpan));
      const changes = d.km < 2500 ? (rng() < 0.7 ? 0 : 1) : (rng() < 0.35 ? 0 : 1);
      const dep = addDaysISO(todayISO, lead);
      fares.push({ dest: d.c, departDate: dep, returnDate: addDaysISO(dep, nights), price, changes, distanceKm: d.km });
    }
  }
  return fares;
}

// Outbound legs land on Thu/Fri so a weekend at the hub lines up. Onward and
// homeward legs are anchored to those dates so real combos always exist.
function buildDemoViaLegs(todayISO, hub) {
  const A = [], B = [], C = [];
  const rngA = mulberry32(hashSeed("A" + hub + todayISO.slice(0, 7)));
  const outDates = [];
  for (let d = 2; d < CFG.demo.maxLeadDays; d++) {
    const date = addDaysISO(todayISO, d);
    const dow = dowISO(date);
    if (dow === 4 || dow === 5) outDates.push(date);
  }
  for (const date of outDates) {
    A.push({ from: CFG.origin.iata, to: hub, date, price: Math.round(210 * (0.75 + rngA() * 0.6)), changes: rngA() < 0.6 ? 0 : 1, km: 3360 });
  }
  const AWAY_POOL = [2, 3, 3, 4, 5, 7];
  for (const d of DEMO_VIA_DESTS) {
    const rng = mulberry32(hashSeed(d.c + hub + todayISO.slice(0, 7)));
    const anchors = 4;
    for (let i = 0; i < anchors; i++) {
      const a = A[Math.floor(rng() * A.length)];
      if (!a) continue;
      const hubN = rng() < 0.5 ? 2 : 3;
      const depB = addDaysISO(a.date, hubN);
      const awayN = AWAY_POOL[Math.floor(rng() * AWAY_POOL.length)];
      B.push({ from: hub, to: d.c, date: depB, price: Math.round(d.baseB * (0.8 + rng() * 0.5)), changes: d.kmB < 2500 ? 0 : (rng() < 0.5 ? 0 : 1), km: d.kmB });
      C.push({ from: d.c, to: CFG.origin.iata, date: addDaysISO(depB, awayN), price: Math.round(d.baseC * (0.8 + rng() * 0.5)), changes: d.kmC < 3000 ? 0 : 1, km: d.kmC });
    }
    for (let i = 0; i < 2; i++) {
      const leadB = 4 + Math.floor(rng() * 80), leadC = 6 + Math.floor(rng() * 82);
      B.push({ from: hub, to: d.c, date: addDaysISO(todayISO, leadB), price: Math.round(d.baseB * (0.8 + rng() * 0.5)), changes: 0, km: d.kmB });
      C.push({ from: d.c, to: CFG.origin.iata, date: addDaysISO(todayISO, leadC), price: Math.round(d.baseC * (0.8 + rng() * 0.5)), changes: 1, km: d.kmC });
    }
  }
  return { A, B, C };
}

// ---- Live data: Travelpayouts / Aviasales cached prices ----

async function tpFetch(extraParams, token) {
  const all = [];
  for (let page = 1; page <= CFG.tp.pages; page++) {
    const params = new URLSearchParams({
      currency: CFG.currency, period_type: CFG.tp.periodType, sorting: "price",
      limit: String(CFG.tp.limit), page: String(page), token, ...extraParams,
    });
    const r = await fetch(CFG.tp.base + "?" + params, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!r.ok) throw new Error(`Travelpayouts ${r.status}`);
    const d = await r.json();
    if (!d || d.success === false) throw new Error(d && d.error ? String(d.error) : "Bad response");
    const rows = Array.isArray(d.data) ? d.data : [];
    all.push(...rows);
    if (rows.length < CFG.tp.limit) break;
  }
  return all;
}

async function fetchLiveFares(token) {
  const rows = await tpFetch({ origin: CFG.origin.iata, one_way: "false" }, token);
  return rows.map(t => ({
    dest: String(t.destination || ""),
    departDate: String(t.depart_date || ""),
    returnDate: String(t.return_date || ""),
    price: num(t.value),
    changes: num(t.number_of_changes, -1),
    distanceKm: num(t.distance),
  })).filter(f => f.dest && f.dest !== CFG.origin.iata);
}

async function fetchLiveLegs(token, hub) {
  const toLeg = t => ({
    from: String(t.origin || ""), to: String(t.destination || ""),
    date: String(t.depart_date || ""), price: num(t.value),
    changes: num(t.number_of_changes, -1), km: num(t.distance),
  });
  const [ra, rb, rc] = await Promise.all([
    tpFetch({ origin: CFG.origin.iata, destination: hub, one_way: "true" }, token),
    tpFetch({ origin: hub, one_way: "true" }, token),
    tpFetch({ destination: CFG.origin.iata, one_way: "true" }, token),
  ]);
  return { A: ra.map(toLeg), B: rb.map(toLeg), C: rc.map(toLeg) };
}

// ---- State ----

const todayISO = () => new Date().toLocaleDateString("en-CA");

function defaultState() {
  const t = todayISO();
  return {
    mode: "via",
    windowStart: t,
    windowEnd: addDaysISO(t, CFG.defaultWindowDays),
    preset: "weekend",
    hub: "YYZ",
    hubPreset: "weekend",
    awayPreset: "short",
    maxPrice: 0,
    maxHours: 0,
    token: "",
  };
}

function loadState() {
  const s = defaultState();
  try {
    const raw = JSON.parse(localStorage.getItem(CFG.storageKey) || "{}");
    for (const k of Object.keys(s)) if (raw[k] !== undefined) s[k] = raw[k];
  } catch {}
  if (s.windowEnd < todayISO()) { const d = defaultState(); s.windowStart = d.windowStart; s.windowEnd = d.windowEnd; }
  if (s.windowStart < todayISO()) s.windowStart = todayISO();
  if (s.windowEnd < s.windowStart) s.windowEnd = addDaysISO(s.windowStart, CFG.defaultWindowDays);
  if (!/^[A-Z]{3}$/.test(s.hub)) s.hub = "YYZ";
  return s;
}
function saveState(s) {
  try { localStorage.setItem(CFG.storageKey, JSON.stringify(s)); } catch {}
}

function presetOf(key) {
  return CFG.nightsPresets.find(p => p.key === key) || CFG.nightsPresets[0];
}

// ---- Formatting ----

const fmtPrice = p => "$" + Math.round(num(p)).toLocaleString("en-CA");
function fmtDay(iso) {
  const d = new Date(iso + "T12:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtRange(dep, ret) {
  const d1 = new Date(dep + "T12:00:00"), d2 = new Date(ret + "T12:00:00");
  if (isNaN(d1) || isNaN(d2)) return `${dep} to ${ret}`;
  const m1 = d1.toLocaleDateString("en-US", { month: "short" });
  const m2 = d2.toLocaleDateString("en-US", { month: "short" });
  return m1 === m2 ? `${m1} ${d1.getDate()} to ${d2.getDate()}` : `${m1} ${d1.getDate()} to ${m2} ${d2.getDate()}`;
}
const fmtNights = n => n === 1 ? "1 night" : `${n} nights`;
function fmtStops(c) {
  if (!Number.isFinite(c) || c < 0) return "";
  return c === 0 ? "nonstop" : c === 1 ? "1 stop" : `${c} stops`;
}
function fmtHours(h) {
  if (h === null) return "";
  return "~" + (Math.round(h * 2) / 2) + "h flight";
}
const cityName = code => CITIES[code] || code;
const gfLink = (from, to, dep, ret) =>
  "https://www.google.com/travel/flights?q=" +
  encodeURIComponent(ret ? `Flights from ${from} to ${to} on ${dep} through ${ret}` : `One way flights from ${from} to ${to} on ${dep}`);

// ---- Render ----

function chipRow(label, id, presets, activeKey) {
  const chips = presets.map(p =>
    `<button class="chip" type="button" data-key="${esc(p.key)}" aria-pressed="${activeKey === p.key ? "true" : "false"}">${esc(p.label)}</button>`
  ).join("");
  return `<div class="chip-group"><span class="lbl">${esc(label)}</span><div class="chips" id="${esc(id)}">${chips}</div></div>`;
}

function renderControls(s) {
  const modeChips = `<div class="chips" id="mode-chips">
    <button class="chip" type="button" data-key="via" aria-pressed="${s.mode === "via"}">Via a stop</button>
    <button class="chip" type="button" data-key="simple" aria-pressed="${s.mode === "simple"}">Round trip</button>
  </div>`;
  const dates = `<div class="ctl-dates" style="margin-top:.85rem">
    <label class="fld">Earliest leave<input type="date" id="win-start" value="${esc(s.windowStart)}" min="${esc(todayISO())}"></label>
    <label class="fld">Back by<input type="date" id="win-end" value="${esc(s.windowEnd)}" min="${esc(s.windowStart)}"></label>
  </div>`;
  const priceOpts = CFG.priceCaps.map(v =>
    `<option value="${v}" ${v === s.maxPrice ? "selected" : ""}>${v === 0 ? "Any price" : "Under " + fmtPrice(v)}</option>`
  ).join("");
  let body;
  if (s.mode === "via") {
    body = `
      <div class="ctl-row">
        <label class="fld">First stop<input type="text" id="hub-input" value="${esc(s.hub)}" maxlength="3" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
        <label class="fld">Budget (total)<select id="max-price">${priceOpts}</select></label>
      </div>
      ${chipRow("Nights in " + cityName(s.hub), "hub-chips", CFG.nightsPresets, s.hubPreset)}
      ${chipRow("Nights at the next stop", "away-chips", CFG.nightsPresets, s.awayPreset)}`;
  } else {
    const hourOpts = CFG.hourCaps.map(v =>
      `<option value="${v}" ${v === s.maxHours ? "selected" : ""}>${v === 0 ? "Any length" : "Under ~" + v + "h"}</option>`
    ).join("");
    body = `
      ${chipRow("Nights away", "preset-chips", CFG.nightsPresets, s.preset)}
      <div class="ctl-row">
        <label class="fld">Budget<select id="max-price">${priceOpts}</select></label>
        <label class="fld">Flight time<select id="max-hours">${hourOpts}</select></label>
      </div>`;
  }
  return `<section class="panel"><h2>Trip</h2>${modeChips}${dates}${body}</section>`;
}

function renderStatus(s, sourceKind, count, error) {
  const src = sourceKind === "live"
    ? `<span class="pill live">Live cache</span>`
    : `<span class="pill demo">Sample data</span>`;
  const shape = s.mode === "via" ? `CAD, 3 one-way legs` : `CAD, round trip`;
  const err = error ? ` <span>${esc(error)}</span>` : "";
  return `<div class="status">${src}<span>${count === 0 ? "No trips fit" : count + (count === 1 ? " place" : " places")}</span><span>${esc(shape)}</span>${err}</div>`;
}

function renderDest(d) {
  const b = d.best;
  const meta = [fmtRange(b.departDate, b.returnDate), fmtNights(nightsBetween(b.departDate, b.returnDate)), fmtStops(b.changes), fmtHours(estHours(b.distanceKm))]
    .filter(Boolean).join(`<span class="dot">·</span>`);
  const alts = d.options.slice(1).map(f => {
    const bits = [fmtRange(f.departDate, f.returnDate), fmtNights(nightsBetween(f.departDate, f.returnDate)), fmtStops(f.changes)].filter(Boolean).join(" · ");
    return `<div class="alt-row"><span>${esc(bits)}</span><span><a href="${esc(gfLink(CFG.origin.iata, d.dest, f.departDate, f.returnDate))}" target="_blank" rel="noopener">open</a> <span class="p">${esc(fmtPrice(f.price))}</span></span></div>`;
  }).join("");
  const moreBtn = alts ? `<button class="more-btn" type="button">${d.options.length - 1} more date${d.options.length > 2 ? "s" : ""} ›</button>` : "";
  return `<div class="dest-card">
    <div class="dest-top">
      <span class="dest-name">${esc(cityName(d.dest))}<span class="code">${esc(d.dest)}</span></span>
      <span class="dest-price">${esc(fmtPrice(b.price))}</span>
    </div>
    <div class="dest-meta">${meta}</div>
    <div class="dest-actions">
      <a href="${esc(gfLink(CFG.origin.iata, d.dest, b.departDate, b.returnDate))}" target="_blank" rel="noopener">Check on Google Flights</a>
      ${moreBtn}
    </div>
    ${alts ? `<div class="alt-rows">${alts}</div>` : ""}
  </div>`;
}

function renderViaDest(d, hub) {
  const b = d.best;
  const legRow = l => `<div class="leg-row">
    <span>${esc(cityName(l.from))} to ${esc(cityName(l.to))}</span>
    <span class="d">${esc(fmtDay(l.date))}</span>
    <a href="${esc(gfLink(l.from, l.to, l.date, ""))}" target="_blank" rel="noopener">open</a>
    <span class="p">${esc(fmtPrice(l.price))}</span>
  </div>`;
  const meta = `${esc(fmtNights(b.hubNights))} in ${esc(cityName(hub))}<span class="dot">·</span>${esc(fmtNights(b.awayNights))} in ${esc(cityName(d.dest))}`;
  const alts = d.options.slice(1).map(x =>
    `<div class="alt-row"><span>${esc(fmtRange(x.a.date, x.c.date))} · ${x.hubNights}+${x.awayNights} nights</span><span class="p">${esc(fmtPrice(x.total))}</span></div>`
  ).join("");
  const moreBtn = alts ? `<button class="more-btn" type="button">${d.options.length - 1} more combo${d.options.length > 2 ? "s" : ""} ›</button>` : "";
  return `<div class="dest-card">
    <div class="dest-top">
      <span class="dest-name">${esc(cityName(d.dest))}<span class="code">${esc(d.dest)}</span></span>
      <span class="dest-price">${esc(fmtPrice(b.total))}<span class="unit">total</span></span>
    </div>
    <div class="dest-meta">${meta}</div>
    <div class="leg-rows">${legRow(b.a)}${legRow(b.b)}${legRow(b.c)}</div>
    ${moreBtn ? `<div class="dest-actions">${moreBtn}</div>` : ""}
    ${alts ? `<div class="alt-rows">${alts}</div>` : ""}
  </div>`;
}

function renderResults(s, ranked, sourceKind, error) {
  const cards = s.mode === "via" ? ranked.map(d => renderViaDest(d, s.hub)) : ranked.map(renderDest);
  const list = ranked.length
    ? `<div class="dest-list">${cards.join("")}</div>`
    : `<div class="panel empty">Nothing fits. Widen the dates, allow more nights, or raise the budget.</div>`;
  return renderStatus(s, sourceKind, ranked.length, error) + list;
}

function renderTokenPanel(s) {
  return `<section class="panel">
    <details>
      <summary>Live prices</summary>
      <div class="token-body">
        <p>Sample data is shown until you add a free Travelpayouts token. Sign up at <a href="https://www.travelpayouts.com" target="_blank" rel="noopener">travelpayouts.com</a>, copy the API token from your profile, paste it here.</p>
        <div class="token-row">
          <input type="text" id="token-input" placeholder="API token" value="${esc(s.token)}" autocomplete="off" spellcheck="false">
          <button class="btn" type="button" id="token-save">Save</button>
        </div>
        <p>Prices come from the Aviasales search cache. Treat them as leads, not quotes. Multi-stop combos need cached one-ways that line up, so live results can be thin; sample data always works.</p>
      </div>
    </details>
  </section>`;
}

// ---- App ----

const app = {
  state: loadState(),
  fares: null,
  legs: null,
  sourceKind: "demo",
  error: "",
};

function currentOpts() {
  const s = app.state;
  if (s.mode === "via") {
    const hp = presetOf(s.hubPreset), ap = presetOf(s.awayPreset);
    return {
      windowStart: s.windowStart, windowEnd: s.windowEnd,
      hub: s.hub, origin: CFG.origin.iata,
      hubMin: hp.min, hubMax: hp.max, awayMin: ap.min, awayMax: ap.max,
      maxPrice: num(s.maxPrice),
    };
  }
  const p = presetOf(s.preset);
  return {
    windowStart: s.windowStart, windowEnd: s.windowEnd,
    minNights: p.min, maxNights: p.max,
    maxPrice: num(s.maxPrice), maxHours: num(s.maxHours),
  };
}

function refreshResults() {
  const o = currentOpts();
  const ranked = app.state.mode === "via"
    ? (app.legs ? planVia(app.legs.A, app.legs.B, app.legs.C, o) : [])
    : (app.fares ? rankDestinations(app.fares, o) : []);
  document.getElementById("results").innerHTML = renderResults(app.state, ranked, app.sourceKind, app.error);
}

async function loadData() {
  app.error = "";
  const s = app.state;
  if (s.token) {
    try {
      if (s.mode === "via") app.legs = await fetchLiveLegs(s.token, s.hub);
      else app.fares = await fetchLiveFares(s.token);
      app.sourceKind = "live";
      return;
    } catch (e) {
      app.error = "Live fetch failed (" + (e && e.message || e) + "). Showing sample data.";
    }
  }
  if (s.mode === "via") app.legs = buildDemoViaLegs(todayISO(), s.hub);
  else app.fares = buildDemoFares(todayISO());
  app.sourceKind = "demo";
}

async function reload() {
  document.getElementById("results").innerHTML = `<div class="loading">Finding trips...</div>`;
  await loadData();
  refreshResults();
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = `
    <section class="hero">
      <div class="hero-head">From ${esc(CFG.origin.city)} (${esc(CFG.origin.iata)})</div>
      <h1>Where can I go?</h1>
      <p>Pick your window and how long you can be gone. Cheapest trips that fit, ranked.</p>
    </section>
    ${renderControls(app.state)}
    <div id="results"><div class="loading">Finding trips...</div></div>
    ${renderTokenPanel(app.state)}
    <div class="footer">From ${esc(CFG.origin.iata)} . prototype</div>
  `;

  const q = sel => root.querySelector(sel);
  const on = (sel, ev, fn) => { const el = q(sel); if (el) el.addEventListener(ev, fn); };
  const onChange = () => { saveState(app.state); refreshResults(); };
  const chipHandler = (id, fn) => on(id, "click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    fn(btn.dataset.key);
    for (const c of q(id).querySelectorAll(".chip")) c.setAttribute("aria-pressed", String(c === btn));
    onChange();
  });

  on("#win-start", "change", e => {
    app.state.windowStart = e.target.value || todayISO();
    if (app.state.windowEnd < app.state.windowStart) app.state.windowEnd = app.state.windowStart;
    const end = q("#win-end");
    if (end) { end.min = app.state.windowStart; end.value = app.state.windowEnd; }
    onChange();
  });
  on("#win-end", "change", e => {
    app.state.windowEnd = e.target.value || app.state.windowStart;
    onChange();
  });

  on("#mode-chips", "click", e => {
    const btn = e.target.closest(".chip");
    if (!btn || btn.dataset.key === app.state.mode) return;
    app.state.mode = btn.dataset.key;
    saveState(app.state);
    render();
    const need = app.state.mode === "via" ? !app.legs : !app.fares;
    if (need) reload(); else refreshResults();
  });

  chipHandler("#preset-chips", k => { app.state.preset = k; });
  chipHandler("#hub-chips", k => { app.state.hubPreset = k; });
  chipHandler("#away-chips", k => { app.state.awayPreset = k; });

  on("#max-price", "change", e => { app.state.maxPrice = num(e.target.value); onChange(); });
  on("#max-hours", "change", e => { app.state.maxHours = num(e.target.value); onChange(); });

  on("#hub-input", "change", e => {
    const v = String(e.target.value || "").trim().toUpperCase();
    if (!/^[A-Z]{3}$/.test(v)) { e.target.value = app.state.hub; return; }
    if (v === app.state.hub) return;
    app.state.hub = v;
    e.target.value = v;
    saveState(app.state);
    app.legs = null;
    render();
    reload();
  });

  on("#token-save", "click", async () => {
    app.state.token = q("#token-input").value.trim();
    saveState(app.state);
    app.fares = null;
    app.legs = null;
    reload();
  });

  const results = document.getElementById("results");
  results.addEventListener("click", e => {
    const btn = e.target.closest(".more-btn");
    if (!btn) return;
    const card = btn.closest(".dest-card");
    if (card) card.classList.toggle("open");
  });
}

(async () => {
  try {
    render();
    await loadData();
    refreshResults();
  } catch (e) {
    document.getElementById("root").innerHTML =
      `<section class="panel err"><strong>Something broke</strong>${esc(e && e.message || String(e))}</section>`;
  }
})();
</script>

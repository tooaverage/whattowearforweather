<script>
"use strict";

const num = (v, fallback = 0) => {
  const n = typeof v === "number" ? v : Number(v);
  return Number.isFinite(n) ? n : fallback;
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const CFG = {

    { from: "2026-08-20", to: "2026-08-20", status: "no", note: "conference" },
    { from: "2026-08-21", to: "2026-08-23", status: "maybe", note: "magazine party Aug 21, boat day Aug 22, hungover risk" },
    { from: "2026-08-24", to: "2026-08-27", status: "yes", note: "clear midweek" },
    { from: "2026-08-28", to: "2026-08-30", status: "maybe", note: "free weekend, might be moving" },
    { from: "2026-08-31", to: "2026-09-03", status: "yes", note: "clear midweek" },
    { from: "2026-09-04", to: "2026-09-06", status: "yes", note: "best weekend option, Jordan's dates TBD" },
    { from: "2026-09-07", to: "2026-09-10", status: "maybe", note: "works if back before Priya leaves Sep 11" },
    { from: "2026-09-11", to: "2026-09-13", status: "no", note: "Priya away" },
    { from: "2026-09-14", to: "2026-09-17", status: "maybe", note: "gap before wedding weekend" },
    { from: "2026-09-18", to: "2026-09-20", status: "no", note: "wedding events" },
    { from: "2026-09-21", to: "2026-09-30", status: "no", note: "Priya visits Vancouver soon after, not worth it" },
  ],
  suggestions: ["2026-08-22", "2026-08-29", "2026-09-05"],
  candidateArriveDaysBefore: 3,
  candidateReturnDays: 16,
  priceCaps: [0, 200, 300, 400, 600, 800, 1200, 1600, 2000],
  hourCaps: [0, 3, 5, 8, 12],
  cruiseKmh: 780,
  taxiPadH: 0.7,
  maxOptionsPerDest: 6,
  maxDestsShown: 40,
  via: { maxOutboundLegs: 30, maxLegsPerDest: 15 },
  trains: {
    YYZ: [
      { c: "YUL", h: 5.2, price: 89, url: "https://www.viarail.ca" },
      { c: "YOW", h: 4.4, price: 79, url: "https://www.viarail.ca" },
      { c: "YQB", h: 6.6, price: 115, url: "https://www.viarail.ca" },
      { c: "NYC", h: 12.8, price: 160, url: "https://www.amtrak.com" },
    ],
  },
  trainHorizonDays: 100,
  tp: { base: "https://api.travelpayouts.com/v2/prices/latest", limit: 1000, pages: 2, periodType: "year" },
  demo: { minLeadDays: 2, maxLeadDays: 95, optionsPerDest: 6, priceJitterLo: 0.82, priceJitterSpan: 0.55 },
  storageKey: "wcig.v1",
};

const CITIES = {
  SEA: "Seattle", PDX: "Portland", SFO: "San Francisco", LAX: "Los Angeles", SAN: "San Diego",
  LAS: "Las Vegas", PHX: "Phoenix", DEN: "Denver", SLC: "Salt Lake City", ORD: "Chicago", CHI: "Chicago",
  MSP: "Minneapolis", DFW: "Dallas", IAH: "Houston", HOU: "Houston", ATL: "Atlanta", MIA: "Miami",
  MCO: "Orlando", JFK: "New York", EWR: "New York", NYC: "New York", BOS: "Boston", WAS: "Washington",
  IAD: "Washington", DCA: "Washington", PHL: "Philadelphia", AUS: "Austin", ANC: "Anchorage",
  HNL: "Honolulu", OGG: "Maui", KOA: "Kona", LIH: "Kauai",
  YLW: "Kelowna", YYJ: "Victoria", YYC: "Calgary", YEG: "Edmonton", YXE: "Saskatoon", YQR: "Regina",
  YWG: "Winnipeg", YYZ: "Toronto", YTO: "Toronto", YUL: "Montreal", YMQ: "Montreal", YOW: "Ottawa",
  YHZ: "Halifax", YQB: "Quebec City",
  MEX: "Mexico City", CUN: "Cancun", PVR: "Puerto Vallarta", SJD: "Los Cabos", GDL: "Guadalajara",
  SJO: "San Jose, CR", PTY: "Panama City", LIM: "Lima", BOG: "Bogota", HAV: "Havana",
  NAS: "Nassau", BDA: "Bermuda", SJU: "San Juan",
  LHR: "London", LGW: "London", LON: "London", CDG: "Paris", PAR: "Paris", AMS: "Amsterdam",
  FRA: "Frankfurt", MUC: "Munich", ZRH: "Zurich", DUB: "Dublin", MAD: "Madrid", BCN: "Barcelona",
  LIS: "Lisbon", FCO: "Rome", ROM: "Rome", IST: "Istanbul", ATH: "Athens", KEF: "Reykjavik",
  NRT: "Tokyo", HND: "Tokyo", TYO: "Tokyo", KIX: "Osaka", ICN: "Seoul", SEL: "Seoul", TPE: "Taipei",
  HKG: "Hong Kong", PVG: "Shanghai", SHA: "Shanghai", PEK: "Beijing", BJS: "Beijing", CAN: "Guangzhou",
  MNL: "Manila", BKK: "Bangkok", SGN: "Ho Chi Minh City", SIN: "Singapore", KUL: "Kuala Lumpur",
  DPS: "Bali", DEL: "Delhi", BOM: "Mumbai", SYD: "Sydney", MEL: "Melbourne", BNE: "Brisbane",
  AKL: "Auckland", NAN: "Fiji", PPT: "Tahiti", DXB: "Dubai", DOH: "Doha", TLV: "Tel Aviv",
};

const AIRLINES = {
  AC: "Air Canada", WS: "WestJet", PD: "Porter", F8: "Flair", TS: "Transat",
  UA: "United", DL: "Delta", AS: "Alaska", B6: "JetBlue", AA: "American",
};

// Month-based go/no-go ratings. m: months the rule covers.
const HURRICANE = [{ m: [8, 9, 10], tag: "bad", label: "hurricane season" }];
const EURO_SEASON = [
  { m: [7, 8], tag: "high", label: "high season" },
  { m: [5, 6, 9], tag: "good", label: "shoulder season" },
];
const SEASONS = {
  NAS: HURRICANE, HAV: HURRICANE, SJU: HURRICANE, BDA: HURRICANE,
  MIA: HURRICANE, MCO: HURRICANE, CUN: HURRICANE,
  LHR: EURO_SEASON, CDG: EURO_SEASON, AMS: EURO_SEASON, DUB: EURO_SEASON,
  LIS: EURO_SEASON, FCO: EURO_SEASON, BCN: EURO_SEASON,
  KEF: [{ m: [6, 7, 8], tag: "good", label: "best months" }],
  LAS: [{ m: [7, 8], tag: "bad", label: "extreme heat" }],
  PHX: [{ m: [6, 7, 8], tag: "bad", label: "extreme heat" }],
  MEX: [{ m: [6, 7, 8, 9], tag: "high", label: "rainy afternoons" }],
};

// ---- Engine (pure: no DOM, no fetch, no clock) ----

function nightsBetween(depISO, retISO) {
  const a = Date.parse(depISO + "T12:00:00Z"), b = Date.parse(retISO + "T12:00:00Z");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return NaN;
  return Math.round((b - a) / 86400000);
}

const monthOf = iso => parseInt(String(iso).slice(5, 7), 10);

function seasonInfo(dest, month) {
  const rules = SEASONS[dest];
  if (!rules) return null;
  for (const r of rules) if (r.m.includes(month)) return r;
  return null;
}

function dayStatus(iso) {
  for (const r of CFG.availability) if (iso >= r.from && iso <= r.to) return r;
  return null;
}

function estHours(distanceKm) {
  const km = num(distanceKm, 0);
  if (km <= 0) return null;
  return km / CFG.cruiseKmh + CFG.taxiPadH;
}

function tripFits(f, o) {
  if (!f || !f.departDate || !f.returnDate) return false;
  if (!(f.price > 0)) return false;
  if (f.departDate < o.windowStart || f.departDate > o.windowEnd) return false;
  if (f.returnDate > o.windowEnd) return false;
  const n = nightsBetween(f.departDate, f.returnDate);
  if (!Number.isFinite(n) || n < o.minNights || n > o.maxNights) return false;
  if (o.maxPrice > 0 && f.price > o.maxPrice) return false;
  if (o.maxHours > 0) {
    const h = estHours(f.distanceKm);
    if (h !== null && h > o.maxHours) return false;
  }
  return true;
}

function rankDestinations(fares, o) {
  const exc = new Set(o.excluded || []);
  const byDest = new Map();
  for (const f of fares) {
    if (exc.has(f.dest) || !tripFits(f, o)) continue;
    if (!byDest.has(f.dest)) byDest.set(f.dest, []);
    byDest.get(f.dest).push(f);
  }
  const out = [];
  for (const [dest, list] of byDest) {
    list.sort((a, b) => a.price - b.price || (a.departDate < b.departDate ? -1 : 1));
    out.push({ dest, best: list[0], options: list.slice(0, CFG.maxOptionsPerDest) });
  }
  out.sort((a, b) => a.best.price - b.best.price);
  return out.slice(0, CFG.maxDestsShown);
}

// Open-jaw: origin -> hub (hubMin..hubMax nights) -> X (awayMin..awayMax nights) -> origin.
// o.arriveFrom/arriveTo bound the outbound date (defaults: whole window).
function planVia(legsA, legsB, legsC, o) {
  const exc = new Set(o.excluded || []);
  const aFrom = o.arriveFrom || o.windowStart, aTo = o.arriveTo || o.windowEnd;
  const inWin = l => l && l.date >= o.windowStart && l.date <= o.windowEnd && l.price > 0;
  const A = legsA.filter(l => inWin(l) && l.date >= aFrom && l.date <= aTo)
    .sort((x, y) => x.price - y.price).slice(0, CFG.via.maxOutboundLegs);
  if (!A.length) return [];
  const byDest = new Map(), toHome = new Map();
  for (const l of legsB) {
    if (!inWin(l) || !l.to || l.to === o.hub || l.to === o.origin || exc.has(l.to)) continue;
    if (!byDest.has(l.to)) byDest.set(l.to, []);
    byDest.get(l.to).push(l);
  }
  for (const l of legsC) {
    if (!inWin(l) || !l.from || l.from === o.hub || l.from === o.origin || exc.has(l.from)) continue;
    if (!toHome.has(l.from)) toHome.set(l.from, []);
    toHome.get(l.from).push(l);
  }
  const hubOk = b => A.some(a => {
    const n = nightsBetween(a.date, b.date);
    return Number.isFinite(n) && n >= o.hubMin && n <= o.hubMax;
  });
  const out = [];
  for (const [dest, bAll] of byDest) {
    const cAll = toHome.get(dest);
    if (!cAll) continue;
    const bs = bAll.filter(hubOk).sort((x, y) => x.price - y.price).slice(0, CFG.via.maxLegsPerDest);
    const cs = cAll.sort((x, y) => x.price - y.price).slice(0, CFG.via.maxLegsPerDest);
    const combos = [];
    for (const a of A) {
      for (const b of bs) {
        const hubN = nightsBetween(a.date, b.date);
        if (!Number.isFinite(hubN) || hubN < o.hubMin || hubN > o.hubMax) continue;
        if (o.avoidBadSeason) {
          const se = seasonInfo(dest, monthOf(b.date));
          if (se && se.tag === "bad") continue;
        }
        for (const c of cs) {
          const awayN = nightsBetween(b.date, c.date);
          if (!Number.isFinite(awayN) || awayN < o.awayMin || awayN > o.awayMax) continue;
          const total = a.price + b.price + c.price;
          if (o.maxPrice > 0 && total > o.maxPrice) continue;
          combos.push({ a, b, c, total, hubNights: hubN, awayNights: awayN });
        }
      }
    }
    if (!combos.length) continue;
    combos.sort((x, y) => x.total - y.total);
    out.push({ dest, best: combos[0], options: combos.slice(0, CFG.maxOptionsPerDest) });
  }
  out.sort((x, y) => x.best.total - y.best.total);
  return out.slice(0, CFG.maxDestsShown);
}

// The no-stop comparison: origin -> hub, stay hubMin..hubMax nights, hub -> origin.
function baselineTrip(legsA, legsHome, o) {
  const aFrom = o.arriveFrom || o.windowStart, aTo = o.arriveTo || o.windowEnd;
  const inWin = l => l && l.date >= o.windowStart && l.date <= o.windowEnd && l.price > 0;
  let best = null;
  for (const a of legsA) {
    if (!inWin(a) || a.date < aFrom || a.date > aTo) continue;
    for (const h of legsHome) {
      if (!inWin(h)) continue;
      const n = nightsBetween(a.date, h.date);
      if (!Number.isFinite(n) || n < o.hubMin || n > o.hubMax) continue;
      const total = a.price + h.price;
      if (!best || total < best.total) best = { a, h, total, nights: n };
    }
  }
  return best;
}

function hashSeed(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const addDaysISO = (iso, n) => {
  const d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const dowISO = iso => new Date(iso + "T12:00:00Z").getUTCDay();
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

function buildDemoFares(todayISO) {
  const NIGHTS_POOL = [2, 2, 3, 3, 4, 5, 7, 9];
  const fares = [];
  for (const d of DEMO_DESTS) {
    const rng = mulberry32(hashSeed(d.c + todayISO.slice(0, 7)));
    for (let i = 0; i < CFG.demo.optionsPerDest; i++) {
      const lead = CFG.demo.minLeadDays + Math.floor(rng() * (CFG.demo.maxLeadDays - CFG.demo.minLeadDays));
      const nights = NIGHTS_POOL[Math.floor(rng() * NIGHTS_POOL.length)];
      const price = Math.round(d.base * (CFG.demo.priceJitterLo + rng() * CFG.demo.priceJitterSpan));
      const changes = d.km < 2500 ? (rng() < 0.7 ? 0 : 1) : (rng() < 0.35 ? 0 : 1);
      const dep = addDaysISO(todayISO, lead);
      fares.push({ dest: d.c, departDate: dep, returnDate: addDaysISO(dep, nights), price, changes, distanceKm: d.km, airline: pick(rng, ["AC", "WS", "F8", "PD"]) });
    }
  }
  return fares;
}

// Outbound legs land Wed-Sat so a weekend at the hub lines up. Onward and
// homeward legs are anchored to those dates so real combos always exist.
function buildDemoViaLegs(todayISO, hub) {
  const A = [], B = [], C = [];
  const rngA = mulberry32(hashSeed("A" + hub + todayISO.slice(0, 7)));
  for (let d = 2; d < CFG.demo.maxLeadDays; d++) {
    const date = addDaysISO(todayISO, d);
    const dow = dowISO(date);
    if (dow >= 3 && dow <= 6) {
      A.push({ from: CFG.origin.iata, to: hub, date, price: Math.round(210 * (0.75 + rngA() * 0.6)), changes: rngA() < 0.6 ? 0 : 1, km: 3360, airline: pick(rngA, ["AC", "WS", "F8", "PD"]) });
    }
    if (dow === 0 || dow === 1 || dow === 2) {
      C.push({ from: hub, to: CFG.origin.iata, date, price: Math.round(215 * (0.75 + rngA() * 0.6)), changes: rngA() < 0.6 ? 0 : 1, km: 3360, airline: pick(rngA, ["AC", "WS", "PD"]) });

    const rng = mulberry32(hashSeed(d.c + hub + todayISO.slice(0, 7)));
    for (const sat of anchorDates) {
      const arrive = addDaysISO(sat, -(1 + Math.floor(rng() * 2)));
      const hubN = rng() < 0.5 ? 2 : 3;
      const depB = addDaysISO(arrive, hubN);
      const awayN = pick(rng, AWAY_POOL);
      B.push({ from: hub, to: d.c, date: depB, price: Math.round(d.baseB * (0.8 + rng() * 0.5)), changes: d.kmB < 2500 ? 0 : (rng() < 0.5 ? 0 : 1), km: d.kmB, airline: pick(rng, ["AC", "PD", "WS", "UA", "DL"]) });

// ---- Live data: Travelpayouts / Aviasales cached prices ----

async function tpFetch(extraParams, token) {
  const all = [];
  for (let page = 1; page <= CFG.tp.pages; page++) {
    const params = new URLSearchParams({
      currency: CFG.currency, period_type: CFG.tp.periodType, sorting: "price",
      limit: String(CFG.tp.limit), page: String(page), token, ...extraParams,
    });
    const r = await fetch(CFG.tp.base + "?" + params, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!r.ok) throw new Error(`Travelpayouts ${r.status}`);
    const d = await r.json();
    if (!d || d.success === false) throw new Error(d && d.error ? String(d.error) : "Bad response");
    const rows = Array.isArray(d.data) ? d.data : [];
    all.push(...rows);
    if (rows.length < CFG.tp.limit) break;
  }
  return all;
}

async function fetchLiveFares(token) {
  const rows = await tpFetch({ origin: CFG.origin.iata, one_way: "false" }, token);
  return rows.map(t => ({
    dest: String(t.destination || ""),
    departDate: String(t.depart_date || ""),
    returnDate: String(t.return_date || ""),
    price: num(t.value),
    changes: num(t.number_of_changes, -1),
    distanceKm: num(t.distance),
    airline: t.airline ? String(t.airline) : "",
  })).filter(f => f.dest && f.dest !== CFG.origin.iata);
}

async function fetchLiveLegs(token, hub) {
  const toLeg = t => ({
    from: String(t.origin || ""), to: String(t.destination || ""),
    date: String(t.depart_date || ""), price: num(t.value),
    changes: num(t.number_of_changes, -1), km: num(t.distance),
    airline: t.airline ? String(t.airline) : "",
  });
  const [ra, rb, rc] = await Promise.all([
    tpFetch({ origin: CFG.origin.iata, destination: hub, one_way: "true" }, token),
    tpFetch({ origin: hub, one_way: "true" }, token),
    tpFetch({ destination: CFG.origin.iata, one_way: "true" }, token),
  ]);
  return { A: ra.map(toLeg), B: rb.map(toLeg), C: rc.map(toLeg) };
}

// ---- State ----

const todayISO = () => new Date().toLocaleDateString("en-CA");

function defaultState() {
  const t = todayISO();
  return {
    mode: "via",
    anchor: CFG.suggestions.find(d => d >= t) || addDaysISO(t, 14),
    windowStart: t,
    windowEnd: addDaysISO(t, CFG.defaultWindowDays),
    preset: "weekend",
    hub: "YYZ",
    hubPreset: "weekend",
    awayPreset: "short",
    avoidBad: true,
    excluded: ["YQB", "YHZ"],
    maxPrice: 0,
    maxHours: 0,
    token: "",
  };
}

function loadState() {
  const s = defaultState();
  try {
    const raw = JSON.parse(localStorage.getItem(CFG.storageKey) || "{}");
    for (const k of Object.keys(s)) if (raw[k] !== undefined) s[k] = raw[k];
  } catch {}
  if (s.windowEnd < todayISO()) { const d = defaultState(); s.windowStart = d.windowStart; s.windowEnd = d.windowEnd; }
  if (s.windowStart < todayISO()) s.windowStart = todayISO();
  if (s.windowEnd < s.windowStart) s.windowEnd = addDaysISO(s.windowStart, CFG.defaultWindowDays);
  if (!/^[A-Z]{3}$/.test(s.hub)) s.hub = "YYZ";
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s.anchor)) || s.anchor < todayISO()) s.anchor = defaultState().anchor;
  if (!Array.isArray(s.excluded)) s.excluded = [];
  s.excluded = s.excluded.filter(x => /^[A-Z]{3}$/.test(String(x)));
  return s;
}
function saveState(s) {
  try { localStorage.setItem(CFG.storageKey, JSON.stringify(s)); } catch {}
}

function presetOf(key) {
  return CFG.nightsPresets.find(p => p.key === key) || CFG.nightsPresets[0];
}

const fmtPrice = p => "$" + Math.round(num(p)).toLocaleString("en-CA");
function fmtDay(iso) {
  const d = new Date(iso + "T12:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function fmtRange(dep, ret) {
  const d1 = new Date(dep + "T12:00:00"), d2 = new Date(ret + "T12:00:00");
  if (isNaN(d1) || isNaN(d2)) return `${dep} to ${ret}`;
  const m1 = d1.toLocaleDateString("en-US", { month: "short" });
  const m2 = d2.toLocaleDateString("en-US", { month: "short" });
  return m1 === m2 ? `${m1} ${d1.getDate()} to ${d2.getDate()}` : `${m1} ${d1.getDate()} to ${m2} ${d2.getDate()}`;
}
const fmtNights = n => n === 1 ? "1 night" : `${n} nights`;
function fmtStops(c) {
  if (!Number.isFinite(c) || c < 0) return "";
  return c === 0 ? "nonstop" : c === 1 ? "1 stop" : `${c} stops`;
}
function fmtHours(h) {
  if (h === null) return "";
  return "~" + (Math.round(h * 2) / 2) + "h";
}

// ---- Options ----

function optsForAnchor(anchorISO, s) {
  const base = {
    hub: s.hub, origin: CFG.origin.iata,
    hubMin: presetOf(s.hubPreset).min, hubMax: presetOf(s.hubPreset).max,
    awayMin: presetOf(s.awayPreset).min, awayMax: presetOf(s.awayPreset).max,
    maxPrice: num(s.maxPrice), excluded: s.excluded, avoidBadSeason: !!s.avoidBad,
  };
  if (!anchorISO) return { ...base, windowStart: s.windowStart, windowEnd: s.windowEnd };
  const arriveFrom = addDaysISO(anchorISO, -CFG.candidateArriveDaysBefore);
  return {
    ...base,
    windowStart: arriveFrom,
    windowEnd: addDaysISO(anchorISO, CFG.candidateReturnDays),
    arriveFrom,
    arriveTo: anchorISO,
  };
}

  return `<section class="panel" id="cal-panel"><h2>When</h2>${months}
    <div class="cal-legend">
      <span><span class="sw" style="background:rgba(110,231,183,.5)"></span>works</span>
      <span><span class="sw" style="background:rgba(252,211,77,.5)"></span>could work</span>
      <span><span class="sw" style="background:rgba(244,63,94,.4)"></span>no</span>
    </div>
    <div class="cal-note" id="cal-note">${esc(fmtDay(s.anchor))}: ${esc(st ? st.note : "no notes")}</div>
  </section>`;
}

function renderCandStrip(sums, activeKey, hub) {
  const cards = sums.map(x => `<button class="cand-mini" type="button" data-cand="${esc(x.key)}" aria-pressed="${x.key === activeKey ? "true" : "false"}">
    <span class="cl">${esc(x.label)}</span>
    <span class="cn">${esc(x.note)}</span>
    <span class="cb">${x.base ? esc(cityName(hub)) + " " + esc(fmtPrice(x.base)) : "no fare found"}</span>
    <span class="cs">${x.best ? "+stop from " + esc(fmtPrice(x.best)) : ""}</span>
  </button>`).join("");
  return `<div class="cand-strip">${cards}</div>`;
}

function renderStatus(s, sourceKind, count, error) {
  const src = sourceKind === "live"
    ? `<span class="pill live">Live cache</span>`
    : `<span class="pill demo">Sample data</span>`;
  const shape = s.mode === "via" ? `CAD, 3 legs total` : `CAD, round trip`;
  const skips = s.excluded.length
    ? `<button class="linkish" type="button" data-reset-skips>skipped ${s.excluded.length}, reset</button>` : "";
  const err = error ? ` <span>${esc(error)}</span>` : "";
  return `<div class="status">${src}<span>${count === 0 ? "No trips fit" : count + (count === 1 ? " place" : " places")}</span><span>${esc(shape)}</span>${skips}${err}</div>`;
}

function legRow(l) {
  const isTrain = l.mode === "train";
  const dur = isTrain ? l.trainH + "h train" : fmtHours(estHours(l.km)) && (fmtHours(estHours(l.km)) + " flight");
  const sub = [AIRLINES[l.airline] || l.airline, isTrain ? "" : fmtStops(l.changes), dur].filter(Boolean).join(" · ");
  const href = isTrain ? l.url : gfLink(l.from, l.to, l.date, "");
  return `<div class="leg-row">
    <span>${esc(cityName(l.from))} to ${esc(cityName(l.to))}${isTrain ? " 🚆" : ""}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span>
    <span class="d">${esc(fmtDay(l.date))}</span>
    <a href="${esc(href)}" target="_blank" rel="noopener">open</a>
    <span class="p">${esc(fmtPrice(l.price))}</span>
  </div>`;
}

function seasonPill(dest, month) {
  const se = seasonInfo(dest, month);
  if (!se) return "";
  const ic = se.tag === "bad" ? "🌀 " : se.tag === "high" ? "☀️ " : "✨ ";
  return `<span class="season ${esc(se.tag)}">${ic}${esc(se.label)}</span>`;
}

function renderBaselineCard(base, hub) {
  if (!base) return "";
  return `<div class="dest-card baseline">
    <div class="dest-top">
      <span class="dest-name">${esc(cityName(hub))} only, no stop</span>
      <span class="dest-price">${esc(fmtPrice(base.total))}<span class="unit">total</span></span>
    </div>
    <div class="dest-meta">${esc(fmtRange(base.a.date, base.h.date))}<span class="dot">·</span>${esc(fmtNights(base.nights))}</div>
    <div class="leg-rows">${legRow(base.a)}${legRow(base.h)}</div>
  </div>`;
}

function renderViaDest(d, hub, baseTotal) {
  const b = d.best;
  const delta = baseTotal ? b.total - baseTotal : null;
  const deltaHtml = delta === null ? "" :
    `<span class="dot">·</span><span class="delta">${delta >= 0 ? "+" : "-"}${esc(fmtPrice(Math.abs(delta)))} vs ${esc(cityName(hub))} only</span>`;
  const meta = `${esc(fmtNights(b.hubNights))} in ${esc(cityName(hub))}<span class="dot">·</span>${esc(fmtNights(b.awayNights))} in ${esc(cityName(d.dest))}${deltaHtml}${seasonPill(d.dest, monthOf(b.b.date))}`;
  const alts = d.options.slice(1).map(x =>
    `<div class="alt-row"><span>${esc(fmtRange(x.a.date, x.c.date))} · ${x.hubNights}+${x.awayNights} nights${x.b.mode === "train" ? " · 🚆" : ""}</span><span class="p">${esc(fmtPrice(x.total))}</span></div>`
  ).join("");
  const moreBtn = alts ? `<button class="more-btn" type="button">${d.options.length - 1} more combo${d.options.length > 2 ? "s" : ""} ›</button>` : "";
  return `<div class="dest-card">
    <div class="dest-top">
      <span class="dest-name">${esc(cityName(d.dest))}<span class="code">${esc(d.dest)}</span></span>
      <span class="dest-price">${esc(fmtPrice(b.total))}<span class="unit">total</span></span>
      <button class="skip-btn" type="button" data-skip="${esc(d.dest)}" aria-label="skip ${esc(cityName(d.dest))}">✕</button>
    </div>
    <div class="dest-meta">${meta}</div>
    <div class="leg-rows">${legRow(b.a)}${legRow(b.b)}${legRow(b.c)}</div>
    ${moreBtn ? `<div class="dest-actions">${moreBtn}</div>` : ""}
    ${alts ? `<div class="alt-rows">${alts}</div>` : ""}
  </div>`;
}

function renderDest(d) {
  const b = d.best;
  const airline = AIRLINES[b.airline] || b.airline || "";
  const flightBits = [airline, fmtStops(b.changes), fmtHours(estHours(b.distanceKm)) && (fmtHours(estHours(b.distanceKm)) + " flight")].filter(Boolean).join(" · ");
  const meta = [fmtRange(b.departDate, b.returnDate), fmtNights(nightsBetween(b.departDate, b.returnDate)), flightBits]
    .filter(Boolean).map(esc).join(`<span class="dot">·</span>`) + seasonPill(d.dest, monthOf(b.departDate));
  const alts = d.options.slice(1).map(f => {
    const bits = [fmtRange(f.departDate, f.returnDate), fmtNights(nightsBetween(f.departDate, f.returnDate)), fmtStops(f.changes)].filter(Boolean).join(" · ");
    return `<div class="alt-row"><span>${esc(bits)}</span><span><a href="${esc(gfLink(CFG.origin.iata, f.dest || d.dest, f.departDate, f.returnDate))}" target="_blank" rel="noopener">open</a> <span class="p">${esc(fmtPrice(f.price))}</span></span></div>`;
  }).join("");
  const moreBtn = alts ? `<button class="more-btn" type="button">${d.options.length - 1} more date${d.options.length > 2 ? "s" : ""} ›</button>` : "";
  return `<div class="dest-card">
    <div class="dest-top">
      <span class="dest-name">${esc(cityName(d.dest))}<span class="code">${esc(d.dest)}</span></span>
      <span class="dest-price">${esc(fmtPrice(b.price))}</span>
      <button class="skip-btn" type="button" data-skip="${esc(d.dest)}" aria-label="skip ${esc(cityName(d.dest))}">✕</button>
    </div>
    <div class="dest-meta">${meta}</div>
    <div class="dest-actions">
      <a href="${esc(gfLink(CFG.origin.iata, d.dest, b.departDate, b.returnDate))}" target="_blank" rel="noopener">Check on Google Flights</a>
      ${moreBtn}
    </div>
    ${alts ? `<div class="alt-rows">${alts}</div>` : ""}
  </div>`;
}

function renderTokenPanel(s) {
  return `<section class="panel">
    <details>
      <summary>Live prices</summary>
      <div class="token-body">
        <p>Sample data is shown until you add a free Travelpayouts token. Sign up at <a href="https://www.travelpayouts.com" target="_blank" rel="noopener">travelpayouts.com</a>, copy the API token from your profile, paste it here.</p>
        <div class="token-row">
          <input type="text" id="token-input" placeholder="API token" value="${esc(s.token)}" autocomplete="off" spellcheck="false">
          <button class="btn" type="button" id="token-save">Save</button>
        </div>
        <p>Prices come from the Aviasales search cache. Treat them as leads, not quotes. Train prices and flight times are rough estimates. Multi-stop combos need cached one-ways that line up, so live results can be thin; sample data always works.</p>
      </div>
    </details>
  </section>`;
}

// ---- App ----

const app = {
  state: loadState(),
  fares: null,
  legs: null,
  sourceKind: "demo",
  error: "",
};

function refreshResults() {
  const s = app.state;
  let html;
  if (s.mode === "via") {
    if (!app.legs) { html = renderStatus(s, app.sourceKind, 0, app.error); }
    else {
      const home = app.legs.C.filter(l => l.from === s.hub);
      const stripDates = CFG.suggestions.includes(s.anchor) ? CFG.suggestions : [...CFG.suggestions, s.anchor].sort();
      const sums = stripDates.map(iso => {
        const o = optsForAnchor(iso, s);
        const b = baselineTrip(app.legs.A, home, o);
        const plan = planVia(app.legs.A, app.legs.B, app.legs.C, o);
        const st = dayStatus(iso);
        return { key: iso, label: fmtMD(iso), note: st ? st.note : "", base: b ? b.total : 0, best: plan.length ? plan[0].best.total : 0 };
      });
      const o = optsForAnchor(s.anchor, s);
      const base = baselineTrip(app.legs.A, home, o);
      const ranked = planVia(app.legs.A, app.legs.B, app.legs.C, o);
      const cards = ranked.map(d => renderViaDest(d, s.hub, base ? base.total : 0)).join("");
      html = renderCandStrip(sums, s.anchor, s.hub)
        + renderStatus(s, app.sourceKind, ranked.length, app.error)
        + renderBaselineCard(base, s.hub)
        + (ranked.length ? `<div class="dest-list">${cards}</div>`
          : `<div class="panel empty">Nothing fits. Try more nights, another weekend, or a bigger budget.</div>`);
    }
  } else {
    const p = presetOf(s.preset);
    const o = {
      windowStart: s.windowStart, windowEnd: s.windowEnd,
      minNights: p.min, maxNights: p.max,
      maxPrice: num(s.maxPrice), maxHours: num(s.maxHours), excluded: s.excluded,
    };
    const ranked = app.fares ? rankDestinations(app.fares, o) : [];
    html = renderStatus(s, app.sourceKind, ranked.length, app.error)
      + (ranked.length ? `<div class="dest-list">${ranked.map(renderDest).join("")}</div>`
        : `<div class="panel empty">Nothing fits. Widen the dates, allow more nights, or raise the budget.</div>`);
  }
  document.getElementById("results").innerHTML = html;
}

async function loadData() {
  app.error = "";
  const s = app.state;
  if (s.token) {
    try {
      if (s.mode === "via") {
        app.legs = await fetchLiveLegs(s.token, s.hub);
        app.legs.B.push(...buildTrainLegs(todayISO(), s.hub));
      } else {
        app.fares = await fetchLiveFares(s.token);
      }
      app.sourceKind = "live";
      return;
    } catch (e) {
      app.error = "Live fetch failed (" + (e && e.message || e) + "). Showing sample data.";
    }
  }
  if (s.mode === "via") {
    app.legs = buildDemoViaLegs(todayISO(), s.hub);
    app.legs.B.push(...buildTrainLegs(todayISO(), s.hub));
  } else {
    app.fares = buildDemoFares(todayISO());
  }
  app.sourceKind = "demo";
}

async function reload() {
  document.getElementById("results").innerHTML = `<div class="loading">Finding trips...</div>`;
  await loadData();
  refreshResults();
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = `
    <section class="hero">
      <div class="hero-head">From ${esc(CFG.origin.city)} (${esc(CFG.origin.iata)})</div>
      <h1>Where can I go?</h1>
      <p>Tap a day that works, see the cheapest ways to bolt on one more stop.</p>
    </section>
    ${app.state.mode === "via" ? renderCalendar(app.state) : ""}
    ${renderControls(app.state)}
    <div id="results"><div class="loading">Finding trips...</div></div>
    ${renderTokenPanel(app.state)}
    <div class="footer">From ${esc(CFG.origin.iata)} . prototype</div>
  `;

  const q = sel => root.querySelector(sel);
  const on = (sel, ev, fn) => { const el = q(sel); if (el) el.addEventListener(ev, fn); };
  const onChange = () => { saveState(app.state); refreshResults(); };
  const chipHandler = (id, fn) => on(id, "click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    fn(btn.dataset.key);
    for (const c of q(id).querySelectorAll(".chip")) c.setAttribute("aria-pressed", String(c === btn));
    onChange();
  });

  on("#win-start", "change", e => {
    app.state.windowStart = e.target.value || todayISO();
    if (app.state.windowEnd < app.state.windowStart) app.state.windowEnd = app.state.windowStart;
    const end = q("#win-end");
    if (end) { end.min = app.state.windowStart; end.value = app.state.windowEnd; }
    onChange();
  });
  on("#win-end", "change", e => {
    app.state.windowEnd = e.target.value || app.state.windowStart;
    onChange();
  });

  on("#mode-chips", "click", e => {
    const btn = e.target.closest(".chip");
    if (!btn || btn.dataset.key === app.state.mode) return;
    app.state.mode = btn.dataset.key;
    saveState(app.state);
    render();
    const need = app.state.mode === "via" ? !app.legs : !app.fares;
    if (need) reload(); else refreshResults();
  });

  on("#cal-panel", "click", e => {
    const cell = e.target.closest(".cal-cell[data-date]");
    if (!cell) return;
    const iso = cell.getAttribute("data-date");
    const st = dayStatus(iso);
    const noteEl = q("#cal-note");
    if (noteEl) noteEl.textContent = fmtDay(iso) + ": " + (st ? st.note : "no notes");
    if (iso < todayISO() || (st && st.status === "no")) return;
    if (iso === app.state.anchor) return;
    app.state.anchor = iso;
    for (const c of q("#cal-panel").querySelectorAll(".cal-cell[data-date]")) c.setAttribute("aria-pressed", String(c === cell));
    saveState(app.state);
    refreshResults();
  });

  chipHandler("#preset-chips", k => { app.state.preset = k; });
  chipHandler("#hub-chips", k => { app.state.hubPreset = k; });
  chipHandler("#away-chips", k => { app.state.awayPreset = k; });

  on("#season-chip", "click", e => {
    app.state.avoidBad = !app.state.avoidBad;
    e.currentTarget.setAttribute("aria-pressed", String(app.state.avoidBad));
    onChange();
  });

  on("#max-price", "change", e => { app.state.maxPrice = num(e.target.value); onChange(); });
  on("#max-hours", "change", e => { app.state.maxHours = num(e.target.value); onChange(); });

  on("#hub-input", "change", e => {
    const v = String(e.target.value || "").trim().toUpperCase();
    if (!/^[A-Z]{3}$/.test(v)) { e.target.value = app.state.hub; return; }
    if (v === app.state.hub) return;
    app.state.hub = v;
    saveState(app.state);
    app.legs = null;
    render();
    reload();
  });

  on("#token-save", "click", () => {
    app.state.token = q("#token-input").value.trim();
    saveState(app.state);
    app.fares = null;
    app.legs = null;
    reload();
  });

  document.getElementById("results").addEventListener("click", e => {
    const skip = e.target.closest("[data-skip]");
    if (skip) {
      const code = skip.getAttribute("data-skip");
      if (code && !app.state.excluded.includes(code)) app.state.excluded.push(code);
      saveState(app.state);
      refreshResults();
      return;
    }
    if (e.target.closest("[data-reset-skips]")) {
      app.state.excluded = [];
      saveState(app.state);
      refreshResults();
      return;
    }
    const mini = e.target.closest(".cand-mini");
    if (mini) {
      const key = mini.getAttribute("data-cand");
      if (key && key !== app.state.anchor) {
        app.state.anchor = key;
        saveState(app.state);
        render();
        refreshResults();
      }
      return;
    }
    const btn = e.target.closest(".more-btn");
    if (btn) {
      const card = btn.closest(".dest-card");
      if (card) card.classList.toggle("open");
    }
  });
}

(async () => {
  try {
    render();
    await loadData();
    refreshResults();
  } catch (e) {
    document.getElementById("root").innerHTML =
      `<section class="panel err"><strong>Something broke</strong>${esc(e && e.message || String(e))}</section>`;
  }
})();
</script>
</body>
</html>

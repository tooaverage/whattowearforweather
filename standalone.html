  .day-graph { position: relative; height: 12rem; }
  .dg-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

const C2F = c => c * 9 / 5 + 32, F2C = f => (f - 32) * 5 / 9;
const KPH2MPH = k => k * 0.621371, KPH2MS = k => k / 3.6;

function heatIndexC(tempC, rh) {
  const T = C2F(tempC);
  const simple = 0.5 * (T + 61 + (T - 68) * 1.2 + rh * 0.094);
  const avg = (simple + T) / 2;
  if (avg < 80) return F2C(avg);
  let HI = -42.379 + 2.04901523*T + 10.14333127*rh
    - 0.22475541*T*rh - 0.00683783*T*T - 0.05481717*rh*rh
    + 0.00122874*T*T*rh + 0.00085282*T*rh*rh - 0.00000199*T*T*rh*rh;
  if (rh < 13 && T >= 80 && T <= 112)
    HI -= ((13 - rh) / 4) * Math.sqrt((17 - Math.abs(T - 95)) / 17);
  if (rh > 85 && T >= 80 && T <= 87)
    HI += ((rh - 85) / 10) * ((87 - T) / 5);
  return F2C(HI);
}

function windChillC(tempC, kph) {

function bomAT(tempC, rh, kph) {
  const ws = KPH2MS(kph);
  const e = (rh / 100) * 6.105 * Math.exp((17.27 * tempC) / (237.7 + tempC));
  return tempC + 0.33 * e - 0.70 * ws - 4.00;
}

  return bomAT(tempC, rh, kph);
}

// Solar elevation (degrees above horizon) from latitude, day-of-year and
// local hour. Standard astronomy approximation, ignores equation-of-time
// and longitude-within-timezone fudges (off by up to 15 min or so, fine).
function solarElevation(latDeg, iso) {
  const date = new Date(iso);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 0));
  const dayOfYear = Math.floor((date.getTime() - yearStart.getTime()) / 86400000);
  const decl = 23.45 * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365) * Math.PI / 180;
  const localHour = localHourOf(iso);
  const hourAngle = (localHour - 12) * 15 * Math.PI / 180;
  const lat = latDeg * Math.PI / 180;
  const sinAlt = Math.sin(decl) * Math.sin(lat) + Math.cos(decl) * Math.cos(lat) * Math.cos(hourAngle);
  return Math.asin(clamp(sinAlt, -1, 1)) * 180 / Math.PI;
}

// Replaces the previous UV-bucket cloudAdj. Uses real solar elevation:
//  * elev <= -3deg: night, no effect
//  * elev < 5deg: dusk/dawn cooling, scales from 0 to -2
//  * elev >= 5deg: solar load, scales by sin(elev) * cloud transmission.
//    Clear midday gives ~+1.3deg, overcast midday gives ~-0.2deg, dusk
//    or just-past-sunset gives -2deg. Cloud transmission is 1 - (cloud%
//    * 0.75), so 90% cloud lets through 32.5% of light.
function cloudAdj(h) {
  if (!h) return 0;
  const elev = solarElevation(LOCATION.lat, h.time || new Date().toISOString());
  if (elev <= -3) return 0;
  if (elev < 5) return clamp(-2 + elev * 0.4, -2, 0);
  const sinElev = Math.sin(elev * Math.PI / 180);
  const cloud = num(h.cloud, 50);
  const transmission = 1 - (cloud / 100) * 0.75;
  const adj = sinElev * (transmission - 0.4) * 2.5;
  return clamp(adj, -1, 1.5);
}

function breezeAdj(tempC, kph) {

}
function feels(h) {
  return apparentC(num(h.tempC), num(h.rh), num(h.kph)) + cloudAdj(h) + breezeAdj(num(h.tempC), num(h.kph));
}

function pickBand(c) { for (const b of CFG.bands) if (c >= b.min) return b.band; return "freezing"; }
function bandIdx(b) { return CFG.bands.findIndex(x => x.band === b); }
const effective = c => c + CFG.baselineOffset + CFG.activityOffset + (CFG.adaptiveShift || 0);

// ASHRAE 55-2017 adaptive comfort: people acclimate to recent climate. If
// the running 7-day mean is warmer than a temperate reference (15deg), the
// same temperature feels relatively cool to them; if recent mean is colder,
// today feels relatively warm. Shift = 0.31 * (reference - mean), capped.
// We use forecast as a proxy for recent climate (we don't store history).
function adaptiveShift(allHours) {
  if (!Array.isArray(allHours) || !allHours.length) return 0;
  const tempsByDay = new Map();
  for (const h of allHours) {
    const d = localDateOf(h.time);
    if (!tempsByDay.has(d)) tempsByDay.set(d, []);
    tempsByDay.get(d).push(h.tempC);
  }
  const dailyMeans = [];
  for (const [, temps] of tempsByDay) {
    if (temps.length) dailyMeans.push(temps.reduce((s, t) => s + t, 0) / temps.length);
  }
  if (!dailyMeans.length) return 0;
  const useMeans = dailyMeans.slice(0, 7);
  const mean = useMeans.reduce((s, t) => s + t, 0) / useMeans.length;
  const reference = 15;
  return clamp(0.31 * (reference - mean), -3, 3);
}

// clo values per layer per ASHRAE 55-2017 / ISO 9920 garment tables.
const RECIPES = {
  scorching: { base: { ic: "fig-t-shirt", v: "bathing suit or tank", clo: 0.04 }, mid: null, outer: null, bottom: { ic: "fig-shorts", v: "shorts", clo: 0.06 }, footwear: { ic: "sandals", v: "sandals", clo: 0.02 }, acc: [] },
  hot: { base: { ic: "fig-t-shirt", v: "tank top", clo: 0.05 }, mid: null, outer: null, bottom: { ic: "fig-shorts", v: "athletic shorts", clo: 0.05 }, footwear: { ic: "sandals", v: "sandals or sneakers", clo: 0.03 }, acc: [] },
  warm: { base: { ic: "fig-t-shirt", v: "breathable t-shirt", clo: 0.10 }, mid: null, outer: null, bottom: { ic: "fig-shorts", v: "shorts", clo: 0.06 }, footwear: { ic: "running-shoes", v: "sneakers", clo: 0.04 }, acc: [] },
  mild: { base: { ic: "fig-t-shirt", v: "t-shirt", clo: 0.10 }, mid: null, outer: null, bottom: { ic: "fig-pants", v: "light pants or jeans", clo: 0.20 }, footwear: { ic: "running-shoes", v: "sneakers", clo: 0.04 }, acc: [] },
  cool: { base: { ic: "fig-long-sleeve", v: "thin long-sleeve shirt", clo: 0.20 }, mid: null, outer: null, bottom: { ic: "fig-pants", v: "pants", clo: 0.24 }, footwear: { ic: "running-shoes", v: "sneakers", clo: 0.04 }, acc: [] },
  chilly: { base: { ic: "fig-long-sleeve", v: "long-sleeve shirt", clo: 0.20 }, mid: { ic: "fig-sweater", v: "light sweater or fleece", clo: 0.25 }, outer: null, bottom: { ic: "fig-pants", v: "pants", clo: 0.24 }, footwear: { ic: "running-shoes", v: "closed shoes", clo: 0.05 }, acc: [] },
  cold: { base: { ic: "fig-long-sleeve", v: "long-sleeve thermal top", clo: 0.25 }, mid: { ic: "fig-sweater", v: "sweater or fleece", clo: 0.36 }, outer: { ic: "fig-jacket", v: "insulated jacket", clo: 0.44 }, bottom: { ic: "fig-pants", v: "pants", clo: 0.24 }, footwear: { ic: "running-shoes", v: "closed shoes", clo: 0.05 }, acc: [] },
  very_cold: { base: { ic: "fig-long-sleeve", v: "thermal base layer", clo: 0.25 }, mid: { ic: "fig-sweater", v: "mid-weight fleece or wool", clo: 0.36 }, outer: { ic: "fig-puffer-jacket", v: "insulated winter jacket", clo: 0.66 }, bottom: { ic: "fig-pants", v: "lined or thermal pants", clo: 0.28 }, footwear: { ic: "armored-boot", v: "insulated boots", clo: 0.10 }, acc: [{ ic: "fig-beanie", v: "warm hat", clo: 0.05 }, { ic: "fig-gloves", v: "gloves", clo: 0.05 }] },
  freezing: { base: { ic: "fig-long-sleeve", v: "heavy thermal base", clo: 0.30 }, mid: { ic: "fig-puffer-jacket", v: "down or heavy fleece", clo: 0.45 }, outer: { ic: "fig-parka", v: "parka", clo: 0.70 }, bottom: { ic: "fig-pants", v: "thermal pants under outer pants", clo: 0.32 }, footwear: { ic: "armored-boot", v: "insulated waterproof boots", clo: 0.12 }, acc: [{ ic: "fig-beanie", v: "warm hat", clo: 0.05 }, { ic: "fig-gloves", v: "insulated gloves", clo: 0.07 }, { ic: "fig-scarf", v: "scarf or neck gaiter", clo: 0.05 }] },
};

function totalClo(layers) {
  let sum = 0;
  for (const l of [layers.outer, layers.mid, layers.base, layers.bottom, layers.footwear]) {
    if (l && Number.isFinite(l.clo)) sum += l.clo;
  }
  for (const a of (layers.acc || [])) {
    if (a && Number.isFinite(a.clo)) sum += a.clo;
  }
  return sum;
}

function summarizeArc(next) {
  if (!next.length) return { min: 0, max: 0, spread: 0, cross: false, minTime: "", maxTime: "", totalMm: 0, maxProb: 0, maxUv: 0, maxKph: 0, totalSnow: 0 };
  let minA = Infinity, maxA = -Infinity, minIdx = 0, maxIdx = 0;
  next.forEach((p, i) => {
    const a = feels(p);
    if (a < minA) { minA = a; minIdx = i; }
    if (a > maxA) { maxA = a; maxIdx = i; }
  });
  return {
    min: minA, max: maxA, spread: maxA - minA,
    cross: pickBand(effective(minA)) !== pickBand(effective(maxA)),
    minTime: next[minIdx].time, maxTime: next[maxIdx].time,
    totalMm: next.reduce((s, p) => s + p.precipMm, 0),
    totalSnow: next.reduce((s, p) => s + (p.snowCm || 0), 0),
    maxProb: next.reduce((m, p) => Math.max(m, p.precipProb || 0), 0),
    maxUv: next.reduce((m, p) => Math.max(m, p.uv), 0),
    maxKph: next.reduce((m, p) => Math.max(m, p.kph), 0),
  };
}

function recommend(input) {
  const c = input.current;
  const apparentRaw = apparentC(num(c.tempC), num(c.rh), num(c.kph));
  const cAdj = cloudAdj(c);
  const bAdj = breezeAdj(num(c.tempC), num(c.kph));
  const aNow = feels(c);
  const eNow = effective(aNow);
  const band = pickBand(eNow);
  const arc = summarizeArc(input.next12h);
  const r = RECIPES[band];
  const rationale = [];
  rationale.push(`Feels like ${aNow.toFixed(1)}° (air ${c.tempC.toFixed(1)}°, ${Math.round(c.rh)}% humidity, ${Math.round(c.kph)} km/h wind).`);
  const adj = [];
  const baseChip = PREFS.baseline.options.find(o => o.val === getPref("baseline"));
  const baseOff = baseChip ? baseChip.offset : 0;
  const learned = getLearned();
  if (baseOff) adj.push(`baseline ${baseOff > 0 ? "+" : ""}${baseOff.toFixed(1)}°`);
  if (learned) adj.push(`learned ${learned > 0 ? "+" : ""}${learned.toFixed(1)}°`);
  if (CFG.activityOffset) adj.push(`activity +${CFG.activityOffset.toFixed(1)}°`);
  if (CFG.adaptiveShift) adj.push(`adaptive ${CFG.adaptiveShift > 0 ? "+" : ""}${CFG.adaptiveShift.toFixed(1)}°`);
  rationale.push(`Adjusted for you: ${eNow.toFixed(1)}°${adj.length ? ` (${adj.join(", ")})` : ""}.`);
  if (cAdj > 0) rationale.push(`Clear sun adds about +${cAdj.toFixed(1)}° to perceived temp.`);
  else if (cAdj < 0) rationale.push(`Overcast trims about ${cAdj.toFixed(1)}° from perceived temp.`);
  rationale.push(`Selected band: ${band.replace("_", " ")}.`);

  // Surface the calc so users see this isn't just air temp. Each factor is
  // its own delta in deg, with a short label. Hero renders them inline.
  const factors = [];
  const apparentDelta = apparentRaw - num(c.tempC);
  if (Math.abs(apparentDelta) >= 0.4) {
    let lab = "humidity";
    if (c.tempC <= CFG.windChillTempC && c.kph > CFG.windChillMinWindKph) lab = "wind chill";
    else if (c.tempC >= CFG.heatIndexTempC) lab = "humidity";
    factors.push({ label: lab, delta: apparentDelta });
  }
  if (Math.abs(cAdj) >= 0.4) factors.push({ label: cAdj > 0 ? "sun" : "shade", delta: cAdj });
  if (Math.abs(bAdj) >= 0.4) factors.push({ label: "breeze", delta: bAdj });
  const personalSum = baseOff + learned + (CFG.activityOffset || 0) + (CFG.adaptiveShift || 0);
  if (Math.abs(personalSum) >= 0.4) factors.push({ label: "you", delta: personalSum });

  let acc = r.acc.map(a => ({ ...a }));
  let outer = r.outer ? { ...r.outer } : null;
  let mid = r.mid ? { ...r.mid } : null;
  let base = r.base;
  let bottom = r.bottom;
  let footwear = { ...r.footwear };

  // Warm-day anticipation: when the day will warm into a notably warmer
  // band AND it's still morning, dress for the peak with a shed-able
  // outer for the cool start. People dressed for 16C in the morning when
  // it'll be 26C by afternoon look overdressed by 11am.
  const peakBand = pickBand(effective(arc.max));
  const peakIdx = bandIdx(peakBand);
  const nowIdx = bandIdx(band);
  const localHour = c.time ? localHourOf(c.time) : new Date().getHours();
  const isMorning = localHour >= 6 && localHour < 12;
  if ((nowIdx - peakIdx) >= 2 && arc.spread >= 5 && isMorning) {
    const peakR = RECIPES[peakBand];
    base = peakR.base;
    bottom = peakR.bottom;
    mid = peakR.mid ? { ...peakR.mid } : null;
    footwear = { ...peakR.footwear };
    acc = peakR.acc.map(a => ({ ...a }));
    if (!outer) outer = { ic: "fig-jacket", v: "light cardigan or zip-up", clo: 0.30 };
    rationale.push(`Warms to ${Math.round(arc.max)}° around ${hour(arc.maxTime)}. Dressing for the warm part with a layer to shed.`);
  }

  if (arc.maxKph >= CFG.windLayerKph && !outer && eNow < CFG.windShellMaxEffC) {
    outer = { ic: "fig-jacket", v: "wind-resistant shell" };
    rationale.push(`Sustained wind reaches ${Math.round(arc.maxKph)} km/h and it's cool enough (${eNow.toFixed(1)}°) to feel it. Adding a wind shell.`);
  }

  const rainLikely = arc.maxProb >= CFG.rainShellProbabilityPct || arc.totalMm >= CFG.rainShellTotalMm;
  if (rainLikely) {
    outer = outer ? { ic: "fig-jacket", v: `${outer.v} (waterproof)` } : { ic: "fig-jacket", v: "waterproof rain shell" };
    if (arc.totalMm >= 4) footwear = { ic: footwear.ic, v: `waterproof ${footwear.v}` };
    rationale.push(`Rain likely (${Math.round(arc.maxProb)}% peak chance, ${arc.totalMm.toFixed(1)} mm over 12h). Wear a waterproof shell.`);
  } else if (arc.maxProb >= CFG.umbrellaProbabilityPct) {
    acc.push({ ic: "umbrella", v: "compact umbrella" });
    rationale.push(`Light chance of rain (${Math.round(arc.maxProb)}%). Toss an umbrella in your bag.`);
  }

  if (arc.totalSnow >= CFG.snowBootsCm) {
    footwear = { ic: "armored-boot", v: "insulated waterproof boots" };
    outer = { ic: "fig-jacket", v: outer && outer.v ? `${outer.v.replace(/^waterproof\s+/, "").replace(/\s*\(waterproof\)$/, "")} (waterproof, insulated)` : "waterproof insulated jacket" };
    if (!acc.some(a => a.v.includes("hat"))) acc.push({ ic: "fig-beanie", v: "warm hat" });
    if (!acc.some(a => a.v.includes("gloves"))) acc.push({ ic: "fig-gloves", v: "gloves" });
    if (arc.totalSnow >= CFG.snowHeavyCm && !acc.some(a => a.v.includes("scarf"))) acc.push({ ic: "🧣", v: "scarf or neck gaiter" });
    rationale.push(`Snow expected (${arc.totalSnow.toFixed(1)} cm over 12h). Boots, waterproof outer, hat and gloves.`);
  }

  if (arc.maxUv >= CFG.uvProtectionIndex) {
    if (!acc.some(a => a.v === "sunglasses")) acc.push({ ic: "sunglasses", v: "sunglasses" });
    if (arc.maxUv >= CFG.uvProtectionIndex + 1 && !acc.some(a => a.v.includes("hat"))) acc.push({ ic: "fig-beanie", v: "brimmed hat" });
    rationale.push(`UV peaks at ${arc.maxUv.toFixed(1)} (>= ${CFG.uvProtectionIndex}, WHO sun-protection threshold).`);
    if (arc.maxUv >= CFG.uvSunscreenIndex) {
      acc.push({ ic: "🧴", v: "sunscreen" });
      rationale.push(`UV reaches "high" (>= ${CFG.uvSunscreenIndex}). Apply SPF.`);
    }
  }

  let bring = null;
  const minE = effective(arc.min), maxE = effective(arc.max);
  const minB = pickBand(minE), maxB = pickBand(maxE), nowB = band;
  const colder = bandIdx(minB) > bandIdx(nowB), warmer = bandIdx(maxB) < bandIdx(nowB);
  const fmtT = c => `${Math.round(c)}°`;
  if (arc.cross && colder) bring = `Cools to ${fmtT(arc.min)} around ${hour(arc.minTime)}. Pack an extra layer.`;
  else if (arc.cross && warmer) bring = `Warms to ${fmtT(arc.max)} by ${hour(arc.maxTime)}. Wear something you can shed.`;
  else if (arc.spread >= CFG.bringLayerSpreadC) bring = `Big swing today, ${fmtT(arc.min)} at ${hour(arc.minTime)} up to ${fmtT(arc.max)} by ${hour(arc.maxTime)}. Bring a layer you can adjust.`;

  const conditions = [];
  if (arc.maxProb >= 40 || arc.totalMm >= 1) conditions.push("rain");
  if (arc.maxKph >= 15) conditions.push("wind");
  if ((arc.totalSnow || 0) >= 0.5) conditions.push("snow");
  if (c.isDay && num(c.cloud, 50) < 30) conditions.push("sun");
  const layersOut = { base, mid, outer, bottom, footwear, acc };
  const clo = totalClo(layersOut);
  rationale.push(`Outfit insulation: ~${clo.toFixed(2)} clo (ASHRAE 55 / ISO 9920 garment table).`);
  return { aNow, eNow, band, layers: layersOut, bring, rationale, arc, conditions, clo, factors };
}

function buildTimeline(weather) {
  const events = [];
  // Filter to waking hours (6 AM to 10 PM local) so we do not narrate sleep.
  const hours = weather.next12h.map(p => {
    const a = feels(p);
    return { t: p.time, tempC: p.tempC, apparent: a, eff: effective(a), band: pickBand(effective(a)), uv: p.uv, precipProb: p.precipProb, precipMm: p.precipMm, kph: p.kph };
  }).filter(h => {
    const hr = localHourOf(h.t);
    return hr >= 6 && hr <= 22;
  });
  if (hours.length === 0) return events;

  const startBand = hours[0].band;
  const sr = RECIPES[startBand];
  const startBits = [sr.base.v, sr.mid && sr.mid.v, sr.outer && sr.outer.v].filter(Boolean).slice(0, 2);
  events.push({ t: hours[0].t, ic: sr.base.ic, text: `<strong>Start:</strong> ${startBits.join(" + ")}` });

  for (let i = 1; i < hours.length; i++) {
    if (hours[i].band !== hours[i-1].band) {
      const fromI = bandIdx(hours[i-1].band), toI = bandIdx(hours[i].band);
      const r2 = RECIPES[hours[i].band];
      if (toI > fromI) {
        const add = (r2.outer && r2.outer.v) || (r2.mid && r2.mid.v) || "a layer";
        events.push({ t: hours[i].t, ic: "fig-jacket", text: `Cools to ${Math.round(hours[i].apparent)}°, <strong>add ${add}</strong>` });
      } else {
        events.push({ t: hours[i].t, ic: "☀️", text: `Warms to ${Math.round(hours[i].apparent)}°, <strong>shed a layer</strong>` });
      }
    }
  }

  let peakUv = -Infinity, peakIdx = -1;
  hours.forEach((h, i) => { if (h.uv > peakUv) { peakUv = h.uv; peakIdx = i; } });
  if (peakUv >= CFG.uvProtectionIndex && peakIdx >= 0) {
    const applyIdx = Math.max(0, peakIdx - 1);
    if (peakUv >= CFG.uvSunscreenIndex) {
      events.push({ t: hours[applyIdx].t, ic: "🧴", text: `<strong>Apply sunscreen.</strong> UV peaks at ${peakUv.toFixed(0)} around ${hour(hours[peakIdx].t)}` });
    } else {
      events.push({ t: hours[applyIdx].t, ic: "sunglasses", text: `Sun gets stronger. UV ${peakUv.toFixed(0)} around ${hour(hours[peakIdx].t)}` });
    }
  }

  const rainStart = hours.findIndex(h => num(h.precipProb) >= CFG.rainShellProbabilityPct || h.precipMm >= 0.5);
  if (rainStart >= 0) {
    const probAtStart = Math.round(num(hours[rainStart].precipProb));
    events.push({ t: hours[rainStart].t, ic: "umbrella", text: `<strong>Rain likely</strong>, ${probAtStart}% chance` });
  }

  const seen = new Set();
  return events
    .filter(e => { const k = e.t + "|" + e.ic; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => new Date(a.t) - new Date(b.t));
}

const LOCATION_DEFAULT = { lat: 49.2497, lon: -123.1193, tz: "America/Vancouver", name: "Vancouver, BC" };
let LOCATION = { ...LOCATION_DEFAULT };
function getTheme() {
  try { const t = localStorage.getItem("wtwfw-theme"); if (t === "light" || t === "dark") return t; } catch {}
  return "system";
}
function applyTheme() {
  const t = getTheme();
  let resolved = t;
  if (t === "system") {
    try { resolved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch { resolved = "dark"; }
  }
  document.documentElement.setAttribute("data-theme", resolved);
  // Sync the meta theme-color so the iOS status bar matches.
  try {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f8fafc" : "#0b1220");
  } catch {}
}
function setTheme(t) {
  try {
    if (t === "system") localStorage.removeItem("wtwfw-theme");
    else localStorage.setItem("wtwfw-theme", t);
  } catch {}
  applyTheme();
}

function loadLocation() {
  try {
    const s = localStorage.getItem("wtwfw-location");
    if (s) {
      const obj = JSON.parse(s);
      if (obj && Number.isFinite(obj.lat) && Number.isFinite(obj.lon) && obj.name) {
        LOCATION = { lat: obj.lat, lon: obj.lon, tz: obj.tz || "auto", name: String(obj.name) };
      }
    }
  } catch {}
}
// Subscription state. On the web this is a localStorage flag for a free
// trial; on iOS it'll be replaced with a StoreKit subscription check.
function getProStatus() {
  try {
    const flag = localStorage.getItem("wtwfw-pro");
    if (flag === "active") return { tier: "active", days: null };
    if (flag === "trial") {
      const exp = parseInt(localStorage.getItem("wtwfw-trial-expires") || "0", 10);
      if (Date.now() < exp) {
        const days = Math.max(0, Math.ceil((exp - Date.now()) / 86400000));
        return { tier: "trial", days };
      }
      // expired
      localStorage.removeItem("wtwfw-pro");
      localStorage.removeItem("wtwfw-trial-expires");
    }
  } catch {}
  return { tier: "free", days: null };
}
function isPro() { return getProStatus().tier !== "free"; }
function startProTrial() {
  try {
    localStorage.setItem("wtwfw-pro", "trial");
    localStorage.setItem("wtwfw-trial-expires", String(Date.now() + 7 * 86400000));
  } catch {}
}
function cancelPro() {
  try {
    localStorage.removeItem("wtwfw-pro");
    localStorage.removeItem("wtwfw-trial-expires");
  } catch {}
}

function getSavedLocations() {
  try {
    const s = localStorage.getItem("wtwfw-saved-locations");
    if (s) {
      const arr = JSON.parse(s);
      if (Array.isArray(arr)) return arr.filter(l => l && Number.isFinite(l.lat) && Number.isFinite(l.lon) && l.name).slice(0, 12);
    }
  } catch {}
  return [];
}
function setSavedLocations(arr) { try { localStorage.setItem("wtwfw-saved-locations", JSON.stringify(arr)); } catch {} }
function addSavedLocation(loc) {
  if (!loc || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lon) || !loc.name) return;
  const list = getSavedLocations();
  if (list.some(l => l.name === loc.name && Math.abs(l.lat - loc.lat) < 0.05)) return;
  const cap = isPro() ? 12 : 2;
  if (list.length >= cap) return;
  list.push({ lat: loc.lat, lon: loc.lon, tz: loc.tz || "auto", name: String(loc.name).slice(0, 60) });
  setSavedLocations(list);
}
function removeSavedLocation(name, lat) {
  const list = getSavedLocations().filter(l => !(l.name === name && Math.abs(l.lat - lat) < 0.05));
  setSavedLocations(list);
}

function saveLocation() {
  try { localStorage.setItem("wtwfw-location", JSON.stringify(LOCATION)); } catch {}
}

// Saved trips: persisted plans the user has built. Keyed by name + dest +
// dates. Capped at 8 to keep localStorage tidy and the UI readable.
function getSavedTrips() {
  try {
    const s = localStorage.getItem("wtwfw-saved-trips");
    if (s) {
      const arr = JSON.parse(s);
      if (Array.isArray(arr)) {
        return arr
          .filter(t => t && t.dest && Number.isFinite(t.dest.lat) && Number.isFinite(t.dest.lon)
            && typeof t.startDate === "string" && typeof t.endDate === "string")
          .slice(0, 8);
      }
    }
  } catch {}
  return [];
}
function setSavedTrips(arr) { try { localStorage.setItem("wtwfw-saved-trips", JSON.stringify(arr)); } catch {} }
function tripKey(t) { return `${t.dest.name}|${t.startDate}|${t.endDate}`; }
function addSavedTrip(t) {
  if (!t || !t.dest || !t.startDate || !t.endDate) return false;
  const list = getSavedTrips();
  const key = tripKey(t);
  if (list.some(x => tripKey(x) === key)) return false;
  if (list.length >= 8) list.shift();
  list.push({
    dest: { lat: t.dest.lat, lon: t.dest.lon, tz: t.dest.tz || "auto", name: String(t.dest.name).slice(0, 60) },
    startDate: t.startDate,
    endDate: t.endDate,
    savedAt: Date.now(),
  });
  setSavedTrips(list);
  return true;
}
function removeSavedTrip(key) {
  setSavedTrips(getSavedTrips().filter(t => tripKey(t) !== key));
}

async function fetchFromOpenMeteo(loc) {
  const where = loc || LOCATION;
  const params = new URLSearchParams({
    latitude: where.lat, longitude: where.lon, timezone: where.tz || "auto",
    current: "temperature_2m,relative_humidity_2m,is_day,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,uv_index",
    hourly: "temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,uv_index,is_day",
    wind_speed_unit: "kmh", temperature_unit: "celsius", precipitation_unit: "mm", forecast_days: "16",
  });
  const r = await fetch("https://api.open-meteo.com/v1/forecast?" + params, { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error(`Open-Meteo ${r.status}`);
  const d = await r.json();
  if (!d || typeof d !== "object") throw new Error("Bad Open-Meteo response shape");
  const c = d.current, h = d.hourly;
  if (!c || !h || !Array.isArray(h.time)) throw new Error("Bad Open-Meteo response shape");
  const allHours = [];
  for (let i = 0; i < h.time.length; i++) {
    allHours.push({
      time: String(h.time[i] || ""),
      tempC: num(h.temperature_2m && h.temperature_2m[i]),
      rh: clamp(num(h.relative_humidity_2m && h.relative_humidity_2m[i]), 0, 100),
      kph: Math.max(0, num(h.wind_speed_10m && h.wind_speed_10m[i])),
      precipMm: Math.max(0, num(h.precipitation && h.precipitation[i])),
      precipProb: clamp(num(h.precipitation_probability && h.precipitation_probability[i]), 0, 100),
      uv: Math.max(0, num(h.uv_index && h.uv_index[i])),
      cloud: clamp(num(h.cloud_cover && h.cloud_cover[i]), 0, 100),
      snowCm: Math.max(0, num(h.snowfall && h.snowfall[i])),
      code: num(h.weather_code && h.weather_code[i]),
      isDay: (h.is_day && h.is_day[i]) === 1,
    });
  }
  const now = Date.now();
  let start = 0;
  for (let i = 0; i < allHours.length; i++) if (new Date(allHours[i].time).getTime() <= now) start = i; else break;
  const next12h = relevantNext(allHours, start, 10);
  return {
    current: {
      time: String(c.time || ""),
      tempC: num(c.temperature_2m),
      rh: clamp(num(c.relative_humidity_2m), 0, 100),
      kph: Math.max(0, num(c.wind_speed_10m)),
      uv: Math.max(0, num(c.uv_index)),
      cloud: clamp(num(c.cloud_cover), 0, 100),
      code: num(c.weather_code),
      isDay: c.is_day === 1,
    },
    next12h,
    allHours,
  };
}

// Met Norway Locationforecast API. Free, no key. Returns timeseries with
// instant air temp / humidity / wind / cloud / and next-hour precipitation.
// Wind is m/s, we convert to km/h. UV not provided so we leave OM's value.
// Open-Meteo archive API: same dates one year ago as a climatology proxy
// for trips beyond the 16-day forecast horizon. Returned hour timestamps
// are shifted forward by one year so downstream code (buildDailySummaries,
// renderDayGraph) can treat the data as if it's for the user's actual
// future dates. The result is flagged _historical so the UI can label it.
async function fetchFromArchive(loc, plannedStartIso, plannedEndIso) {
  const yearShift = 1;
  const start = new Date(plannedStartIso + "T00:00:00Z");
  const end = new Date(plannedEndIso + "T23:59:59Z");
  const aStart = new Date(start); aStart.setUTCFullYear(start.getUTCFullYear() - yearShift);
  const aEnd = new Date(end); aEnd.setUTCFullYear(end.getUTCFullYear() - yearShift);
  const fmtD = d => d.toISOString().slice(0, 10);
  const params = new URLSearchParams({
    latitude: loc.lat, longitude: loc.lon, timezone: loc.tz || "auto",
    start_date: fmtD(aStart), end_date: fmtD(aEnd),
    hourly: "temperature_2m,relative_humidity_2m,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,is_day",
    wind_speed_unit: "kmh", temperature_unit: "celsius", precipitation_unit: "mm",
  });
  const r = await fetch("https://archive-api.open-meteo.com/v1/archive?" + params, { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error(`Archive ${r.status}`);
  const d = await r.json();
  const h = d && d.hourly;
  if (!h || !Array.isArray(h.time)) throw new Error("Bad archive shape");
  const allHours = [];
  for (let i = 0; i < h.time.length; i++) {
    const orig = new Date(h.time[i]);
    orig.setUTCFullYear(orig.getUTCFullYear() + yearShift);
    allHours.push({
      time: orig.toISOString(),
      tempC: num(h.temperature_2m && h.temperature_2m[i]),
      rh: clamp(num(h.relative_humidity_2m && h.relative_humidity_2m[i]), 0, 100),
      kph: Math.max(0, num(h.wind_speed_10m && h.wind_speed_10m[i])),
      precipMm: Math.max(0, num(h.precipitation && h.precipitation[i])),
      precipProb: 0,
      uv: 0,
      cloud: clamp(num(h.cloud_cover && h.cloud_cover[i]), 0, 100),
      snowCm: Math.max(0, num(h.snowfall && h.snowfall[i])),
      code: num(h.weather_code && h.weather_code[i]),
      isDay: (h.is_day && h.is_day[i]) === 1,
    });
  }
  return { current: null, allHours, _historical: true };
}

async function fetchFromMetNo() {
  const url = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${LOCATION.lat.toFixed(4)}&lon=${LOCATION.lon.toFixed(4)}`;
  const r = await fetch(url, { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error(`Met Norway ${r.status}`);
  const d = await r.json();
  const series = d && d.properties && d.properties.timeseries;
  if (!Array.isArray(series)) throw new Error("Bad Met Norway shape");
  const hours = [];
  for (const e of series) {
    const inst = (e.data && e.data.instant && e.data.instant.details) || {};
    const next1 = (e.data && e.data.next_1_hours && e.data.next_1_hours.details) || {};
    hours.push({
      time: String(e.time || ""),
      tempC: num(inst.air_temperature),
      rh: clamp(num(inst.relative_humidity), 0, 100),
      kph: Math.max(0, num(inst.wind_speed) * 3.6),
      cloud: clamp(num(inst.cloud_area_fraction), 0, 100),
      precipMm: Math.max(0, num(next1.precipitation_amount)),
    });
  }
  return { hours };
}

// Mean of two values when both finite, otherwise the finite one.
function avg2(a, b) {
  const aFin = Number.isFinite(a), bFin = Number.isFinite(b);
  if (aFin && bFin) return (a + b) / 2;
  if (aFin) return a;
  if (bFin) return b;
  return 0;
}

function blendWeather(om, mn) {
  if (!mn || !Array.isArray(mn.hours)) return;
  const byTime = new Map();
  for (const h of mn.hours) byTime.set(h.time, h);
  for (const h of om.allHours) {
    const m = byTime.get(h.time);
    if (!m) continue;
    h.tempC = avg2(h.tempC, m.tempC);
    h.rh = avg2(h.rh, m.rh);
    h.kph = avg2(h.kph, m.kph);
    h.cloud = avg2(h.cloud, m.cloud);
    if (Number.isFinite(m.precipMm)) h.precipMm = Math.max(h.precipMm, m.precipMm);
  }
  // Blend current with the Met Norway hour closest to now.
  const nowMs = Date.now();
  let best = null, bestDiff = Infinity;
  for (const h of mn.hours) {
    const diff = Math.abs(new Date(h.time).getTime() - nowMs);
    if (diff < bestDiff) { bestDiff = diff; best = h; }
  }
  if (best) {
    om.current.tempC = avg2(om.current.tempC, best.tempC);
    om.current.rh = avg2(om.current.rh, best.rh);
    om.current.kph = avg2(om.current.kph, best.kph);
    om.current.cloud = avg2(om.current.cloud, best.cloud);
  }
}

async function fetchWeather() {
  const om = await fetchFromOpenMeteo();
  let mn = null;
  try { mn = await fetchFromMetNo(); } catch (e) { console.warn("Met Norway failed:", e && e.message); }
  if (mn) {
    blendWeather(om, mn);
    om._sources = ["Open-Meteo", "Met Norway"];
  } else {
    om._sources = ["Open-Meteo"];
  }
  return om;
}

// Pull the next N hours out of allHours starting at startIdx, but only the
// ones where the user is plausibly outside (6am-10pm local) AND only within
// the start day. Tomorrow morning shows up in the daily forecast graph;
// 'pack a layer because it cools at 6am' from any view today is just noise.
function relevantNext(allHours, startIdx, n) {
  if (startIdx >= allHours.length) return [];
  const startDate = localDateOf(allHours[startIdx].time);
  const out = [];
  let i = startIdx;
  while (out.length < n && i < allHours.length) {
    const hr = localHourOf(allHours[i].time);
    if (hr >= 6 && hr <= 22) {
      if (localDateOf(allHours[i].time) !== startDate) break;
      out.push(allHours[i]);
    }
    i++;
  }
  return out;
}

function buildDailySummaries(allHours) {
  const byDay = new Map();
  for (const h of allHours) {
    const d = localDateOf(h.time);
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(h);
  }
  const out = [];
  for (const [date, hours] of byDay) {
    if (hours.length === 0) continue;
    const temps = hours.map(p => p.tempC);
    const hi = Math.max(...temps), lo = Math.min(...temps);
    // Pick the warmest daytime apparent temp for the outfit, since that's
    // what people actually dress for.
    const dayHours = hours.filter(p => p.isDay);
    const sourceHours = dayHours.length ? dayHours : hours;
    let peakA = -Infinity;
    for (const p of sourceHours) {
      const a = feels(p);
      if (a > peakA) peakA = a;
    }
    const band = pickBand(effective(peakA));
    const r = RECIPES[band];
    const icons = [r.outer, r.mid, r.base, r.bottom, r.footwear].filter(Boolean).map(l => l.ic).join(" ");
    const code = dayHours.length ? Math.max(...dayHours.map(p => p.code)) : (hours[0].code || 0);
    const maxProb = Math.max(0, ...hours.map(p => p.precipProb || 0));
    out.push({ date, hi, lo, code, band, icons, jacket: !!r.outer, maxProb });
  }
  return out;
}

// Build hourly cells across multiple days (6 AM - 10 PM each day), each
// carrying a precomputed recommend() for its hour so taps can swap panels
// instantly. Default scroll position is "now" but the strip extends through
// the rest of the forecast so users can scroll forward.
function buildTodayCells(weather) {
  const today = todayDateLocal();
  const todayMs = new Date(today + "T00:00:00").getTime();
  const cutoffMs = todayMs + 7 * 24 * 3600 * 1000;
  const allHours = weather.allHours || [];
  const idxs = [];
  for (let i = 0; i < allHours.length; i++) {
    const h = allHours[i];
    const t = new Date(h.time).getTime();
    if (t < todayMs || t >= cutoffMs) continue;
    const hr = localHourOf(h.time);
    if (hr < 6 || hr > 22) continue;
    idxs.push(i);
  }
  const cells = idxs.map(i => {
    const h = allHours[i];
    const a = feels(h);
    const eff = effective(a);
    const band = pickBand(eff);
    const next12h = relevantNext(allHours, i, 10);
    const rec = recommend({ current: h, next12h });
    return { ...h, apparent: a, eff, band, rec };
  });
  if (!cells.length) return null;
  const todayCells = cells.filter(c => localDateOf(c.time) === today);
  const todayTemps = todayCells.length ? todayCells.map(c => c.tempC) : cells.map(c => c.tempC);
  const todayApps = todayCells.length ? todayCells.map(c => c.apparent) : cells.map(c => c.apparent);
  const hi = Math.max(...todayTemps), lo = Math.min(...todayTemps);
  const hiCell = (todayCells.length ? todayCells : cells)[todayTemps.indexOf(hi)];
  const loCell = (todayCells.length ? todayCells : cells)[todayTemps.indexOf(lo)];
  const allTemps = cells.map(c => c.tempC);
  const cellsHi = Math.max(...allTemps);
  const cellsLo = Math.min(...allTemps);
  const peakIdx = cells.findIndex(c => c.apparent === Math.max(...todayApps));
  const maxRainProb = Math.max(0, ...todayCells.map(c => c.precipProb || 0));
  return { cells, hi, lo, hiTime: hiCell.time, loTime: loCell.time, cellsHi, cellsLo, peakIdx, maxRainProb };
}

const WMO = {
  0: ["Clear", "☀️"], 1: ["Mostly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
  45: ["Fog", "🌫️"], 48: ["Fog", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
  61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
  71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"],
  80: ["Showers", "🌦️"], 81: ["Showers", "🌧️"], 82: ["Heavy showers", "🌧️"],
  95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"],
};
const BAND_LABEL = { scorching: "Scorching", hot: "Hot", warm: "Warm", mild: "Mild", cool: "Cool", chilly: "Chilly", cold: "Cold", very_cold: "Very cold", freezing: "Freezing" };

const fmt = c => `${Math.round(num(c))}°`;
const wmo = code => WMO[code] || ["Unknown", "🌤️"];
const hour = (iso) => {
  try {
    return new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", hour12: true, timeZone: LOCATION.tz })
      .replace(/\s/g, "").toLowerCase();
  } catch { return ""; }
};
const hourShort = (iso) => {
  try {
    const s = new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", hour12: true, timeZone: LOCATION.tz });
    // "8 AM" -> "8a", "12 PM" -> "12p"
    return s.replace(/\s?AM/i, "a").replace(/\s?PM/i, "p");
  } catch { return ""; }
};
const localHourOf = (iso) => {
  try {
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: LOCATION.tz, hour12: false, hour: "2-digit" }).formatToParts(new Date(iso));
    return parseInt((parts.find(p => p.type === "hour") || { value: "0" }).value, 10);
  } catch { return 0; }
};
const localDateOf = (iso) => {
  try { return new Date(iso).toLocaleDateString("en-CA", { timeZone: LOCATION.tz }); }
  catch { return ""; }
};
const todayDateLocal = () => new Date().toLocaleDateString("en-CA", { timeZone: LOCATION.tz });
const dayLabel = (isoDate) => {
  try {
    const d = new Date(isoDate + "T12:00:00");
    const today = new Date(todayDateLocal() + "T12:00:00");
    const diffDays = Math.round((d.getTime() - today.getTime()) / 86400000);
    if (diffDays === 0) return "Today";
    return d.toLocaleDateString("en-US", { weekday: "short", timeZone: LOCATION.tz });
  } catch { return ""; }
};
const rainLevel = p => p >= 40 ? "wet" : p >= 10 ? "maybe" : "dry";

function describeFeel(rec, c, cLabel) {
  const parts = [];
  const conds = rec.conditions || [];
  if (conds.includes("rain")) parts.push("rainy");
  else if (conds.includes("snow")) parts.push("snowy");
  if (conds.includes("wind")) parts.push("breezy");
  if (conds.includes("sun")) parts.push("sunny");
  const uv = num(c.uv, 0);
  if (c.isDay && uv < 1 && !parts.includes("breezy")) parts.push("low sun");
  if (!parts.length && cLabel) parts.push(String(cLabel).toLowerCase());
  if (!parts.length) return "";
  const joined = parts.join(", ");
  return joined.charAt(0).toUpperCase() + joined.slice(1) + ".";
}

function renderHero(rec, c, cLabel) {
  const layers = [rec.layers.outer, rec.layers.mid, rec.layers.base, rec.layers.bottom, rec.layers.footwear].filter(Boolean);
  const heroIconsHtml = layers.map(l => bigIcon(l.ic)).join('<span class="hero-plus">+</span>');
  const desc = describeFeel(rec, c, cLabel);
  // Editorial-style outfit recipe used in directions A and B as a
  // typographic masthead. Names come from the icon key (canonical
  // garment name) so 'light pants or jeans' becomes 'pants' rather
  // than 'light'. Only upper layers (outer + mid + base) are listed;
  // bottom and footwear are visible in the icon row above.
  const ICON_LABELS = {
    "fig-t-shirt": "t-shirt", "fig-shirt": "shirt", "fig-long-sleeve": "long-sleeve",
    "fig-blouse": "blouse", "fig-loose-blouse": "blouse",
    "fig-cardigan": "cardigan", "fig-sweater": "sweater", "fig-pullover": "pullover",
    "fig-hoodie": "hoodie", "fig-gilet": "vest",
    "fig-jacket": "jacket", "fig-coat": "coat", "fig-trench-coat": "trench",
    "fig-puffer-jacket": "puffer", "fig-leather-jacket": "leather", "fig-parka": "parka",
    "fig-anorak": "anorak", "fig-windbreaker": "windbreaker", "fig-raincoat": "raincoat",
    "fig-duffle-coat": "duffle", "fig-fur-coat": "fur coat", "fig-faux-fur-coat": "fur coat",

  const labelFor = ic => {

    return String(ic || "").replace(/^fig-/, "").replace(/-\d+$/, "").replace(/-/g, " ");
  };
  const upperLayers = [rec.layers.outer, rec.layers.mid, rec.layers.base].filter(Boolean);
  const outfitWords = upperLayers.map(l => labelFor(l.ic)).join(" + ");
  const factorsHtml = (rec.factors && rec.factors.length)
    ? `<div class="hero-factors" title="Why ${fmt(rec.eNow)} and not ${fmt(c.tempC)}: each factor below shifts how it feels.">${rec.factors.map(f => {
        const sign = f.delta > 0 ? "+" : "";
        const cls = f.delta > 0 ? "up" : "down";

      }).join("")}</div>`
    : "";
  return `<section id="hero" class="hero ${esc(rec.band)}">
    <div class="hero-head"><button class="loc-btn" type="button" data-loc-open>${esc(LOCATION.name)} ▾</button><span class="hero-band">${esc(BAND_LABEL[rec.band] || "")}</span></div>
    <div class="hero-icons">${heroIconsHtml}</div>

    ${factorsHtml}

}

// Bring-with-you lines render inline inside the Wear panel now (see
// renderWear). This stub stays so existing render plumbing still finds a

function bringLines(rec) {

  const lines = [];
  if (umbrellaItem) lines.push({ ic: "umbrella", text: "Bring a compact umbrella. Rain is possible." });
  if (rec.bring) lines.push({ ic: "🎒", text: rec.bring });

function itemMatchesItem(it, refTemp, currentConds) {
  if (it.minTemp !== null && refTemp < it.minTemp) return false;
  if (it.maxTemp !== null && refTemp > it.maxTemp) return false;
  if (Array.isArray(it.conditions) && it.conditions.length) {
    for (const c of it.conditions) if (!currentConds.includes(c)) return false;
  }
  return true;
}
function renderWear(rec) {
  const closet = getCloset();
  const conds = rec.conditions || [];
  const refTemp = rec.aNow;

  // Snapshot-based wear suggestions: when the user logged a 'just right'
  // snapshot for similar conditions, prefer those items over the recipe
  // default. Cover slots the recipe didn't include too (e.g. mid layer
  // for a cool band where the engine says no mid is needed but the user
  // actually wore a sweater).
  const histSnap = findMatchingSnapshot(rec);
  const useHist = histSnap && (histSnap.comfort === 0);
  const histItemsBySlot = {};
  if (useHist) {
    const allItems = histSnap.worn.slice();
    if (histSnap.extra) allItems.push(histSnap.extra);
    for (const name of allItems) {
      const slot = guessSlotFromName(name);
      if (!histItemsBySlot[slot]) histItemsBySlot[slot] = [];
      histItemsBySlot[slot].push(name);
    }
  }

  const SLOT_ORDER = ["outer", "mid", "base", "bottom", "footwear"];
  const SLOT_LABEL = { outer: "Jacket", mid: "Mid", base: "Top", bottom: "Bottom", footwear: "Shoes" };
  const wearRows = SLOT_ORDER.map(slot => {
    const layer = rec.layers[slot];
    const histItems = histItemsBySlot[slot];
    if (!layer && !histItems) return null;
    return {
      slot,
      label: SLOT_LABEL[slot],
      ic: layer ? layer.ic : SLOT_ICON[slot],
      value: layer ? layer.v : null,
      skip: false,
      histItems: histItems || null,
    };
  }).filter(Boolean);
  const layerRows = wearRows.map(r => {
    const ov = getOverride(rec.band, conds, r.slot);
    let icon = r.ic, value = r.value || "", hint = "", isOverride = false, isSkip = r.skip, isHist = false;
    if (ov === "__skip__") {
      isSkip = true;
      value = "skipped";
      hint = `<span class="your-items">You set this. Default is ${esc(r.value)}</span>`;
      isOverride = true;
    } else if (typeof ov === "string" && ov) {
      icon = iconForName(ov) || SLOT_ICON[r.slot] || r.ic;
      value = ov;
      hint = `<span class="your-items">You set this. Default is ${esc(r.value)}</span>`;
      isOverride = true;
      isSkip = false;
    } else if (r.histItems && r.histItems.length) {
      // Use the snapshot the user logged as 'just right' for this band.
      icon = iconForName(r.histItems[0]) || SLOT_ICON[r.slot] || r.ic;
      value = r.histItems.join(", ");
      const defaultNote = r.value ? `. Default is ${esc(r.value)}` : "";
      hint = `<span class="your-items">You wore this last time, felt right${defaultNote}</span>`;
      isHist = true;
    } else {
      const all = !r.skip && Array.isArray(closet[r.slot]) ? closet[r.slot] : [];
      const items = all.filter(it => itemMatchesItem(it, refTemp, conds));
      if (items.length) {
        icon = iconForName(items[0].name) || SLOT_ICON[r.slot] || r.ic;
        value = items.map(it => it.name).join(", ");
        hint = `<span class="your-items">Default is ${esc(r.value)}</span>`;
      } else if (!value && r.value) {
        value = r.value;
      }
    }
    const badge = isOverride ? `<span class="override-badge">yours</span>` : (isHist ? `<span class="hist-badge" aria-label="From your last just-right log">✦</span>` : "");
    return `<div class="outfit-row tappable${isSkip ? " skip" : ""}${isHist ? " from-hist" : ""}" data-row-slot="${esc(r.slot)}" data-current-value="${esc(typeof ov === "string" ? ov : "")}"><span class="ic">${bigIcon(icon)}</span><span class="lbl">${esc(r.label)}${badge}</span><div class="val-cell"><span class="val">${esc(value)}</span>${hint}</div></div>`;
  }).join("");
  const umbrellaItem = rec.layers.acc.find(a => a.v.includes("umbrella"));
  const visibleAcc = rec.layers.acc.filter(a => a !== umbrellaItem);
  const accs = visibleAcc.length
    ? `<div class="pills"><span class="lbl">Plus</span>${visibleAcc.map(a => `<span class="pill">${bigIcon(a.ic || "")}${esc(a.v)}</span>`).join("")}</div>` : "";
  const learned = getLearned();
  const calibTag = learned !== 0
    ? `<span class="fb-calib">Calibrated ${learned > 0 ? "+" : ""}${learned.toFixed(1)}°</span>`
    : "";
  const fb = `<div class="feedback"><span class="fb-label">How does this feel?${calibTag}</span>` +
    `<button class="fb-btn" type="button" data-fb="cold"><span class="fb-emoji">${bigIcon("🥶")}</span><span>Too cold</span></button>` +
    `<button class="fb-btn" type="button" data-fb="right"><span class="fb-emoji">${bigIcon("👌")}</span><span>Just right</span></button>` +
    `<button class="fb-btn" type="button" data-fb="warm"><span class="fb-emoji">${bigIcon("🥵")}</span><span>Too warm</span></button>` +
    `<button class="snap-link" type="button" data-snap-open>Log what I'm actually wearing →</button>` +
    `</div>`;
  // Show the prose history hint only when the matching snapshot was NOT
  // 'just right' (e.g. you logged 'a bit cold' last time). For just-right
  // matches we already used the worn items as the row values, so the
  // prose hint is redundant.
  const histLine = (histSnap && !useHist) ? (() => {
    const items = histSnap.worn.slice();
    if (histSnap.extra) items.push(histSnap.extra);
    return `<p class="hist-hint">When it felt like this <span class="hist-when">${esc(relativeDay(histSnap.ts))}</span>, you wore <strong>${esc(items.join(", "))}</strong> (was ${esc(comfortLabel(histSnap.comfort || 0))}).</p>`;
  })() : "";
  const bring = bringLines(rec);
  const bringHtml = bring.length
    ? `<div class="wear-bring">${bring.map(l => `<p><span class="ic">${bigIcon(l.ic)}</span><span>${esc(l.text)}</span></p>`).join("")}</div>`
    : "";
  return `<section id="wear" class="panel" aria-live="polite" aria-atomic="true"><h2>Wear</h2>${layerRows}${bringHtml}${histLine}${accs}${fb}</section>`;
}

function renderWhy(rec, source) {
  return `<section id="why" class="panel">
    <details><summary>Why this</summary><ul>${rec.rationale.map(r => `<li>${esc(r)}</li>`).join("")}</ul></details>
    <p class="src">Data: ${esc(source || "Open-Meteo")} . Rules-based, no AI guessing.</p>
  </section>`;
}

function renderTodayLine(today) {
  const rainLvl = rainLevel(today.maxRainProb);
  return `<div class="today-line">
    <span>High <strong>${fmt(today.hi)}</strong> at ${esc(hour(today.hiTime))}</span>
    <span class="sep">·</span>
    <span>Low <strong>${fmt(today.lo)}</strong> at ${esc(hour(today.loTime))}</span>
    <span class="rain-pill" data-level="${esc(rainLvl)}">Rain <strong>${Math.round(today.maxRainProb)}%</strong></span>
  </div>`;
}

function renderHourStrip(today, selectedIdx, nowIdx) {
  const cells = today.cells;
  const range = Math.max(today.cellsHi - today.cellsLo, 1);
  // Tighter y-range so the temperature marker doesn't fly into the
  // cond pill at the top or the time label at the bottom on flat or
  // extreme temperature days. Was 28..75 (47pt range); now 40..68
  // gives the line less drama but keeps the curve readable while
  // leaving room for cond pill (top) and time (bottom).
  const yOf = t => 40 + (1 - (t - today.cellsLo) / range) * 28;
  const xOf = i => ((i + 0.5) / cells.length) * 100;
  const colRem = 3;
  const path = "M" + cells.map((c, i) => `${xOf(i).toFixed(2)},${yOf(c.tempC).toFixed(2)}`).join(" L");
  let prevDate = null;
  const cellsHtml = cells.map((cell, i) => {
    const [label, wIcon] = wmo(cell.code);
    const icon = BAND_ICON[cell.band] || "shirt-01";
    const y = yOf(cell.tempC).toFixed(2);
    const x = xOf(i).toFixed(2);
    const cellDate = localDateOf(cell.time);
    const newDay = i > 0 && cellDate !== prevDate;
    prevDate = cellDate;
    const cls = ["hour-cell"];
    if (i === nowIdx) cls.push("now");
    if (newDay) cls.push("day-break");
    const dayMark = newDay ? `<span class="hc-daylabel">${esc(dayLabel(cellDate))}</span>` : "";
    const prob = Math.round(num(cell.precipProb));
    const rainy = prob >= 20 || num(cell.precipMm) >= 0.3;
    // Always-visible condition pill at the top of each cell. Carries the
    // weather glyph (sun, cloud, rain, etc.) plus a rain percent when
    // it's wet. So the user can scan for sunny windows at a glance
    // without losing the clothing icon below.
    const condPill = rainy
      ? `<span class="hc-cond rainy ${prob < 40 ? "maybe" : ""}">${bigIcon(wIcon)} ${prob}%</span>`
      : `<span class="hc-cond">${bigIcon(wIcon)}</span>`;
    return `<button class="${cls.join(" ")}" data-idx="${i}" aria-pressed="${i === selectedIdx ? "true" : "false"}" style="left: ${x}%; --y: ${y}%" aria-label="${esc(hour(cell.time))}, ${fmt(cell.tempC)}, ${esc(label)}, ${prob}% rain">
      ${dayMark}
      <span class="hc-time">${esc(hourShort(cell.time))}</span>
      ${condPill}
      <span class="hc-point"><span class="hc-temp">${fmt(cell.tempC)}</span><span class="hc-icon">${bigIcon(icon)}</span></span>
    </button>`;
  }).join("");
  return `<div class="strip-wrap"><div class="hour-graph" id="hour-strip" style="width: ${(cells.length * colRem).toFixed(2)}rem">
    <svg class="hg-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="${path}" class="hg-line" />
    </svg>
    ${cellsHtml}
  </div></div>`;
}

function renderHeadsUp(weather) {
  const timeline = buildTimeline(weather);
  const tlRows = timeline.length
    ? timeline.map(e => `<div class="tl-row"><span class="tl-time">${esc(hour(e.t))}</span><span class="tl-ic">${bigIcon(e.ic)}</span><span class="tl-text">${e.text}</span></div>`).join("")
    : `<div class="tl-row"><span class="tl-time"></span><span class="tl-ic">·</span><span class="tl-text">Steady all day. No surprises.</span></div>`;
  return `<section class="panel"><h2>Heads up</h2><div class="timeline">${tlRows}</div></section>`;
}

function renderDayGraph(days, colRem) {
  if (!days.length) return "";
  const cols = days.length;
  const allTemps = days.flatMap(d => [d.hi, d.lo]);
  const tMin = Math.min(...allTemps);
  const tMax = Math.max(...allTemps);
  const tRange = Math.max(tMax - tMin, 1);
  const yTop = 32, yBot = 75;
  const yOf = t => yBot - ((t - tMin) / tRange) * (yBot - yTop);
  const xOf = i => ((i + 0.5) / cols) * 100;
  const hiPath = "M" + days.map((d, i) => `${xOf(i).toFixed(2)},${yOf(d.hi).toFixed(2)}`).join(" L");
  const loPath = "M" + days.map((d, i) => `${xOf(i).toFixed(2)},${yOf(d.lo).toFixed(2)}`).join(" L");
  const todayDate = todayDateLocal();
  const colsHtml = days.map((d, i) => {
    const icon = BAND_ICON[d.band] || "shirt-01";
    const hiY = yOf(d.hi).toFixed(2);
    const loY = yOf(d.lo).toFixed(2);
    const isToday = d.date === todayDate;
    const prob = Math.round(num(d.maxProb));
    const rainBadge = prob >= 20
      ? `<div class="dg-rain ${prob < 40 ? "maybe" : ""}">☂ ${prob}%</div>`
      : "";
    return `<div class="dg-col${isToday ? " is-today" : ""}" style="left: ${xOf(i).toFixed(2)}%">
      <div class="dg-hi" style="top: ${hiY}%">${fmt(d.hi)}</div>
      <div class="dg-icon" style="top: ${hiY}%">${bigIcon(icon)}</div>
      ${rainBadge}
      <div class="dg-lo" style="top: ${loY}%">${fmt(d.lo)}</div>
      <div class="dg-day">${esc(dayLabel(d.date))}</div>
    </div>`;
  }).join("");
  return `<div class="day-graph" style="width: ${(cols * colRem).toFixed(2)}rem">
    <svg class="dg-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="${loPath}" class="dg-line dg-line-lo" />
      <path d="${hiPath}" class="dg-line dg-line-hi" />
    </svg>
    ${colsHtml}
  </div>`;
}

// Compact CTA panel surfacing the trip planner on the home page so users
// don't have to dig into the location modal. Shows saved trip count
// inline if any exist.
function renderTripCta() {
  const trips = getSavedTrips();
  const subline = trips.length === 1
    ? `1 saved trip`
    : trips.length > 1 ? `${trips.length} saved trips` : `Estimate weather and pack list anywhere, up to a year out.`;
  return `<section class="panel trip-cta" data-action="open-trip">
    <div class="trip-cta-body">
      <div class="trip-cta-head">Going somewhere?</div>
      <div class="trip-cta-sub">${esc(subline)}</div>
    </div>

function renderComing(weather) {
  const days = buildDailySummaries(weather.allHours || []);
  if (!days.length) return "";
  const colRem = 3.6;
  const hint = days.length > 7 ? `<div class="day-hint">Swipe to see all ${days.length} days ›</div>` : "";
  return `<section class="panel">
    <h2>Daily forecast</h2>
    <div class="day-graph-list" id="day-list">
      ${renderDayGraph(days, colRem)}
    </div>
    ${hint}
  </section>`;
}

function pickInitialIdx(today) {
  // Prefer "now" if today has a cell at the current local hour.
  const now = Date.now();
  let nowIdx = -1;
  for (let i = 0; i < today.cells.length; i++) {
    if (new Date(today.cells[i].time).getTime() <= now) nowIdx = i;
    else break;
  }
  if (nowIdx >= 0) return { selectedIdx: nowIdx, nowIdx };
  return { selectedIdx: today.peakIdx, nowIdx: -1 };
}

function render(weather) {
  CFG.adaptiveShift = adaptiveShift(weather.allHours);
  if (APP_MODE === "trip") { renderTripView(); return; }
  const c = weather.current;
  const [cLabel] = wmo(c.code);
  const root = document.getElementById("root");

  const today = buildTodayCells(weather);

  // Fall back when today has no remaining hours (late evening). Use current.
  if (!today) {
    const rec = recommend({ current: c, next12h: weather.next12h });
    weather._lastRec = rec;
    root.innerHTML = `
      ${renderHero(rec, c, cLabel)}
      ${renderBring(rec)}
      ${renderWear(rec)}
      ${renderHeadsUp(weather)}
      ${renderComing(weather)}
      ${renderCloset()}
      ${renderSettings()}
      ${renderPro()}
      ${renderPrivacy()}
      ${renderWhy(rec, (LAST_WEATHER && LAST_WEATHER._sources || ["Open-Meteo"]).join(" + "))}
      <div class="footer">${esc(LOCATION.name)} . v82-more-tests</div>
    `;
    attachToggleHandler(root);
    return;
  }

  const { selectedIdx, nowIdx } = pickInitialIdx(today);
  let currentIdx = selectedIdx;
  const rec = today.cells[currentIdx].rec;
  weather._lastRec = rec;

  root.innerHTML = `
    ${renderHero(rec, today.cells[currentIdx], cLabel)}
    <div class="section-title">Hourly forecast</div>
    ${renderTodayLine(today)}
    ${renderHourStrip(today, currentIdx, nowIdx)}
    ${renderBring(rec)}
    ${renderWear(rec)}
    ${renderHeadsUp(weather)}
    ${renderComing(weather)}
    ${renderTripCta()}
    ${renderCloset()}
    ${renderSettings()}
    ${renderWhy(rec, "Open-Meteo")}
    <div class="footer">${esc(LOCATION.name)} . v82-more-tests</div>
  `;

  // Scroll selected cell into center of strip.
  const strip = root.querySelector("#hour-strip");
  const selBtn = strip && strip.querySelector(`[data-idx="${currentIdx}"]`);
  if (selBtn) {
    requestAnimationFrame(() => selBtn.scrollIntoView({ inline: "center", block: "nearest", behavior: "instant" }));
  }

  // Hour cell taps: swap the dynamic panels in place.
  strip && strip.addEventListener("click", e => {
    const btn = e.target.closest(".hour-cell");
    if (!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    if (!Number.isFinite(idx) || idx === currentIdx) return;
    currentIdx = idx;
    for (const c2 of strip.querySelectorAll(".hour-cell")) c2.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-pressed", "true");
    const cell = today.cells[idx];
    const r2 = cell.rec;
    // For the hero's primary number, use that cell's air temp (what it'll feel
    // like at that hour), not the live current temp.
    const heroCtx = { tempC: cell.tempC, rh: cell.rh, kph: cell.kph };
    const [cLabel2] = wmo(cell.code);
    document.getElementById("hero").outerHTML = renderHero(r2, heroCtx, cLabel2);
    document.getElementById("bring").outerHTML = renderBring(r2);
    document.getElementById("wear").outerHTML = renderWear(r2);
    document.getElementById("why").outerHTML = renderWhy(r2, (LAST_WEATHER && LAST_WEATHER._sources || ["Open-Meteo"]).join(" + "));
  });

  attachToggleHandler(root);
  attachGlobalHandlers(root);
}

let GLOBAL_HANDLERS_ATTACHED = false;
function attachGlobalHandlers(root) {
  if (GLOBAL_HANDLERS_ATTACHED) return;
  GLOBAL_HANDLERS_ATTACHED = true;
  root.addEventListener("click", e => {
    const tripExit = e.target.closest("[data-trip-exit]");
    if (tripExit) { exitTripMode(); return; }
    const tripPick = e.target.closest("[data-trip-pick], [data-trip-search-pick]");
    if (tripPick) {
      TRIP_STATE.dest = {
        lat: num(tripPick.dataset.lat),
        lon: num(tripPick.dataset.lon),
        tz: tripPick.dataset.tz || "auto",
        name: tripPick.dataset.name,
      };
      // Clear loaded weather so the previous result panel doesn't sit there
      // claiming to be for a different destination.
      TRIP_STATE.weather = null;
      TRIP_STATE.error = null;
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const tripClearDest = e.target.closest("[data-trip-clear-dest]");
    if (tripClearDest) {
      TRIP_STATE.dest = null;
      TRIP_STATE.weather = null;
      TRIP_STATE.error = null;
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const tripSave = e.target.closest("[data-trip-save]");
    if (tripSave && TRIP_STATE.dest) {
      const ok = addSavedTrip({ dest: TRIP_STATE.dest, startDate: TRIP_STATE.startDate, endDate: TRIP_STATE.endDate });
      if (ok) {
        showToast(`Saved trip to ${TRIP_STATE.dest.name}.`);
      } else {
        showToast(`Already saved.`);
      }
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const tripUnsave = e.target.closest("[data-trip-unsave]");
    if (tripUnsave && TRIP_STATE.dest) {
      removeSavedTrip(tripKey({ dest: TRIP_STATE.dest, startDate: TRIP_STATE.startDate, endDate: TRIP_STATE.endDate }));
      showToast(`Removed from saved trips.`);
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const tripLoad = e.target.closest("[data-trip-load]");
    if (tripLoad) {
      const key = tripLoad.dataset.key;
      const t = getSavedTrips().find(x => tripKey(x) === key);
      if (t) {
        TRIP_STATE.dest = { ...t.dest };
        TRIP_STATE.startDate = t.startDate;
        TRIP_STATE.endDate = t.endDate;
        TRIP_STATE.weather = null;
        TRIP_STATE.error = null;
        runTripPlan();
      }
      return;
    }
    const tripRm = e.target.closest("[data-trip-rm]");
    if (tripRm) {
      const key = tripRm.dataset.key;
      removeSavedTrip(key);
      showToast(`Removed from saved trips.`);
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const tripPlan = e.target.closest("[data-trip-plan]");
    if (tripPlan && !tripPlan.disabled) { runTripPlan(); return; }
    const fb = e.target.closest(".fb-btn");
    if (fb) { recordFeedback(fb.dataset.fb); return; }
    const rem = e.target.closest(".closet-remove");
    if (rem) {
      const slot = rem.dataset.slot;
      const idx = parseInt(rem.dataset.idx, 10);
      if (slot && Number.isFinite(idx)) {
        removeClosetItem(slot, idx);
        if (LAST_WEATHER) render(LAST_WEATHER);
      }
      return;
    }
    const retry = e.target.closest('[data-action="retry"]');
    if (retry) { refreshWeather(); return; }
    const startTrial = e.target.closest('[data-action="start-trial"]');
    if (startTrial) {
      startProTrial();
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const cancelProBtn = e.target.closest('[data-action="cancel-pro"]');
    if (cancelProBtn) {
      if (!confirm("Cancel Pro? You'll lose access to trip planning and any other Pro features.")) return;
      cancelPro();
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) {
      if (chip.dataset.action === "set-theme") {
        setTheme(chip.dataset.theme);
        if (LAST_WEATHER) render(LAST_WEATHER);
        return;
      }
      if (chip.dataset.action === "reset-onb") {
        try { localStorage.removeItem("wtwfw-onboarded"); } catch {}
        if (LAST_WEATHER) render(LAST_WEATHER);
        maybeShowOnboarding();
        return;
      }
      if (chip.dataset.action === "wipe-data") {
        if (!confirm("This wipes your closet, snapshots, calibration, location, and settings from this browser. The forecast itself isn't affected. Continue?")) return;
        try {
          for (const k of ["wtwfw-baseline", "wtwfw-activity", "wtwfw-learned", "wtwfw-location", "wtwfw-saved-locations", "wtwfw-saved-trips", "wtwfw-closet", "wtwfw-overrides", "wtwfw-snapshots", "wtwfw-onboarded", "wtwfw-pro", "wtwfw-trial-expires", "wtwfw-theme"]) localStorage.removeItem(k);
        } catch {}
        loadLocation();
        applySettings();
        refreshWeather();
        return;
      }
      const pref = chip.dataset.pref;
      const val = chip.dataset.val;
      if (pref && val && PREFS[pref]) {
        setPref(pref, val);
        applySettings();
        if (LAST_WEATHER) render(LAST_WEATHER);
      }
      return;
    }
    if (e.target.closest("[data-loc-open]")) { openLocationModal(); return; }
    const tripCta = e.target.closest('.trip-cta[data-action="open-trip"]');
    if (tripCta) { gateTripPlanner(); return; }
    const tripHourlyToggle = e.target.closest("[data-trip-hourly-toggle]");
    if (tripHourlyToggle) {
      const list = document.getElementById("trip-hourly-list");
      if (list) {
        const open = list.classList.toggle("expanded");
        tripHourlyToggle.setAttribute("aria-expanded", String(open));
        const totalDays = list.querySelectorAll(".trip-hourly-row").length;
        tripHourlyToggle.textContent = open ? "Show fewer days" : `Show all ${totalDays} days`;
      }
      return;
    }
    if (e.target.closest("[data-snap-open]")) { openSnapshotModal(); return; }
    const row = e.target.closest("[data-row-slot]");
    if (row) {
      openOverridePicker(row.dataset.rowSlot, row.dataset.currentValue || null);
      return;
    }
  });
  root.addEventListener("submit", e => {
    const form = e.target.closest("#closet-form");
    if (!form) return;
    e.preventDefault();
    const name = (form.querySelector('input[name="name"]') || {}).value || "";
    const slot = (form.querySelector('select[name="slot"]') || {}).value || "";
    const minRaw = (form.querySelector('input[name="minTemp"]') || {}).value;
    const maxRaw = (form.querySelector('input[name="maxTemp"]') || {}).value;
    const minTemp = minRaw === "" ? null : Number(minRaw);
    const maxTemp = maxRaw === "" ? null : Number(maxRaw);
    const conds = Array.from(form.querySelectorAll('input[name="cond"]:checked')).map(c => c.value);
    if (name.trim() && CLOSET_SLOTS[slot]) {
      const result = addClosetItem(slot, name, minTemp, maxTemp, conds);
      if (result && result.ok) {
        form.reset();
        if (LAST_WEATHER) render(LAST_WEATHER);
        showToast(`Added "${result.name}" to your closet.`);
      } else if (result && result.reason === "duplicate") {
        showToast(`"${result.name}" is already in your closet (with the same temps).`);
      } else if (result && result.reason === "full") {
        showToast(`That slot is full (24 items max). Remove one first.`);
      }
    }
  });
}

async function refreshWeather() {
  const root = document.getElementById("root");
  if (root) root.innerHTML = `<div class="loading">Checking the sky...</div>`;
  try {
    LAST_WEATHER = await fetchWeather();
    render(LAST_WEATHER);
  } catch (e) {
    renderError(e && e.message || String(e));
  }
}

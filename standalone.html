  { v: "pants", label: "Pants or jeans", slot: "bottom", minTemp: 5, maxTemp: 22 },
  { v: "sweatpants", label: "Sweat pants", slot: "bottom", minTemp: 0, maxTemp: 18 },
  { v: "overalls", label: "Overalls", slot: "bottom", minTemp: 5, maxTemp: 18 },
  // Footwear
  { v: "sandals", label: "Sandals", slot: "footwear", minTemp: 18, maxTemp: 35 },
  { v: "flats", label: "Flats", slot: "footwear", minTemp: 8, maxTemp: 24 },
  { v: "heels", label: "Heels", slot: "footwear", minTemp: 8, maxTemp: 28 },
  { v: "sneakers", label: "Sneakers", slot: "footwear", minTemp: 5, maxTemp: 28 },
  { v: "boots", label: "Boots", slot: "footwear", minTemp: -5, maxTemp: 14 },
  { v: "rainboots", label: "Rain boots", slot: "footwear", minTemp: 0, maxTemp: 18, conditions: ["rain"] },
  { v: "snowboots", label: "Snow boots", slot: "footwear", minTemp: -25, maxTemp: 4, conditions: ["snow"] },
];

function maybeShowOnboarding() {
  try { if (localStorage.getItem("wtwfw-onboarded") === "1") return; } catch {}
  if (!LAST_WEATHER || !LAST_WEATHER.current) return;
  showOnboarding();
}

// Items pre-checked in the closet step. Universal staples first; the
// climate-specific extras get added based on the current air temp at
// onboarding time. Keep this short, opinionated, and skewed toward what
// most people actually own. Power users can tap the rest in later from
// the closet panel.
const ONB_STAPLES = [
  "tshirt", "longsleeve", "hoodie", "sweater",
  "pants", "shorts",
  "sneakers",
];
function climateExtras(tempC) {
  const t = Number.isFinite(tempC) ? tempC : 15;
  if (t >= 22) return ["tank", "sandals", "shortdress"];
  if (t >= 14) return ["ljacket", "jeans"];
  if (t >= 6) return ["ljacket", "jeans", "boots", "cardigan"];
  return ["puffer", "boots", "snowboots"];
}

function showOnboarding() {
  if (document.querySelector(".onb-overlay")) return;
  const c = LAST_WEATHER.current;
  const aNow = feels(c);
  const overlay = document.createElement("div");
  overlay.className = "onb-overlay";
  document.body.appendChild(overlay);
  const TOTAL = 7;
  const preChecked = new Set([...ONB_STAPLES, ...climateExtras(c && c.tempC)]);
  const state = { step: 1, owned: new Set(preChecked), wearing: new Set(), comfort: null };
  const close = () => overlay.remove();
  const finishSkip = () => {
    saveCloset();
    try { localStorage.setItem("wtwfw-onboarded", "1"); } catch {}
    close();
    if (LAST_WEATHER) window.render(LAST_WEATHER);
  };

  function saveCloset() {
    const closet = getCloset();
    const toSave = new Set([...state.owned, ...state.wearing]);
    for (const v of toSave) {
      const opt = ONB_OUTFIT.find(o => o.v === v);
      if (!opt) continue;
      if (!Array.isArray(closet[opt.slot])) closet[opt.slot] = [];
      if (!closet[opt.slot].some(it => it.name.toLowerCase() === opt.label.toLowerCase())) {
        closet[opt.slot].push({ name: opt.label, minTemp: opt.minTemp ?? null, maxTemp: opt.maxTemp ?? null, conditions: opt.conditions || [] });
      }
    }
    setCloset(closet);
  }

  // Step 1: welcome splash.
  function step1() {
    overlay.innerHTML = `<div class="onb-card onb-splash">
      <div class="onb-step">Step 1 of ${TOTAL}</div>
      <h2>Welcome.</h2>
      <p>Most weather apps tell you the temperature. We tell you what to wear.</p>
      <div class="onb-actions">
        <button class="onb-next" type="button" id="onb-next">Let's go</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-next").onclick = () => { state.step = 2; render(); };
  }

  // Step 2: dedicated science page. No expandable; the explanation is the
  // page. Translates each formula into what it does inside the app.
  function step2() {
    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 2 of ${TOTAL}</div>
      <h2>How it works</h2>
      <p>We blend two forecasts and run them through published thermal-comfort science. Then we layer in your personal calibration. Each step shifts the "feels-like" number you see on the home screen.</p>
      <ul class="onb-science-list">
        <li><strong>Two forecasts averaged.</strong> Open-Meteo and Met Norway. We take the mean for temp, humidity and wind, the max for rain.</li>
        <li><strong>NWS Wind Chill</strong> below 10° with wind &gt; 5 km/h. Wind on bare skin pulls warmth away.</li>
        <li><strong>BOM Apparent Temperature</strong> in the in-between range. Australian formula, accounts for humidity and wind together.</li>
        <li><strong>NOAA Heat Index</strong> above 27°. Humidity makes hot weather harder to shed.</li>
        <li><strong>Sun and shade</strong> from solar elevation + cloud cover. Clear midday adds about +1°. Overcast trims half a degree.</li>
        <li><strong>Breeze penalty</strong> in warm weather. Above 10°, every km/h over 10 takes off 0.2°, capped at -2.5°.</li>
        <li><strong>Adaptive comfort</strong> shifts your sense of "normal" based on the last 7 days' average temp. Same number feels different in spring vs autumn.</li>
        <li><strong>Your calibration:</strong> body baseline (runs cold/warm), activity (standing vs walking vs running), and a learned offset from how you've rated past outfits.</li>
      </ul>
      <p class="src">Sources: NWS, BOM, NOAA, ISO 7730 / ASHRAE 55, de Dear &amp; Brager 2002.</p>
      <div class="onb-actions">
        <button class="onb-back" type="button" id="onb-back">Back</button>
        <button class="onb-next" type="button" id="onb-next">Got it</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-back").onclick = () => { state.step = 1; render(); };
    overlay.querySelector("#onb-next").onclick = () => { state.step = 3; render(); };
  }

  // Step 3: location.
  function step3() {
    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 3 of ${TOTAL}</div>
      <h2>Where are you?</h2>
      <p>So we pull the right forecast. You can change this any time.</p>
      <button class="onb-here" type="button" id="onb-locate">📍 Use my current location</button>
      <button class="onb-here" type="button" id="onb-keep">Keep ${esc(LOCATION.name)}</button>
      <div class="onb-actions">
        <button class="onb-back" type="button" id="onb-back">Back</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-back").onclick = () => { state.step = 2; render(); };
    overlay.querySelector("#onb-keep").onclick = () => { state.step = 4; render(); };
    overlay.querySelector("#onb-locate").onclick = (e) => {
      const btn = e.currentTarget;
      if (!navigator.geolocation) { btn.textContent = "Geolocation not supported"; return; }
      btn.disabled = true;
      btn.textContent = "Locating...";
      navigator.geolocation.getCurrentPosition(pos => {
        const tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "auto";
        LOCATION = { lat: pos.coords.latitude, lon: pos.coords.longitude, tz, name: "Current location" };
        saveLocation();
        state.step = 4;
        refreshWeather().then(() => render());
      }, () => {
        btn.disabled = false;
        btn.textContent = "Couldn't locate. Tap to try again.";
      }, { timeout: 10000, maximumAge: 60000 });
    };
  }

  // Step 4: about you (activity + body baseline).
  function step4() {
    const actChips = PREFS.activity.options.map(o =>
      `<button type="button" class="onb-chip" data-pref="activity" data-v="${esc(o.val)}" aria-pressed="${getPref("activity") === o.val ? "true" : "false"}">${esc(o.label)}</button>`
    ).join("");
    const baseChips = PREFS.baseline.options.map(o =>
      `<button type="button" class="onb-chip" data-pref="baseline" data-v="${esc(o.val)}" aria-pressed="${getPref("baseline") === o.val ? "true" : "false"}">${esc(o.label)}</button>`
    ).join("");
    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 4 of ${TOTAL}</div>
      <h2>A bit about you</h2>
      <p>Two questions so we don't dress you for the wrong situation.</p>
      <div class="onb-section">
        <div class="onb-label">When you're outside, you're usually</div>
        <div class="onb-chips">${actChips}</div>
      </div>
      <div class="onb-section">
        <div class="onb-label">Your body</div>
        <div class="onb-chips">${baseChips}</div>
      </div>
      <div class="onb-actions">
        <button class="onb-back" type="button" id="onb-back">Back</button>
        <button class="onb-next" type="button" id="onb-next">Next</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-back").onclick = () => { state.step = 3; render(); };
    overlay.querySelector("#onb-next").onclick = () => { state.step = 5; render(); };
    overlay.querySelectorAll(".onb-chip").forEach(btn => {
      btn.onclick = () => {
        const pref = btn.dataset.pref;
        const v = btn.dataset.v;
        setPref(pref, v);
        applySettings();
        overlay.querySelectorAll(`[data-pref="${pref}"]`).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v ? "true" : "false"));
      };
    });
  }

  const SLOT_GROUPS = [
    { slot: "base", label: "Tops" },
    { slot: "mid", label: "Mid layers" },
    { slot: "outer", label: "Outer layers" },
    { slot: "bottom", label: "Bottoms" },
    { slot: "footwear", label: "Shoes" },
  ];

  // Step 5: closet. Pre-checked staples + climate extras based on current
  // temp. Users can tap to add/remove or skip and edit later.
  function step5() {
    const chipFor = o => `<button type="button" class="onb-chip" data-v="${esc(o.v)}" aria-pressed="${state.owned.has(o.v) ? "true" : "false"}">${esc(o.label)}</button>`;
    const groups = SLOT_GROUPS.map(g => {
      const items = ONB_OUTFIT.filter(o => o.slot === g.slot);
      if (!items.length) return "";
      return `<div class="onb-section">
        <div class="onb-label">${esc(g.label)}</div>
        <div class="onb-chips">${items.map(chipFor).join("")}</div>
      </div>`;
    }).join("");
    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 5 of ${TOTAL}</div>
      <h2>What's in your closet?</h2>
      <p>We've pre-selected the staples and a few items that match today's weather. Tap to add or remove. You can edit later.</p>
      ${groups}
      <div class="onb-actions">
        <button class="onb-back" type="button" id="onb-back">Back</button>
        <button class="onb-next" type="button" id="onb-next">Next</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-back").onclick = () => { state.step = 4; render(); };
    overlay.querySelector("#onb-next").onclick = () => { state.step = 6; render(); };
    overlay.querySelectorAll(".onb-chip").forEach(btn => {
      btn.onclick = () => {
        const v = btn.dataset.v;
        if (state.owned.has(v)) {
          state.owned.delete(v);
          state.wearing.delete(v);
        } else {
          state.owned.add(v);
        }
        btn.setAttribute("aria-pressed", state.owned.has(v) ? "true" : "false");
      };
    });
  }

  // Step 6: wearing-now calibration. Optional. Lets the user log what
  // they'd wear right now and how it'd feel; skip is a clean exit that
  // doesn't apply any learned offset.
  function step6() {
    // Read fresh from LAST_WEATHER. The closure-level c/aNow values were
    // captured at showOnboarding() entry, before the user might have
    // granted geolocation in step 3 and triggered a refreshWeather. Stale
    // values would show 'Antarctica weather' for a Vancouver user.
    const cur = (LAST_WEATHER && LAST_WEATHER.current) || c;
    const feelsNow = feels(cur);
    const tempLine = `It's ${fmt(cur.tempC)} in ${esc(LOCATION.name)}, feels ${fmt(feelsNow)} for you.`;
    const ownedList = state.owned.size
      ? ONB_OUTFIT.filter(o => state.owned.has(o.v))
      : ONB_OUTFIT;
    const chipFor = o => `<button type="button" class="onb-chip" data-v="${esc(o.v)}" aria-pressed="${state.wearing.has(o.v) ? "true" : "false"}">${esc(o.label)}</button>`;
    const groups = SLOT_GROUPS.map(g => {
      const items = ownedList.filter(o => o.slot === g.slot);
      if (!items.length) return "";
      return `<div class="onb-section">
        <div class="onb-label">${esc(g.label)}</div>
        <div class="onb-chips">${items.map(chipFor).join("")}</div>
      </div>`;
    }).join("");
    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 6 of ${TOTAL}</div>
      <h2>Calibrate (optional)</h2>
      <p>${tempLine} If you stepped outside right now, what would you put on? And how would it feel? If you're inside and not sure, tap "Skip calibration".</p>
      ${groups}
      <div class="onb-section">
        <div class="onb-label">How would it feel?</div>
        <div class="onb-comfort">
          <button type="button" data-c="cold" class="${state.comfort === "cold" ? "on" : ""}"><span class="em">${bigIcon("🥶")}</span><span>Too cold</span></button>
          <button type="button" data-c="right" class="${state.comfort === "right" ? "on" : ""}"><span class="em">${bigIcon("👌")}</span><span>Just right</span></button>
          <button type="button" data-c="warm" class="${state.comfort === "warm" ? "on" : ""}"><span class="em">${bigIcon("🥵")}</span><span>Too warm</span></button>
        </div>
      </div>
      <div class="onb-actions">
        <button class="onb-back" type="button" id="onb-back">Back</button>
        <button class="onb-next" type="button" id="onb-next">Next</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip-cal">Skip calibration</button>
    </div>`;
    overlay.querySelector("#onb-skip-cal").onclick = () => { state.comfort = null; state.step = 7; render(); };
    overlay.querySelector("#onb-back").onclick = () => { state.step = 5; render(); };
    overlay.querySelector("#onb-next").onclick = () => { state.step = 7; render(); };
    overlay.querySelectorAll(".onb-chip").forEach(btn => {
      btn.onclick = () => {
        const v = btn.dataset.v;
        if (state.wearing.has(v)) state.wearing.delete(v); else state.wearing.add(v);
        btn.setAttribute("aria-pressed", state.wearing.has(v) ? "true" : "false");
      };
    });
    overlay.querySelectorAll(".onb-comfort button").forEach(btn => {
      btn.onclick = () => {
        state.comfort = btn.dataset.c;
        overlay.querySelectorAll(".onb-comfort button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
      };
    });
  }

  // Step 7: trial timeline + paywall. Blinkist-style: visible 3-node
  // timeline of "today" (instant access), "day 5" (notification before
  // trial ends), "day 7" (charged). Big primary CTA starts the trial.
  function step7() {
    const today = new Date();
    const day5 = new Date(today.getTime() + 5 * 86400000);
    const day7 = new Date(today.getTime() + 7 * 86400000);
    const fmtDate = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    overlay.innerHTML = `<div class="onb-card onb-trial">
      <div class="onb-step">Step 7 of ${TOTAL}</div>
      <h2>Try Pro free for 7 days.</h2>
      <p>Trip planner, unlimited saved locations, and everything we ship next. No charge until your trial ends.</p>

      <ol class="trial-timeline">
        <li class="tl-now">
          <div class="tl-dot" aria-hidden="true"></div>
          <div class="tl-body">
            <div class="tl-when">Today, ${esc(fmtDate(today))}</div>
            <div class="tl-what"><strong>Instant access.</strong> Full Pro features unlocked.</div>
          </div>
        </li>
        <li>
          <div class="tl-dot" aria-hidden="true"></div>
          <div class="tl-body">
            <div class="tl-when">${esc(fmtDate(day5))}</div>
            <div class="tl-what"><strong>We'll remind you</strong> two days before your trial ends.</div>
          </div>
        </li>
        <li>
          <div class="tl-dot" aria-hidden="true"></div>
          <div class="tl-body">
            <div class="tl-when">${esc(fmtDate(day7))}</div>
            <div class="tl-what"><strong>Trial ends.</strong> $19.99/year unless you cancel before.</div>
          </div>
        </li>
      </ol>

      <div class="onb-actions">
        <button class="onb-next" type="button" id="onb-trial-start">Start 7-day free trial</button>
      </div>
      <button class="onb-skip" type="button" id="onb-trial-skip">Continue with free</button>
      <button class="onb-skip onb-restore" type="button" id="onb-trial-restore">Restore purchase</button>
    </div>`;
    overlay.querySelector("#onb-trial-start").onclick = () => {
      saveCloset();
      if (state.comfort === "cold") setLearned(getLearned() - 1.5);
      else if (state.comfort === "warm") setLearned(getLearned() + 1.5);
      startProTrial();
      try { localStorage.setItem("wtwfw-onboarded", "1"); } catch {}
      applySettings();
      close();
      if (LAST_WEATHER) window.render(LAST_WEATHER);
      showToast("Welcome to Pro. Trial ends " + fmtDate(day7) + ".");
    };
    overlay.querySelector("#onb-trial-skip").onclick = () => {
      saveCloset();
      if (state.comfort === "cold") setLearned(getLearned() - 1.5);
      else if (state.comfort === "warm") setLearned(getLearned() + 1.5);
      try { localStorage.setItem("wtwfw-onboarded", "1"); } catch {}
      applySettings();
      close();
      if (LAST_WEATHER) window.render(LAST_WEATHER);
    };
    overlay.querySelector("#onb-trial-restore").onclick = () => {
      // Web stub. iOS will hand this off to StoreKit.
      showToast("Restore purchase will work after the iOS launch.");
    };
  }

  function render() {
    if (state.step === 1) step1();
    else if (state.step === 2) step2();
    else if (state.step === 3) step3();
    else if (state.step === 4) step4();
    else if (state.step === 5) step5();
    else if (state.step === 6) step6();
    else step7();
  }
  render();
}

function openLocationModal() {
  if (document.querySelector(".loc-overlay")) return;
  const overlay = document.createElement("div");
  overlay.className = "loc-overlay";
  overlay.innerHTML = `
    <div class="loc-card" role="dialog" aria-label="Change location">
      <h3>Change location</h3>
      <div class="loc-saved" aria-label="Saved locations"></div>
      <button class="loc-here" type="button">📍 Use my current location</button>
      <input class="loc-search" type="search" placeholder="Search a city" autocomplete="off" />
      <ul class="loc-results"></ul>
      <button class="loc-plan-trip" type="button" data-action="open-trip">Plan a trip →</button>
      <button class="loc-close" type="button">Close</button>
    </div>`;
  document.body.appendChild(overlay);
  const card = overlay.querySelector(".loc-card");
  const close = () => overlay.remove();
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  card.addEventListener("click", e => e.stopPropagation());
  overlay.querySelector(".loc-close").addEventListener("click", close);
  overlay.querySelector(".loc-plan-trip").addEventListener("click", () => { close(); gateTripPlanner(); });

  const savedRow = overlay.querySelector(".loc-saved");
  const renderSaved = () => {
    const saved = getSavedLocations();
    const cur = LOCATION;
    const inSaved = saved.some(l => l.name === cur.name && Math.abs(l.lat - cur.lat) < 0.05);
    const chips = saved.map(l => {
      const isCurrent = l.name === cur.name && Math.abs(l.lat - cur.lat) < 0.05;
      return `<span class="loc-chip${isCurrent ? " on" : ""}">
        <button type="button" class="loc-chip-pick" data-lat="${l.lat}" data-lon="${l.lon}" data-tz="${esc(l.tz || "auto")}" data-name="${esc(l.name)}">${esc(l.name)}</button>
        <button type="button" class="loc-chip-x" data-lat="${l.lat}" data-name="${esc(l.name)}" aria-label="Remove ${esc(l.name)}">×</button>
      </span>`;
    }).join("");
    const saveCurBtn = inSaved
      ? ""
      : `<button type="button" class="loc-save-current" data-name="${esc(cur.name)}">+ Save ${esc(cur.name)}</button>`;
    savedRow.innerHTML = `${chips}${saveCurBtn}` || `<span class="loc-empty">No saved locations yet. Search below to add.</span>`;
  };
  renderSaved();

  savedRow.addEventListener("click", e => {
    const pick = e.target.closest(".loc-chip-pick");
    if (pick) {
      LOCATION = {
        lat: num(pick.dataset.lat),
        lon: num(pick.dataset.lon),
        tz: pick.dataset.tz || "auto",
        name: pick.dataset.name,
      };
      saveLocation();
      close();
      refreshWeather();
      return;
    }
    const x = e.target.closest(".loc-chip-x");
    if (x) {
      removeSavedLocation(x.dataset.name, num(x.dataset.lat));
      renderSaved();
      return;
    }
    const save = e.target.closest(".loc-save-current");
    if (save) {
      addSavedLocation(LOCATION);
      renderSaved();
      return;
    }
  });

  const here = overlay.querySelector(".loc-here");
  here.addEventListener("click", () => {
    if (!navigator.geolocation) { here.textContent = "Geolocation not supported"; return; }
    here.disabled = true;
    here.textContent = "Locating...";
    navigator.geolocation.getCurrentPosition(pos => {
      const tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "auto";
      LOCATION = { lat: pos.coords.latitude, lon: pos.coords.longitude, tz, name: "Current location" };
      saveLocation();
      close();
      refreshWeather();
    }, err => {
      here.disabled = false;
      here.textContent = `Couldn't locate: ${err.message || "denied"}`;
    }, { timeout: 10000, maximumAge: 60000 });
  });

  const search = overlay.querySelector(".loc-search");
  const results = overlay.querySelector(".loc-results");
  let timer = null;
  search.addEventListener("input", () => {
    clearTimeout(timer);
    const q = search.value.trim();
    if (q.length < 2) { results.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      try {
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`;
        const r = await fetch(url, { cache: "no-store", referrerPolicy: "no-referrer" });
        const d = await r.json();
        results.innerHTML = "";
        const items = (d && d.results) || [];
        if (!items.length) { results.innerHTML = `<li class="loc-empty">No matches</li>`; return; }
        for (const item of items) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "loc-result";
          const parts = [item.name, item.admin1, item.country].filter(Boolean);
          btn.textContent = parts.join(", ");
          btn.addEventListener("click", () => {
            const newLoc = {
              lat: num(item.latitude),
              lon: num(item.longitude),
              tz: item.timezone || "auto",
              name: parts.slice(0, 2).join(", ") || item.name,
            };
            addSavedLocation(newLoc);
            LOCATION = newLoc;
            saveLocation();
            close();
            refreshWeather();
          });
          li.appendChild(btn);
          results.appendChild(li);
        }
      } catch (e) {
        results.innerHTML = `<li class="loc-empty">Search failed</li>`;
      }
    }, 250);
  });
}

function renderTripView() {
  const root = document.getElementById("root");
  const today = new Date();
  const max = new Date(today.getTime() + 365 * 86400000);
  const fmtD = d => d.toISOString().slice(0, 10);
  if (!TRIP_STATE.startDate) TRIP_STATE.startDate = fmtD(today);
  if (!TRIP_STATE.endDate) TRIP_STATE.endDate = fmtD(new Date(today.getTime() + 3 * 86400000));

  const savedList = [LOCATION, ...getSavedLocations().filter(l => !(l.name === LOCATION.name && Math.abs(l.lat - LOCATION.lat) < 0.05))];
  const isSavedDest = d => savedList.some(l => l.name === d.name && Math.abs(l.lat - d.lat) < 0.05);
  const savedChips = savedList.map(l => {
    const isSel = TRIP_STATE.dest && TRIP_STATE.dest.name === l.name && Math.abs(TRIP_STATE.dest.lat - l.lat) < 0.05;
    return `<button type="button" class="trip-chip${isSel ? " on" : ""}" data-trip-pick data-lat="${l.lat}" data-lon="${l.lon}" data-tz="${esc(l.tz || "auto")}" data-name="${esc(l.name)}">${esc(l.name)}</button>`;

    ? `<div class="trip-selected"><span class="trip-selected-lab">Selected</span><span class="trip-selected-name">${esc(TRIP_STATE.dest.name)}</span><button type="button" class="trip-selected-clear" data-trip-clear-dest>Change</button></div>`

              <span class="st-name">${esc(t.dest.name)}</span>
              <span class="st-dates">${esc(fmtShort(t.startDate))} – ${esc(fmtShort(t.endDate))}</span>
            </button>
            <button type="button" class="saved-trip-rm" data-trip-rm data-key="${esc(k)}" aria-label="Remove">×</button>
          </li>`;
        }).join("")}</ul>
      </section>`
    : "";

  let resultHtml = "";

    resultHtml = `<section class="panel"><div class="loading" role="status">Fetching forecast...</div></section>`;
  } else if (TRIP_STATE.error) {
    resultHtml = `<section class="panel err" role="alert"><strong>Couldn\'t fetch the forecast</strong><p>${esc(TRIP_STATE.error)}</p></section>`;
  } else if (TRIP_STATE.weather && TRIP_STATE.dest) {
    resultHtml = renderTripResults(TRIP_STATE.weather, TRIP_STATE.dest, TRIP_STATE.startDate, TRIP_STATE.endDate);
  }

  const planDisabled = !TRIP_STATE.dest || !TRIP_STATE.startDate || !TRIP_STATE.endDate || TRIP_STATE.endDate < TRIP_STATE.startDate;

  root.innerHTML = `
    <div class="trip-bar">
      <button type="button" class="trip-back" data-trip-exit>← Home</button>
      <h1 class="trip-title">Plan a trip</h1>
      <span class="trip-bar-spacer"></span>
    </div>
    ${savedTripsHtml}
    <section class="panel">
      <div class="trip-section">
        <div class="trip-label">Where</div>
        ${TRIP_STATE.dest
          ? `<div class="trip-saved">${savedChips}</div>${selectedBanner}`
          : `<div class="trip-saved">${savedChips}</div>
             <input type="search" class="trip-search" placeholder="Or search a city" autocomplete="off" />
             <ul class="trip-results" data-trip-results></ul>`}
      </div>
      <div class="trip-section">
        <div class="trip-label">When</div>
        <div class="trip-dates">
          <input type="date" data-trip-start min="${fmtD(today)}" max="${fmtD(max)}" value="${esc(TRIP_STATE.startDate)}" aria-label="Start date" />
          <span class="trip-arrow">→</span>
          <input type="date" data-trip-end min="${esc(TRIP_STATE.startDate)}" max="${fmtD(max)}" value="${esc(TRIP_STATE.endDate)}" aria-label="End date" />
        </div>
        <p class="trip-foot">Within 16 days = real forecast. Further out = same dates last year as a historical estimate.</p>
      </div>
      <button type="button" class="trip-plan" data-trip-plan${planDisabled ? " disabled" : ""}>Plan it</button>
    </section>
    ${resultHtml}
  `;
  attachTripPageHandlers(root);
}

function attachTripPageHandlers(root) {
  const search = root.querySelector(".trip-search");
  if (search) {
    let timer = null;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      const q = search.value.trim();
      const ul = root.querySelector("[data-trip-results]");
      if (!ul) return;
      if (q.length < 2) { ul.innerHTML = ""; return; }
      timer = setTimeout(async () => {
        try {
          const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`;
          const r = await fetch(url, { cache: "no-store", referrerPolicy: "no-referrer" });
          const d = await r.json();
          const items = (d.results || []);
          if (!items.length) { ul.innerHTML = `<li class="loc-empty">No matches</li>`; return; }
          ul.innerHTML = items.map(item => {
            const parts = [item.name, item.admin1, item.country].filter(Boolean);
            const display = parts.slice(0, 2).join(", ") || item.name;
            return `<li><button type="button" class="trip-result-btn" data-trip-search-pick data-lat="${item.latitude}" data-lon="${item.longitude}" data-tz="${esc(item.timezone || "auto")}" data-name="${esc(display)}">${esc(parts.join(", "))}</button></li>`;
          }).join("");
        } catch {
          ul.innerHTML = `<li class="loc-empty">Search failed</li>`;
        }
      }, 250);
    });
  }
  const startInp = root.querySelector("[data-trip-start]");
  const endInp = root.querySelector("[data-trip-end]");
  if (startInp) startInp.addEventListener("change", () => {
    TRIP_STATE.startDate = startInp.value;
    // Auto-advance end date if it now sits before start.
    if (TRIP_STATE.endDate && TRIP_STATE.endDate < TRIP_STATE.startDate) {
      TRIP_STATE.endDate = TRIP_STATE.startDate;
    }
    if (LAST_WEATHER) render(LAST_WEATHER);
  });
  if (endInp) endInp.addEventListener("change", () => {
    TRIP_STATE.endDate = endInp.value;
    if (LAST_WEATHER) render(LAST_WEATHER);
  });
}

function renderTripResults(weather, dest, startDate, endDate) {
  const days = buildDailySummaries(weather.allHours).filter(d => d.date >= startDate && d.date <= endDate);
  if (!days.length) return `<section class="panel"><p class="trip-error">No forecast available for those dates.</p></section>`;
  const closet = getCloset();
  const slots = ["outer", "mid", "base", "bottom", "footwear"];
  const packBySlot = { outer: [], mid: [], base: [], bottom: [], footwear: [] };
  const seenBySlot = { outer: new Set(), mid: new Set(), base: new Set(), bottom: new Set(), footwear: new Set() };
  const accList = [];
  const accSeen = new Set();
  const tempsSeen = days.map(d => d.hi).concat(days.map(d => d.lo));
  const tMin = Math.min(...tempsSeen);
  const tMax = Math.max(...tempsSeen);
  const bandsNeeded = new Set(days.map(d => d.band));

  // Pack list scoring. Old logic was greedy: every band the trip touched
  // contributed a full recipe outfit, and every closet item with any
  // overlap got included. Result: 8 outer layers for a 3-band trip.
  //
  // New approach: pick the recipe that fits the trip's *median* feels-
  // like temp as the base outfit (1 item per slot). If the trip's
  // coldest day is >=2 bands colder, also include that band's outer
  // layer as a 'cold mornings' alternative. For each slot, score the
  // user's owned items by overlap with trip range and keep the top 2.
  const allDayTemps = days.flatMap(d => [d.lo, d.hi]);
  const tripMid = (Math.min(...allDayTemps) + Math.max(...allDayTemps)) / 2;
  const tripMidEff = effective(tripMid);
  const midBand = pickBand(tripMidEff);
  const coldBand = pickBand(effective(tMin));
  const midBandIdx = bandIdx(midBand);
  const coldBandIdx = bandIdx(coldBand);
  const usedBands = [midBand];
  if (coldBandIdx > midBandIdx + 1) usedBands.push(coldBand);

  for (const band of usedBands) {
    const r = RECIPES[band];
    for (const slot of slots) {
      const layer = r[slot];
      if (layer && !seenBySlot[slot].has(layer.v)) {
        seenBySlot[slot].add(layer.v);
        const note = band === coldBand && band !== midBand ? " (for cold mornings)" : "";
        packBySlot[slot].push({ name: layer.v + note, ic: layer.ic, mine: false });
      }
    }
    for (const a of (r.acc || [])) {
      if (!accSeen.has(a.v)) {
        accSeen.add(a.v);
        accList.push({ name: a.v, ic: a.ic });
      }
    }
  }

  // Score closet items by how much of the trip range they cover. Top 2
  // per slot only. Items with zero overlap are dropped entirely.
  const tripSpan = Math.max(1, tMax - tMin);
  for (const slot of slots) {
    const items = closet[slot] || [];
    const scored = items
      .map(it => {
        const iMin = Number.isFinite(it.minTemp) ? it.minTemp : -50;
        const iMax = Number.isFinite(it.maxTemp) ? it.maxTemp : 50;
        const overlap = Math.max(0, Math.min(iMax, tMax) - Math.max(iMin, tMin));
        const itemSpan = Math.max(1, iMax - iMin);
        const coverage = overlap / tripSpan;
        const specificity = overlap / itemSpan;
        return { it, score: coverage * specificity, overlap };
      })
      .filter(x => x.overlap > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 2);
    for (const { it } of scored) {
      if (seenBySlot[slot].has(it.name.toLowerCase())) continue;
      seenBySlot[slot].add(it.name.toLowerCase());
      packBySlot[slot].push({ name: it.name, ic: iconForName(it.name) || SLOT_ICON[slot], mine: true });
    }
  }

  // Condition-driven accessories. The recipe-level acc list only carries
  // band-specific items (warm hat in cold, etc); UV / rain / snow items
  // come from the recommend() pass which we don't run here. Compute trip-
  // wide stats and add the matching accessories so the pack list isn't
  // missing sunscreen on a hot trip or an umbrella on a wet one.
  const allHours = (weather.allHours || []).filter(h => {
    const d = localDateOf(h.time);
    return d >= startDate && d <= endDate;
  });
  const maxUv = allHours.reduce((m, h) => Math.max(m, num(h.uv)), 0);
  const maxRainProb = allHours.reduce((m, h) => Math.max(m, num(h.precipProb)), 0);
  const totalRainMm = allHours.reduce((s, h) => s + Math.max(0, num(h.precipMm)), 0);
  const totalSnowCm = allHours.reduce((s, h) => s + Math.max(0, num(h.snowCm)), 0);
  const pushAcc = (v, ic) => {
    if (accSeen.has(v)) return;
    accSeen.add(v);
    accList.push({ name: v, ic });
  };
  if (maxUv >= CFG.uvProtectionIndex) pushAcc("sunglasses", "sunglasses");
  if (maxUv >= CFG.uvProtectionIndex + 1) pushAcc("brimmed hat", "fig-hat");
  if (maxUv >= CFG.uvSunscreenIndex) pushAcc("sunscreen", "🧴");
  if (maxRainProb >= CFG.rainShellProbabilityPct || totalRainMm >= CFG.rainShellTotalMm) {
    pushAcc("compact umbrella", "umbrella");
  }
  if (totalSnowCm >= CFG.snowBootsCm) {
    pushAcc("warm hat", "fig-beanie");
    pushAcc("gloves", "fig-gloves");
    pushAcc("scarf or neck gaiter", "fig-scarf");
  }

  const packRows = slots.map(slot => {
    const list = packBySlot[slot];
    if (!list.length) return "";
    const label = { outer: "Jacket", mid: "Mid", base: "Top", bottom: "Bottom", footwear: "Shoes" }[slot];
    const items = list.map(item =>
      `<li class="pack-item${item.mine ? " mine" : ""}"><span class="pack-ic">${bigIcon(item.ic)}</span><span class="pack-name">${esc(item.name)}</span>${item.mine ? `<span class="pack-tag">yours</span>` : ""}</li>`
    ).join("");
    return `<div class="pack-section"><div class="pack-label">${esc(label)}</div><ul class="pack-list">${items}</ul></div>`;
  }).join("");
  const accRow = accList.length
    ? `<div class="pack-section"><div class="pack-label">Plus</div><ul class="pack-list">${accList.map(a => `<li class="pack-item"><span class="pack-ic">${bigIcon(a.ic)}</span><span class="pack-name">${esc(a.name)}</span></li>`).join("")}</ul></div>`
    : "";

  // Trip-level summary stats: total rain mm, max UV, max wind, range.
  const totalRain = days.reduce((s, d) => s + Math.max(0, num(d.maxProb)), 0);
  const wetDays = days.filter(d => (d.maxProb || 0) >= 40).length;
  const lo = Math.min(...days.map(d => d.lo));
  const hi = Math.max(...days.map(d => d.hi));

  // 'Vs home' stat: compares trip mean temp to current home (LAST_WEATHER)
  // air temp. Uses the trip's daily mean (mean of hi+lo per day, averaged)
  // so the user gets a packing-relevant 'colder/warmer' read.
  const homeNow = LAST_WEATHER && LAST_WEATHER.current ? num(LAST_WEATHER.current.tempC) : null;
  const tripMean = days.reduce((s, d) => s + (d.hi + d.lo) / 2, 0) / days.length;
  let vsHome = null;
  if (Number.isFinite(homeNow) && Number.isFinite(tripMean)) {
    const delta = Math.round(tripMean - homeNow);
    if (Math.abs(delta) >= 1) {
      vsHome = delta > 0 ? `+${delta}° warmer` : `${delta}° colder`;
    } else {
      vsHome = "about same";
    }
  }
  const stats = [
    `<div class="trip-stat"><div class="ts-num">${days.length}</div><div class="ts-lab">day${days.length === 1 ? "" : "s"}</div></div>`,
    `<div class="trip-stat"><div class="ts-num">${fmt(lo)}–${fmt(hi)}</div><div class="ts-lab">range</div></div>`,
    wetDays > 0
      ? `<div class="trip-stat"><div class="ts-num">${wetDays}</div><div class="ts-lab">rainy day${wetDays === 1 ? "" : "s"}</div></div>`
      : `<div class="trip-stat"><div class="ts-num">0</div><div class="ts-lab">rainy days</div></div>`,
    vsHome
      ? `<div class="trip-stat trip-stat-wide"><div class="ts-num">${esc(vsHome)}</div><div class="ts-lab">vs home now</div></div>`
      : "",
  ].filter(Boolean).join("");

  const dailyGraph = renderDayGraph(days, 3.6);
  const histBanner = weather._historical
    ? `<p class="trip-hist">Estimated from the same dates last year. Real forecast becomes available about 16 days before your trip.</p>`
    : "";

  // Per-day hourly preview rows: 6 AM to 10 PM in 4-hour steps so the row
  // stays compact. Each cell shows hour + temp + a tiny weather icon.
  const tripHours = (weather.allHours || []).filter(h => {
    const d = localDateOf(h.time);
    return d >= startDate && d <= endDate;
  });
  const hoursByDate = new Map();
  for (const h of tripHours) {
    const d = localDateOf(h.time);
    if (!hoursByDate.has(d)) hoursByDate.set(d, []);
    hoursByDate.get(d).push(h);
  }
  // Show first 3 days expanded; the rest collapse behind a toggle so a
  // 16-day trip doesn't dump a wall of rows on the user.
  const HOURLY_VISIBLE = 3;
  const hourlyRows = days.map((d, i) => {
    const dayHours = (hoursByDate.get(d.date) || []).filter(h => {
      const hr = localHourOf(h.time);
      return hr >= 6 && hr <= 22 && (hr % 4 === 2);
    });
    if (!dayHours.length) return "";
    const cells = dayHours.map(h => {
      const [, ic] = wmo(h.code);
      const hr = localHourOf(h.time);
      const lab = hr === 12 ? "12p" : hr < 12 ? `${hr}a` : `${hr - 12}p`;
      return `<div class="th-cell"><span class="th-time">${esc(lab)}</span><span class="th-ic">${bigIcon(ic)}</span><span class="th-t">${fmt(h.tempC)}</span></div>`;
    }).join("");
    const extra = i >= HOURLY_VISIBLE ? " trip-hourly-extra" : "";
    return `<div class="trip-hourly-row${extra}"><div class="th-day">${esc(dayLabel(d.date))}</div><div class="th-cells">${cells}</div></div>`;
  }).join("");
  const hourlyToggle = days.length > HOURLY_VISIBLE
    ? `<button type="button" class="day-toggle" data-trip-hourly-toggle aria-expanded="false">Show all ${days.length} days</button>`
    : "";

  // Save / saved indicator. If this exact (dest + dates) is already saved,
  // show a 'Saved' chip + Remove. Otherwise a Save button.
  const thisKey = tripKey({ dest, startDate, endDate });
  const alreadySaved = getSavedTrips().some(t => tripKey(t) === thisKey);
  const saveControl = alreadySaved
    ? `<button type="button" class="trip-save saved" data-trip-unsave>★ Saved · tap to remove</button>`
    : `<button type="button" class="trip-save" data-trip-save>☆ Save this trip</button>`;

  return `
    <section class="panel trip-overview">
      <div class="trip-overview-head">
        <h2>${esc(dest.name)}</h2>
        ${saveControl}
      </div>
      <div class="trip-stats">${stats}</div>
      ${histBanner}
    </section>
    <section class="panel">
      <h2>Daily forecast</h2>
      <div class="day-graph-list" id="day-list">${dailyGraph}</div>
    </section>
    <section class="panel">
      <h2>Hour by hour</h2>
      <p class="pack-hint">6 AM to 10 PM in 4-hour steps.</p>
      <div class="trip-hourly" id="trip-hourly-list">${hourlyRows}</div>
      ${hourlyToggle}
    </section>
    <section class="panel">
      <h2>Pack list</h2>
      <p class="pack-hint">One outfit per slot for typical days, plus your top-fit closet items. Cold-morning extras only if the coldest day is meaningfully colder.</p>
      ${packRows}${accRow}
    </section>
  `;
}


function attachToggleHandler(root) {

const PREFS = {
  baseline: {
    key: "wtwfw-baseline",
    label: "Body baseline",
    default: "neutral",
    options: [
      { val: "runs_cold", label: "Runs cold", offset: -1.5 },
      { val: "neutral", label: "Neutral", offset: 0 },
      { val: "runs_warm", label: "Runs warm", offset: 1.5 },
    ],
  },
  activity: {
    key: "wtwfw-activity",
    label: "Activity",
    default: "walking",
    options: [
      { val: "standing", label: "Standing", offset: 0 },
      { val: "walking", label: "Walking", offset: 1.5 },
      { val: "biking", label: "Biking", offset: 3 },
      { val: "running", label: "Running", offset: 5 },
    ],
  },
};

function getPref(name) {
  const def = PREFS[name];
  try {
    const v = localStorage.getItem(def.key);
    if (v && def.options.some(o => o.val === v)) return v;
  } catch {}
  return def.default;
}
function setPref(name, val) {
  try { localStorage.setItem(PREFS[name].key, val); } catch {}
}
const CLOSET_SLOTS = { outer: "Jackets", mid: "Mid layers", base: "Tops", bottom: "Bottoms", footwear: "Shoes" };
const CLOSET_BANDS = ["scorching", "hot", "warm", "mild", "cool", "chilly", "cold", "very_cold", "freezing"];
const BAND_RANGE = {
  scorching: [30, 50], hot: [24, 29], warm: [19, 23], mild: [14, 18], cool: [10, 13],
  chilly: [6, 9], cold: [1, 5], very_cold: [-5, 0], freezing: [-50, -6],
};
const CONDITIONS = ["rain", "wind", "sun", "snow"];
const CONDITION_LABEL = { rain: "Rain", wind: "Wind", sun: "Sun", snow: "Snow" };
function getCloset() {
  try {
    const s = localStorage.getItem("wtwfw-closet");
    if (s) {
      const obj = JSON.parse(s);
      if (obj && typeof obj === "object") {
        const out = {};
        for (const k of Object.keys(CLOSET_SLOTS)) {
          out[k] = Array.isArray(obj[k]) ? obj[k].filter(it => it && typeof it.name === "string").slice(0, 24).map(it => {
            const name = String(it.name).slice(0, 40);
            let minT = Number.isFinite(it.minTemp) ? it.minTemp : null;
            let maxT = Number.isFinite(it.maxTemp) ? it.maxTemp : null;
            if (minT === null && maxT === null && it.band && BAND_RANGE[it.band]) {
              minT = BAND_RANGE[it.band][0]; maxT = BAND_RANGE[it.band][1];
            }
            const conds = Array.isArray(it.conditions) ? it.conditions.filter(c => CONDITIONS.includes(c)) : [];
            return { name, minTemp: minT, maxTemp: maxT, conditions: conds };
          }) : [];
        }
        return out;
      }
    }
  } catch {}
  return { outer: [], mid: [], base: [], bottom: [], footwear: [] };
}
function setCloset(c) { try { localStorage.setItem("wtwfw-closet", JSON.stringify(c)); } catch {} }
function getOverrides() {
  try {
    const s = localStorage.getItem("wtwfw-overrides");
    if (s) {
      const obj = JSON.parse(s);
      if (obj && typeof obj === "object") return obj;
    }
  } catch {}
  return {};
}
function setOverrides(o) { try { localStorage.setItem("wtwfw-overrides", JSON.stringify(o)); } catch {} }
function overrideKey(band, conds) {
  const sorted = (Array.isArray(conds) ? conds.slice() : []).sort();
  return band + "|" + sorted.join(",");
}
function setOverride(band, conds, slot, value) {
  const o = getOverrides();
  const key = overrideKey(band, conds);
  if (!o[key]) o[key] = {};
  if (value === null || value === undefined) {
    delete o[key][slot];
    if (!Object.keys(o[key]).length) delete o[key];
  } else {
    o[key][slot] = value;
  }
  setOverrides(o);
}
function getOverride(band, conds, slot) {
  const o = getOverrides();
  const key = overrideKey(band, conds);
  return o[key] ? o[key][slot] : undefined;
}
function showToast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); }, 2400);
}

function addClosetItem(slot, name, minTemp, maxTemp, conditions) {
  if (!CLOSET_SLOTS[slot]) return { ok: false, reason: "bad-slot" };
  const trimmed = String(name || "").trim().slice(0, 40);
  if (!trimmed) return { ok: false, reason: "empty" };
  const minT = Number.isFinite(minTemp) ? Math.round(minTemp) : null;
  const maxT = Number.isFinite(maxTemp) ? Math.round(maxTemp) : null;
  const conds = Array.isArray(conditions) ? conditions.filter(c => CONDITIONS.includes(c)) : [];
  const c = getCloset();
  if (c[slot].length >= 24) return { ok: false, reason: "full", name: trimmed };
  if (c[slot].some(it => it.name.toLowerCase() === trimmed.toLowerCase() && (it.minTemp === minT) && (it.maxTemp === maxT))) {
    return { ok: false, reason: "duplicate", name: trimmed };
  }
  c[slot].push({ name: trimmed, minTemp: minT, maxTemp: maxT, conditions: conds });
  setCloset(c);
  return { ok: true, name: trimmed };
}
function removeClosetItem(slot, idx) {
  if (!CLOSET_SLOTS[slot]) return;
  const c = getCloset();
  if (c[slot] && c[slot][idx]) {
    c[slot].splice(idx, 1);
    setCloset(c);
  }
}

function getLearned() {
  try { return clamp(parseFloat(localStorage.getItem("wtwfw-learned") || "0") || 0, -3, 3); }
  catch { return 0; }
}
function setLearned(v) {
  try { localStorage.setItem("wtwfw-learned", clamp(v, -3, 3).toFixed(1)); } catch {}
}
function applySettings() {
  const b = PREFS.baseline.options.find(o => o.val === getPref("baseline"));
  const a = PREFS.activity.options.find(o => o.val === getPref("activity"));
  CFG.baselineOffset = (b ? b.offset : 0) + getLearned();
  CFG.activityOffset = a ? a.offset : 1.5;
}
function guessSlotFromName(name) {
  const n = String(name || "").toLowerCase();
  if (/jacket|coat|parka|hoodie|blazer|cardigan|shell|raincoat|anorak/.test(n)) return "outer";
  if (/sweater|fleece|pullover|jumper/.test(n)) return "mid";
  if (/shirt|tee|tank|polo|blouse|long\s*sleeve/.test(n)) return "base";
  if (/pant|jean|short|skirt|legging|trouser|chino/.test(n)) return "bottom";
  if (/shoe|sneaker|boot|sandal|heel|flat|trainer|loafer/.test(n)) return "footwear";
  return "base";
}

// KNN over previously-logged snapshots. Given the current rec, find the
// closest "comfortable enough" past entry and use its outfit as a hint.
// Score combines temp distance, condition match, and a comfort penalty so
// snapshots where the user said "way too cold" get heavily down-ranked.
function getSnapshots() {
  try {
    const raw = localStorage.getItem("wtwfw-snapshots");
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function findMatchingSnapshot(rec) {
  const all = getSnapshots().filter(s =>
    s && Number.isFinite(s.feels) && Array.isArray(s.worn) && (s.worn.length > 0 || (s.extra || "").trim())
  );
  if (!all.length) return null;
  const cf = rec.aNow;
  const cc = new Set(rec.conditions || []);
  let best = null, bestScore = Infinity;
  for (const s of all) {
    if (Math.abs((s.comfort || 0)) > 1) continue;
    const tempDist = Math.abs(s.feels - cf);
    if (tempDist > 6) continue;
    const sc = new Set(Array.isArray(s.conditions) ? s.conditions : []);
    let match = 0, miss = 0;
    cc.forEach(c => { sc.has(c) ? match++ : miss++; });
    sc.forEach(c => { if (!cc.has(c)) miss++; });
    const comfortPenalty = Math.abs(s.comfort || 0) * 1.5;
    const score = tempDist + miss * 1.5 - match * 0.5 + comfortPenalty;
    if (score < bestScore) { bestScore = score; best = s; }
  }
  return best;
}
function relativeDay(ts) {
  if (!ts) return "";
  const now = Date.now();
  const days = Math.floor((now - ts) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 7) return `${days} days ago`;
  if (days < 14) return "last week";
  return `${Math.floor(days / 7)} weeks ago`;
}
function comfortLabel(c) {
  if (c <= -2) return "way too cold";
  if (c === -1) return "a bit cold";
  if (c === 0) return "just right";
  if (c === 1) return "a bit warm";
  return "way too warm";
}

function saveSnapshot(state) {
  if (!LAST_WEATHER || !LAST_WEATHER.current) return;
  const ctx = state.hour || { tempC: LAST_WEATHER.current.tempC, rh: LAST_WEATHER.current.rh, kph: LAST_WEATHER.current.kph, isDay: LAST_WEATHER.current.isDay, cloud: LAST_WEATHER.current.cloud, time: LAST_WEATHER.current.time };
  const apparent = feels(ctx);
  let conds;
  if (state.hour && state.hour.rec) {
    conds = state.hour.rec.conditions || [];
  } else {
    conds = (LAST_WEATHER._lastRec && LAST_WEATHER._lastRec.conditions) || [];
  }
  const snap = {
    ts: Date.now(),
    forTime: ctx.time || null,
    airTemp: Math.round(ctx.tempC),
    feels: Math.round(apparent),
    conditions: conds,
    location: LOCATION.name,
    worn: Array.from(state.worn),
    extra: (state.extra || "").trim(),
    comfort: state.comfort,
    note: (state.note || "").trim(),
  };
  try {
    const raw = localStorage.getItem("wtwfw-snapshots");
    const arr = raw ? JSON.parse(raw) : [];
    arr.unshift(snap);
    if (arr.length > 50) arr.length = 50;
    localStorage.setItem("wtwfw-snapshots", JSON.stringify(arr));
  } catch {}
  const adj = Number.isFinite(state.comfort) ? -state.comfort * 0.75 : 0;
  if (adj !== 0) setLearned(getLearned() + adj);
  // Persist every item the user reports wearing (both the picked closet
  // names AND any free-text extra) into the closet so future suggestions
  // include them. addClosetItem dedupes by name+temps so re-logging the
  // same item is a no-op. Comfort doesn't gate this; we want the closet
  // to reflect everything the user actually owns regardless of how it
  // felt that day.
  for (const name of (state.worn || [])) {
    const slot = guessSlotFromName(name);
    addClosetItem(slot, name, null, null, []);
  }
  if (snap.extra) {
    const slot = guessSlotFromName(snap.extra);
    addClosetItem(slot, snap.extra, null, null, []);
  }
  applySettings();
}

function openSnapshotModal() {

  ).join("");

    return `<button type="button" class="snap-when-btn${i === defaultIdx ? " on" : ""}" data-idx="${i}">${esc(label)}</button>`;
  }).join("");
  const whenSection = pastCells.length > 1
    ? `<div class="snap-section"><div class="snap-label">When?</div><div class="snap-when">${whenBtns}</div></div>`
    : "";
  overlay.innerHTML = `
    <div class="snap-card" role="dialog" aria-label="Log what you're wearing">
      <div class="snap-header">
        <h3>What are you wearing?</h3>
        <button type="button" class="snap-close" aria-label="Close">×</button>
      </div>
      <p class="snap-weather" id="snap-weather"></p>
      ${whenSection}
      <div class="snap-section">
        <div class="snap-label">From your closet</div>
        <div class="snap-chips">${itemChips}</div>
      </div>
      <div class="snap-section">
        <div class="snap-label">Add anything else (e.g. Paul's sweater)</div>
        <input type="text" class="snap-extra" placeholder="Item name" maxlength="60" />
      </div>
      <div class="snap-section">
        <div class="snap-label">How does it feel?</div>
        <div class="snap-comfort">${comfortBtns}</div>
      </div>
      <button type="button" class="snap-save" disabled>Save</button>
    </div>`;
  document.body.appendChild(overlay);
  const state = { worn: new Set(), extra: "", comfort: null, hour: pastCells[defaultIdx] || null };
  const weatherEl = overlay.querySelector("#snap-weather");
  function refreshWeather() {
    const ctx = state.hour || LAST_WEATHER.current;
    const a = feels(ctx);
    const time = state.hour ? ` at ${hour(state.hour.time)}` : "";
    const condStr = state.hour && state.hour.rec ? conditionsLabel(state.hour.rec) : conditionsLabel(LAST_WEATHER._lastRec);
    weatherEl.textContent = `${LOCATION.name}${time}: ${fmt(ctx.tempC)}, feels ${fmt(a)}${condStr}`;
  }
  refreshWeather();
  const saveBtn = overlay.querySelector(".snap-save");
  function refreshSave() { saveBtn.disabled = state.comfort === null; }
  overlay.querySelectorAll(".snap-when-btn").forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      state.hour = pastCells[idx] || null;
      overlay.querySelectorAll(".snap-when-btn").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      refreshWeather();
    };
  });
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector(".snap-close").onclick = () => overlay.remove();
  overlay.querySelectorAll(".snap-chip").forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.name;
      if (state.worn.has(name)) { state.worn.delete(name); btn.classList.remove("on"); }
      else { state.worn.add(name); btn.classList.add("on"); }
    };
  });
  overlay.querySelector(".snap-extra").addEventListener("input", e => { state.extra = e.target.value; });
  overlay.querySelectorAll(".snap-comfort-btn").forEach(btn => {
    btn.onclick = () => {
      state.comfort = parseInt(btn.dataset.v, 10);
      overlay.querySelectorAll(".snap-comfort-btn").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      refreshSave();
    };
  });
  saveBtn.onclick = () => {
    saveSnapshot(state);
    overlay.remove();
    if (LAST_WEATHER) render(LAST_WEATHER);
  };
}

function conditionsLabel(rec) {
  if (!rec || !rec.conditions || !rec.conditions.length) return "";

}

function recordFeedback(direction) {
  const step = 1.0;

  if (delta !== 0) {

    applySettings();
  }
  if (LAST_WEATHER) render(LAST_WEATHER);
}

  APP_MODE = "home";
  TRIP_STATE = { dest: null, startDate: null, endDate: null, weather: null, error: null, loading: false };
  if (LAST_WEATHER) render(LAST_WEATHER);
  window.scrollTo(0, 0);
}
async function runTripPlan() {
  if (!TRIP_STATE.dest || !TRIP_STATE.startDate || !TRIP_STATE.endDate) return;
  TRIP_STATE.loading = true;
  TRIP_STATE.error = null;
  TRIP_STATE.weather = null;
  if (LAST_WEATHER) render(LAST_WEATHER);
  try {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const horizon = new Date(today.getTime() + 16 * 86400000);
    const endParsed = new Date(TRIP_STATE.endDate + "T00:00:00");
    if (endParsed <= horizon) {
      TRIP_STATE.weather = await fetchFromOpenMeteo(TRIP_STATE.dest);
    } else {
      TRIP_STATE.weather = await fetchFromArchive(TRIP_STATE.dest, TRIP_STATE.startDate, TRIP_STATE.endDate);
    }
  } catch (e) {
    TRIP_STATE.error = e && e.message || String(e);
  }
  TRIP_STATE.loading = false;
  if (LAST_WEATHER) render(LAST_WEATHER);
}

function renderError(msg) {
  document.getElementById("root").innerHTML =
    `<section class="panel err" role="alert"><strong>Couldn't load the forecast</strong><p>${esc(msg)}</p><button class="err-retry" type="button" data-action="retry">Try again</button></section>`;
}

(async () => {
  try {
    applyTheme();
    try { window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (getTheme() === "system") applyTheme(); }); } catch {}
    loadLocation();
    applySettings();
    LAST_WEATHER = await fetchWeather();
    render(LAST_WEATHER);
    maybeShowOnboarding();
  } catch (e) {
    renderError(e && e.message || String(e));
  }
})();
</script>
</body>
</html>

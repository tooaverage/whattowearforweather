const C2F = c => c * 9 / 5 + 32, F2C = f => (f - 32) * 5 / 9;
const KPH2MPH = k => k * 0.621371, KPH2MS = k => k / 3.6;

function heatIndexC(tempC, rh) {
  const T = C2F(tempC);
  const simple = 0.5 * (T + 61 + (T - 68) * 1.2 + rh * 0.094);
  const avg = (simple + T) / 2;
  if (avg < 80) return F2C(avg);
  let HI = -42.379 + 2.04901523*T + 10.14333127*rh
    - 0.22475541*T*rh - 0.00683783*T*T - 0.05481717*rh*rh
    + 0.00122874*T*T*rh + 0.00085282*T*rh*rh - 0.00000199*T*T*rh*rh;
  if (rh < 13 && T >= 80 && T <= 112)
    HI -= ((13 - rh) / 4) * Math.sqrt((17 - Math.abs(T - 95)) / 17);
  if (rh > 85 && T >= 80 && T <= 87)
    HI += ((rh - 85) / 10) * ((87 - T) / 5);
  return F2C(HI);
}

function windChillC(tempC, kph) {
  if (!Number.isFinite(tempC) || !Number.isFinite(kph) || tempC > CFG.windChillTempC || kph <= CFG.windChillMinWindKph) return tempC;
  const T = C2F(tempC), V = KPH2MPH(kph), V16 = Math.pow(V, 0.16);
  return F2C(35.74 + 0.6215*T - 35.75*V16 + 0.4275*T*V16);

function bomAT(tempC, rh, kph) {
  const ws = KPH2MS(kph);
  const e = (rh / 100) * 6.105 * Math.exp((17.27 * tempC) / (237.7 + tempC));
  return tempC + 0.33 * e - 0.70 * ws - 4.00;
}

function apparentC(tempC, rh, kph) {
  if (tempC <= CFG.windChillTempC && kph > CFG.windChillMinWindKph) return windChillC(tempC, kph);
  if (tempC >= CFG.heatIndexTempC) return heatIndexC(tempC, rh);
  return bomAT(tempC, rh, kph);
}

// Solar elevation (degrees above horizon) from latitude, day-of-year and
// local hour. Standard astronomy approximation, ignores equation-of-time
// and longitude-within-timezone fudges (off by up to 15 min or so, fine).
function solarElevation(latDeg, iso) {
  const date = new Date(iso);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 0));
  const dayOfYear = Math.floor((date.getTime() - yearStart.getTime()) / 86400000);
  const decl = 23.45 * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365) * Math.PI / 180;
  const localHour = localHourOf(iso);
  const hourAngle = (localHour - 12) * 15 * Math.PI / 180;
  const lat = latDeg * Math.PI / 180;
  const sinAlt = Math.sin(decl) * Math.sin(lat) + Math.cos(decl) * Math.cos(lat) * Math.cos(hourAngle);
  return Math.asin(clamp(sinAlt, -1, 1)) * 180 / Math.PI;
}

// Replaces the previous UV-bucket cloudAdj. Uses real solar elevation:
//  * elev <= -3deg: night, no effect
//  * elev < 5deg: dusk/dawn cooling, scales from 0 to -2
//  * elev >= 5deg: solar load, scales by sin(elev) * cloud transmission.
//    Clear midday gives ~+1.3deg, overcast midday gives ~-0.2deg, dusk
//    or just-past-sunset gives -2deg. Cloud transmission is 1 - (cloud%
//    * 0.75), so 90% cloud lets through 32.5% of light.
function cloudAdj(h) {
  if (!h) return 0;
  const elev = solarElevation(LOCATION.lat, h.time || new Date().toISOString());
  if (elev <= -3) return 0;
  if (elev < 5) return clamp(-2 + elev * 0.4, -2, 0);
  const sinElev = Math.sin(elev * Math.PI / 180);
  const cloud = num(h.cloud, 50);
  const transmission = 1 - (cloud / 100) * 0.75;
  const adj = sinElev * (transmission - 0.4) * 2.5;
  return clamp(adj, -1, 1.5);
}

// is already handling it).
function breezeAdj(tempC, kph) {
  if (tempC <= 10) return 0;
  if (kph < 10) return 0;
  return -Math.min(2.5, (kph - 10) * 0.2);
}

}

// ASHRAE 55-2017 adaptive comfort: people acclimate to recent climate. If
// the running 7-day mean is warmer than a temperate reference (15deg), the
// same temperature feels relatively cool to them; if recent mean is colder,
// today feels relatively warm. Shift = 0.31 * (reference - mean), capped.
// We use forecast as a proxy for recent climate (we don't store history).
function adaptiveShift(allHours) {
  if (!Array.isArray(allHours) || !allHours.length) return 0;
  const tempsByDay = new Map();
  for (const h of allHours) {
    const d = localDateOf(h.time);
    if (!tempsByDay.has(d)) tempsByDay.set(d, []);
    tempsByDay.get(d).push(h.tempC);
  }
  const dailyMeans = [];
  for (const [, temps] of tempsByDay) {
    if (temps.length) dailyMeans.push(temps.reduce((s, t) => s + t, 0) / temps.length);
  }
  if (!dailyMeans.length) return 0;
  const useMeans = dailyMeans.slice(0, 7);
  const mean = useMeans.reduce((s, t) => s + t, 0) / useMeans.length;
  const reference = 15;
  return clamp(0.31 * (reference - mean), -3, 3);
}

function totalClo(layers) {
  let sum = 0;
  for (const l of [layers.outer, layers.mid, layers.base, layers.bottom, layers.footwear]) {
    if (l && Number.isFinite(l.clo)) sum += l.clo;
  }
  for (const a of (layers.acc || [])) {
    if (a && Number.isFinite(a.clo)) sum += a.clo;
  }
  return sum;
}

function summarizeArc(next) {
  if (!next.length) return { min: 0, max: 0, spread: 0, cross: false, minTime: "", maxTime: "", totalMm: 0, maxProb: 0, maxUv: 0, maxKph: 0, totalSnow: 0 };
  let minA = Infinity, maxA = -Infinity, minIdx = 0, maxIdx = 0;
  next.forEach((p, i) => {
    const a = feels(p);
    if (a < minA) { minA = a; minIdx = i; }
    if (a > maxA) { maxA = a; maxIdx = i; }
  });
  return {
    min: minA, max: maxA, spread: maxA - minA,
    cross: pickBand(effective(minA)) !== pickBand(effective(maxA)),
    minTime: next[minIdx].time, maxTime: next[maxIdx].time,
    totalMm: next.reduce((s, p) => s + p.precipMm, 0),
    totalSnow: next.reduce((s, p) => s + (p.snowCm || 0), 0),
    maxProb: next.reduce((m, p) => Math.max(m, p.precipProb || 0), 0),
    maxUv: next.reduce((m, p) => Math.max(m, p.uv), 0),
    maxKph: next.reduce((m, p) => Math.max(m, p.kph), 0),
  };
}

function recommend(input) {
  const c = input.current;
  const apparentRaw = apparentC(num(c.tempC), num(c.rh), num(c.kph));
  const cAdj = cloudAdj(c);
  const bAdj = breezeAdj(num(c.tempC), num(c.kph));
  const aNow = feels(c);
  const eNow = effective(aNow);
  const band = pickBand(eNow);
  const arc = summarizeArc(input.next12h);
  const r = RECIPES[band];
  const rationale = [];
  rationale.push(`Feels like ${aNow.toFixed(1)}° (air ${c.tempC.toFixed(1)}°, ${Math.round(c.rh)}% humidity, ${Math.round(c.kph)} km/h wind).`);
  const adj = [];
  const baseChip = PREFS.baseline.options.find(o => o.val === getPref("baseline"));
  const baseOff = baseChip ? baseChip.offset : 0;
  const learned = getLearned();
  if (baseOff) adj.push(`baseline ${baseOff > 0 ? "+" : ""}${baseOff.toFixed(1)}°`);
  if (learned) adj.push(`learned ${learned > 0 ? "+" : ""}${learned.toFixed(1)}°`);
  if (CFG.activityOffset) adj.push(`activity +${CFG.activityOffset.toFixed(1)}°`);
  if (CFG.adaptiveShift) adj.push(`adaptive ${CFG.adaptiveShift > 0 ? "+" : ""}${CFG.adaptiveShift.toFixed(1)}°`);
  rationale.push(`Adjusted for you: ${eNow.toFixed(1)}°${adj.length ? ` (${adj.join(", ")})` : ""}.`);
  if (cAdj > 0) rationale.push(`Clear sun adds about +${cAdj.toFixed(1)}° to perceived temp.`);
  else if (cAdj < 0) rationale.push(`Overcast trims about ${cAdj.toFixed(1)}° from perceived temp.`);
  rationale.push(`Selected band: ${band.replace("_", " ")}.`);

  // Surface the calc so users see this isn't just air temp. Each factor is
  // its own delta in deg, with a short label. Hero renders them inline.
  const factors = [];
  const apparentDelta = apparentRaw - num(c.tempC);
  if (Math.abs(apparentDelta) >= 0.4) {
    let lab = "humidity";
    if (c.tempC <= CFG.windChillTempC && c.kph > CFG.windChillMinWindKph) lab = "wind chill";
    else if (c.tempC >= CFG.heatIndexTempC) lab = "humidity";
    factors.push({ label: lab, delta: apparentDelta });
  }
  if (Math.abs(cAdj) >= 0.4) factors.push({ label: cAdj > 0 ? "sun" : "shade", delta: cAdj });
  if (Math.abs(bAdj) >= 0.4) factors.push({ label: "breeze", delta: bAdj });
  const personalSum = baseOff + learned + (CFG.activityOffset || 0) + (CFG.adaptiveShift || 0);
  if (Math.abs(personalSum) >= 0.4) factors.push({ label: "you", delta: personalSum });

  let acc = r.acc.map(a => ({ ...a }));
  let outer = r.outer ? { ...r.outer } : null;
  let mid = r.mid ? { ...r.mid } : null;
  let base = r.base;
  let bottom = r.bottom;
  let footwear = { ...r.footwear };

  // Warm-day anticipation: when the day will warm into a notably warmer
  // band AND it's still morning, dress for the peak with a shed-able
  // outer for the cool start. People dressed for 16C in the morning when
  // it'll be 26C by afternoon look overdressed by 11am.
  const peakBand = pickBand(effective(arc.max));
  const peakIdx = bandIdx(peakBand);
  const nowIdx = bandIdx(band);
  const localHour = c.time ? localHourOf(c.time) : new Date().getHours();
  const isMorning = localHour >= 6 && localHour < 12;
  if ((nowIdx - peakIdx) >= 2 && arc.spread >= 5 && isMorning) {
    const peakR = RECIPES[peakBand];
    base = peakR.base;
    bottom = peakR.bottom;
    mid = peakR.mid ? { ...peakR.mid } : null;
    footwear = { ...peakR.footwear };
    acc = peakR.acc.map(a => ({ ...a }));
    if (!outer) outer = { ic: "hoodie", v: "light cardigan or zip-up", clo: 0.30 };
    rationale.push(`Warms to ${Math.round(arc.max)}° around ${hour(arc.maxTime)}. Dressing for the warm part with a layer to shed.`);
  }

  if (arc.maxKph >= CFG.windLayerKph && !outer && eNow < CFG.windShellMaxEffC) {
    outer = { ic: "hoodie", v: "wind-resistant shell" };
    rationale.push(`Sustained wind reaches ${Math.round(arc.maxKph)} km/h and it's cool enough (${eNow.toFixed(1)}°) to feel it. Adding a wind shell.`);
  }

  const rainLikely = arc.maxProb >= CFG.rainShellProbabilityPct || arc.totalMm >= CFG.rainShellTotalMm;
  if (rainLikely) {
    outer = outer ? { ic: "hoodie", v: `${outer.v} (waterproof)` } : { ic: "hoodie", v: "waterproof rain shell" };
    if (arc.totalMm >= 4) footwear = { ic: footwear.ic, v: `waterproof ${footwear.v}` };
    rationale.push(`Rain likely (${Math.round(arc.maxProb)}% peak chance, ${arc.totalMm.toFixed(1)} mm over 12h). Wear a waterproof shell.`);
  } else if (arc.maxProb >= CFG.umbrellaProbabilityPct) {
    acc.push({ ic: "umbrella", v: "compact umbrella" });
    rationale.push(`Light chance of rain (${Math.round(arc.maxProb)}%). Toss an umbrella in your bag.`);
  }

  if (arc.totalSnow >= CFG.snowBootsCm) {
    footwear = { ic: "armored-boot", v: "insulated waterproof boots" };
    outer = { ic: "hoodie", v: outer && outer.v ? `${outer.v.replace(/^waterproof\s+/, "").replace(/\s*\(waterproof\)$/, "")} (waterproof, insulated)` : "waterproof insulated jacket" };
    if (!acc.some(a => a.v.includes("hat"))) acc.push({ ic: "cap", v: "warm hat" });
    if (!acc.some(a => a.v.includes("gloves"))) acc.push({ ic: "glove", v: "gloves" });
    if (arc.totalSnow >= CFG.snowHeavyCm && !acc.some(a => a.v.includes("scarf"))) acc.push({ ic: "🧣", v: "scarf or neck gaiter" });
    rationale.push(`Snow expected (${arc.totalSnow.toFixed(1)} cm over 12h). Boots, waterproof outer, hat and gloves.`);
  }

  if (arc.maxUv >= CFG.uvProtectionIndex) {
    if (!acc.some(a => a.v === "sunglasses")) acc.push({ ic: "sunglasses", v: "sunglasses" });
    if (arc.maxUv >= CFG.uvProtectionIndex + 1 && !acc.some(a => a.v.includes("hat"))) acc.push({ ic: "cap", v: "brimmed hat" });
    rationale.push(`UV peaks at ${arc.maxUv.toFixed(1)} (>= ${CFG.uvProtectionIndex}, WHO sun-protection threshold).`);
    if (arc.maxUv >= CFG.uvSunscreenIndex) {
      acc.push({ ic: "🧴", v: "sunscreen" });
      rationale.push(`UV reaches "high" (>= ${CFG.uvSunscreenIndex}). Apply SPF.`);
    }
  }

  let bring = null;
  const minE = effective(arc.min), maxE = effective(arc.max);
  const minB = pickBand(minE), maxB = pickBand(maxE), nowB = band;
  const colder = bandIdx(minB) > bandIdx(nowB), warmer = bandIdx(maxB) < bandIdx(nowB);
  const fmtT = c => `${Math.round(c)}°`;
  if (arc.cross && colder) bring = `Cools to ${fmtT(arc.min)} around ${hour(arc.minTime)}. Pack an extra layer.`;
  else if (arc.cross && warmer) bring = `Warms to ${fmtT(arc.max)} by ${hour(arc.maxTime)}. Wear something you can shed.`;
  else if (arc.spread >= CFG.bringLayerSpreadC) bring = `Big swing today, ${fmtT(arc.min)} at ${hour(arc.minTime)} up to ${fmtT(arc.max)} by ${hour(arc.maxTime)}. Bring a layer you can adjust.`;

  const conditions = [];
  if (arc.maxProb >= 40 || arc.totalMm >= 1) conditions.push("rain");
  if (arc.maxKph >= 15) conditions.push("wind");
  if ((arc.totalSnow || 0) >= 0.5) conditions.push("snow");
  if (c.isDay && num(c.cloud, 50) < 30) conditions.push("sun");
  const layersOut = { base, mid, outer, bottom, footwear, acc };
  const clo = totalClo(layersOut);
  rationale.push(`Outfit insulation: ~${clo.toFixed(2)} clo (ASHRAE 55 / ISO 9920 garment table).`);
  return { aNow, eNow, band, layers: layersOut, bring, rationale, arc, conditions, clo, factors };
}

function buildTimeline(weather) {
  const events = [];
  // Filter to waking hours (6 AM to 10 PM local) so we do not narrate sleep.
  const hours = weather.next12h.map(p => {
    const a = feels(p);
    return { t: p.time, tempC: p.tempC, apparent: a, eff: effective(a), band: pickBand(effective(a)), uv: p.uv, precipProb: p.precipProb, precipMm: p.precipMm, kph: p.kph };
  }).filter(h => {
    const hr = localHourOf(h.t);
    return hr >= 6 && hr <= 22;
  });
  if (hours.length === 0) return events;

  const startBand = hours[0].band;
  const sr = RECIPES[startBand];
  const startBits = [sr.base.v, sr.mid && sr.mid.v, sr.outer && sr.outer.v].filter(Boolean).slice(0, 2);
  events.push({ t: hours[0].t, ic: sr.base.ic, text: `<strong>Start:</strong> ${startBits.join(" + ")}` });

  for (let i = 1; i < hours.length; i++) {
    if (hours[i].band !== hours[i-1].band) {
      const fromI = bandIdx(hours[i-1].band), toI = bandIdx(hours[i].band);
      const r2 = RECIPES[hours[i].band];
      if (toI > fromI) {
        const add = (r2.outer && r2.outer.v) || (r2.mid && r2.mid.v) || "a layer";
        events.push({ t: hours[i].t, ic: "hoodie", text: `Cools to ${Math.round(hours[i].apparent)}°, <strong>add ${add}</strong>` });
      } else {
        events.push({ t: hours[i].t, ic: "☀️", text: `Warms to ${Math.round(hours[i].apparent)}°, <strong>shed a layer</strong>` });
      }
    }
  }

  let peakUv = -Infinity, peakIdx = -1;
  hours.forEach((h, i) => { if (h.uv > peakUv) { peakUv = h.uv; peakIdx = i; } });
  if (peakUv >= CFG.uvProtectionIndex && peakIdx >= 0) {
    const applyIdx = Math.max(0, peakIdx - 1);
    if (peakUv >= CFG.uvSunscreenIndex) {
      events.push({ t: hours[applyIdx].t, ic: "🧴", text: `<strong>Apply sunscreen.</strong> UV peaks at ${peakUv.toFixed(0)} around ${hour(hours[peakIdx].t)}` });
    } else {
      events.push({ t: hours[applyIdx].t, ic: "sunglasses", text: `Sun gets stronger. UV ${peakUv.toFixed(0)} around ${hour(hours[peakIdx].t)}` });
    }
  }

  const rainStart = hours.findIndex(h => num(h.precipProb) >= CFG.rainShellProbabilityPct || h.precipMm >= 0.5);
  if (rainStart >= 0) {
    const probAtStart = Math.round(num(hours[rainStart].precipProb));
    events.push({ t: hours[rainStart].t, ic: "umbrella", text: `<strong>Rain likely</strong>, ${probAtStart}% chance` });
  }

  const seen = new Set();
  return events
    .filter(e => { const k = e.t + "|" + e.ic; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => new Date(a.t) - new Date(b.t));
}

const LOCATION_DEFAULT = { lat: 49.2497, lon: -123.1193, tz: "America/Vancouver", name: "Vancouver, BC" };
let LOCATION = { ...LOCATION_DEFAULT };
function getTheme() {
  try { const t = localStorage.getItem("wtwfw-theme"); if (t === "light" || t === "dark") return t; } catch {}
  return "system";
}
function applyTheme() {
  const t = getTheme();
  let resolved = t;
  if (t === "system") {
    try { resolved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch { resolved = "dark"; }
  }
  document.documentElement.setAttribute("data-theme", resolved);
  // Sync the meta theme-color so the iOS status bar matches.
  try {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f8fafc" : "#0b1220");
  } catch {}
}
function setTheme(t) {
  try {
    if (t === "system") localStorage.removeItem("wtwfw-theme");
    else localStorage.setItem("wtwfw-theme", t);
  } catch {}
  applyTheme();
}

function loadLocation() {
  try {
    const s = localStorage.getItem("wtwfw-location");
    if (s) {
      const obj = JSON.parse(s);
      if (obj && Number.isFinite(obj.lat) && Number.isFinite(obj.lon) && obj.name) {
        LOCATION = { lat: obj.lat, lon: obj.lon, tz: obj.tz || "auto", name: String(obj.name) };
      }
    }
  } catch {}
}
// Subscription state. On the web this is a localStorage flag for a free
// trial; on iOS it'll be replaced with a StoreKit subscription check.
function getProStatus() {
  try {
    const flag = localStorage.getItem("wtwfw-pro");
    if (flag === "active") return { tier: "active", days: null };
    if (flag === "trial") {
      const exp = parseInt(localStorage.getItem("wtwfw-trial-expires") || "0", 10);
      if (Date.now() < exp) {
        const days = Math.max(0, Math.ceil((exp - Date.now()) / 86400000));
        return { tier: "trial", days };
      }
      // expired
      localStorage.removeItem("wtwfw-pro");
      localStorage.removeItem("wtwfw-trial-expires");
    }
  } catch {}
  return { tier: "free", days: null };
}
function isPro() { return getProStatus().tier !== "free"; }
function startProTrial() {
  try {
    localStorage.setItem("wtwfw-pro", "trial");
    localStorage.setItem("wtwfw-trial-expires", String(Date.now() + 14 * 86400000));
  } catch {}
}
function cancelPro() {
  try {
    localStorage.removeItem("wtwfw-pro");
    localStorage.removeItem("wtwfw-trial-expires");
  } catch {}
}

function getSavedLocations() {
  try {
    const s = localStorage.getItem("wtwfw-saved-locations");
    if (s) {
      const arr = JSON.parse(s);
      if (Array.isArray(arr)) return arr.filter(l => l && Number.isFinite(l.lat) && Number.isFinite(l.lon) && l.name).slice(0, 12);
    }
  } catch {}
  return [];
}
function setSavedLocations(arr) { try { localStorage.setItem("wtwfw-saved-locations", JSON.stringify(arr)); } catch {} }
function addSavedLocation(loc) {
  if (!loc || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lon) || !loc.name) return;
  const list = getSavedLocations();
  if (list.some(l => l.name === loc.name && Math.abs(l.lat - loc.lat) < 0.05)) return;
  const cap = isPro() ? 12 : 2;
  if (list.length >= cap) return;
  list.push({ lat: loc.lat, lon: loc.lon, tz: loc.tz || "auto", name: String(loc.name).slice(0, 60) });
  setSavedLocations(list);
}
function removeSavedLocation(name, lat) {
  const list = getSavedLocations().filter(l => !(l.name === name && Math.abs(l.lat - lat) < 0.05));
  setSavedLocations(list);
}

function saveLocation() {
  try { localStorage.setItem("wtwfw-location", JSON.stringify(LOCATION)); } catch {}
}

async function fetchFromOpenMeteo(loc) {
  const where = loc || LOCATION;
  const params = new URLSearchParams({
    latitude: where.lat, longitude: where.lon, timezone: where.tz || "auto",
    current: "temperature_2m,relative_humidity_2m,is_day,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,uv_index",
    hourly: "temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,uv_index,is_day",
    wind_speed_unit: "kmh", temperature_unit: "celsius", precipitation_unit: "mm", forecast_days: "16",
  });
  const r = await fetch("https://api.open-meteo.com/v1/forecast?" + params, { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error(`Open-Meteo ${r.status}`);
  const d = await r.json();
  if (!d || typeof d !== "object") throw new Error("Bad Open-Meteo response shape");
  const c = d.current, h = d.hourly;
  if (!c || !h || !Array.isArray(h.time)) throw new Error("Bad Open-Meteo response shape");
  const allHours = [];
  for (let i = 0; i < h.time.length; i++) {
    allHours.push({
      time: String(h.time[i] || ""),
      tempC: num(h.temperature_2m && h.temperature_2m[i]),
      rh: clamp(num(h.relative_humidity_2m && h.relative_humidity_2m[i]), 0, 100),
      kph: Math.max(0, num(h.wind_speed_10m && h.wind_speed_10m[i])),
      precipMm: Math.max(0, num(h.precipitation && h.precipitation[i])),
      precipProb: clamp(num(h.precipitation_probability && h.precipitation_probability[i]), 0, 100),
      uv: Math.max(0, num(h.uv_index && h.uv_index[i])),
      cloud: clamp(num(h.cloud_cover && h.cloud_cover[i]), 0, 100),
      snowCm: Math.max(0, num(h.snowfall && h.snowfall[i])),
      code: num(h.weather_code && h.weather_code[i]),
      isDay: (h.is_day && h.is_day[i]) === 1,
    });
  }
  const now = Date.now();
  let start = 0;
  for (let i = 0; i < allHours.length; i++) if (new Date(allHours[i].time).getTime() <= now) start = i; else break;
  const next12h = relevantNext(allHours, start, 10);
  return {
    current: {
      time: String(c.time || ""),
      tempC: num(c.temperature_2m),
      rh: clamp(num(c.relative_humidity_2m), 0, 100),
      kph: Math.max(0, num(c.wind_speed_10m)),
      uv: Math.max(0, num(c.uv_index)),
      cloud: clamp(num(c.cloud_cover), 0, 100),
      code: num(c.weather_code),
      isDay: c.is_day === 1,
    },
    next12h,
    allHours,
  };
}

// Met Norway Locationforecast API. Free, no key. Returns timeseries with
// instant air temp / humidity / wind / cloud / and next-hour precipitation.
// Wind is m/s, we convert to km/h. UV not provided so we leave OM's value.
// Open-Meteo archive API: same dates one year ago as a climatology proxy
// for trips beyond the 16-day forecast horizon. Returned hour timestamps
// are shifted forward by one year so downstream code (buildDailySummaries,
// renderDayGraph) can treat the data as if it's for the user's actual
// future dates. The result is flagged _historical so the UI can label it.
async function fetchFromArchive(loc, plannedStartIso, plannedEndIso) {
  const yearShift = 1;
  const start = new Date(plannedStartIso + "T00:00:00Z");
  const end = new Date(plannedEndIso + "T23:59:59Z");
  const aStart = new Date(start); aStart.setUTCFullYear(start.getUTCFullYear() - yearShift);
  const aEnd = new Date(end); aEnd.setUTCFullYear(end.getUTCFullYear() - yearShift);
  const fmtD = d => d.toISOString().slice(0, 10);
  const params = new URLSearchParams({
    latitude: loc.lat, longitude: loc.lon, timezone: loc.tz || "auto",
    start_date: fmtD(aStart), end_date: fmtD(aEnd),
    hourly: "temperature_2m,relative_humidity_2m,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,is_day",
    wind_speed_unit: "kmh", temperature_unit: "celsius", precipitation_unit: "mm",
  });
  const r = await fetch("https://archive-api.open-meteo.com/v1/archive?" + params, { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error(`Archive ${r.status}`);
  const d = await r.json();
  const h = d && d.hourly;
  if (!h || !Array.isArray(h.time)) throw new Error("Bad archive shape");
  const allHours = [];
  for (let i = 0; i < h.time.length; i++) {
    const orig = new Date(h.time[i]);
    orig.setUTCFullYear(orig.getUTCFullYear() + yearShift);
    allHours.push({
      time: orig.toISOString(),
      tempC: num(h.temperature_2m && h.temperature_2m[i]),
      rh: clamp(num(h.relative_humidity_2m && h.relative_humidity_2m[i]), 0, 100),
      kph: Math.max(0, num(h.wind_speed_10m && h.wind_speed_10m[i])),
      precipMm: Math.max(0, num(h.precipitation && h.precipitation[i])),
      precipProb: 0,
      uv: 0,
      cloud: clamp(num(h.cloud_cover && h.cloud_cover[i]), 0, 100),
      snowCm: Math.max(0, num(h.snowfall && h.snowfall[i])),
      code: num(h.weather_code && h.weather_code[i]),
      isDay: (h.is_day && h.is_day[i]) === 1,
    });
  }
  return { current: null, allHours, _historical: true };
}

async function fetchFromMetNo() {
  const url = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${LOCATION.lat.toFixed(4)}&lon=${LOCATION.lon.toFixed(4)}`;
  const r = await fetch(url, { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error(`Met Norway ${r.status}`);
  const d = await r.json();
  const series = d && d.properties && d.properties.timeseries;
  if (!Array.isArray(series)) throw new Error("Bad Met Norway shape");
  const hours = [];
  for (const e of series) {
    const inst = (e.data && e.data.instant && e.data.instant.details) || {};
    const next1 = (e.data && e.data.next_1_hours && e.data.next_1_hours.details) || {};
    hours.push({
      time: String(e.time || ""),
      tempC: num(inst.air_temperature),
      rh: clamp(num(inst.relative_humidity), 0, 100),
      kph: Math.max(0, num(inst.wind_speed) * 3.6),
      cloud: clamp(num(inst.cloud_area_fraction), 0, 100),
      precipMm: Math.max(0, num(next1.precipitation_amount)),
    });
  }
  return { hours };
}

// Mean of two values when both finite, otherwise the finite one.
function avg2(a, b) {
  const aFin = Number.isFinite(a), bFin = Number.isFinite(b);
  if (aFin && bFin) return (a + b) / 2;
  if (aFin) return a;
  if (bFin) return b;
  return 0;
}

function blendWeather(om, mn) {
  if (!mn || !Array.isArray(mn.hours)) return;
  const byTime = new Map();
  for (const h of mn.hours) byTime.set(h.time, h);
  for (const h of om.allHours) {
    const m = byTime.get(h.time);
    if (!m) continue;
    h.tempC = avg2(h.tempC, m.tempC);
    h.rh = avg2(h.rh, m.rh);
    h.kph = avg2(h.kph, m.kph);
    h.cloud = avg2(h.cloud, m.cloud);
    if (Number.isFinite(m.precipMm)) h.precipMm = Math.max(h.precipMm, m.precipMm);
  }
  // Blend current with the Met Norway hour closest to now.
  const nowMs = Date.now();
  let best = null, bestDiff = Infinity;
  for (const h of mn.hours) {
    const diff = Math.abs(new Date(h.time).getTime() - nowMs);
    if (diff < bestDiff) { bestDiff = diff; best = h; }
  }
  if (best) {
    om.current.tempC = avg2(om.current.tempC, best.tempC);
    om.current.rh = avg2(om.current.rh, best.rh);
    om.current.kph = avg2(om.current.kph, best.kph);
    om.current.cloud = avg2(om.current.cloud, best.cloud);
  }
}

async function fetchWeather() {
  const om = await fetchFromOpenMeteo();
  let mn = null;
  try { mn = await fetchFromMetNo(); } catch (e) { console.warn("Met Norway failed:", e && e.message); }
  if (mn) {
    blendWeather(om, mn);
    om._sources = ["Open-Meteo", "Met Norway"];
  } else {
    om._sources = ["Open-Meteo"];
  }
  return om;
}

// Pull the next N hours out of allHours starting at startIdx, but only the
// ones where the user is plausibly outside (6am-10pm local) AND only within
// the start day. Tomorrow morning shows up in the daily forecast graph;
// 'pack a layer because it cools at 6am' from any view today is just noise.
function relevantNext(allHours, startIdx, n) {
  if (startIdx >= allHours.length) return [];
  const startDate = localDateOf(allHours[startIdx].time);
  const out = [];
  let i = startIdx;
  while (out.length < n && i < allHours.length) {
    const hr = localHourOf(allHours[i].time);
    if (hr >= 6 && hr <= 22) {
      if (localDateOf(allHours[i].time) !== startDate) break;
      out.push(allHours[i]);
    }
    i++;
  }
  return out;
}

function buildDailySummaries(allHours) {
  const byDay = new Map();
  for (const h of allHours) {
    const d = localDateOf(h.time);
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(h);
  }
  const out = [];
  for (const [date, hours] of byDay) {
    if (hours.length === 0) continue;
    const temps = hours.map(p => p.tempC);
    const hi = Math.max(...temps), lo = Math.min(...temps);
    // Pick the warmest daytime apparent temp for the outfit, since that's
    // what people actually dress for.
    const dayHours = hours.filter(p => p.isDay);
    const sourceHours = dayHours.length ? dayHours : hours;
    let peakA = -Infinity;
    for (const p of sourceHours) {
      const a = feels(p);
      if (a > peakA) peakA = a;
    }
    const band = pickBand(effective(peakA));
    const r = RECIPES[band];
    const icons = [r.outer, r.mid, r.base, r.bottom, r.footwear].filter(Boolean).map(l => l.ic).join(" ");
    const code = dayHours.length ? Math.max(...dayHours.map(p => p.code)) : (hours[0].code || 0);
    const maxProb = Math.max(0, ...hours.map(p => p.precipProb || 0));
    out.push({ date, hi, lo, code, band, icons, jacket: !!r.outer, maxProb });
  }
  return out;
}

// Build hourly cells across multiple days (6 AM - 10 PM each day), each
// carrying a precomputed recommend() for its hour so taps can swap panels
// instantly. Default scroll position is "now" but the strip extends through
// the rest of the forecast so users can scroll forward.
function buildTodayCells(weather) {
  const today = todayDateLocal();
  const todayMs = new Date(today + "T00:00:00").getTime();
  const cutoffMs = todayMs + 7 * 24 * 3600 * 1000;
  const allHours = weather.allHours || [];
  const idxs = [];
  for (let i = 0; i < allHours.length; i++) {
    const h = allHours[i];
    const t = new Date(h.time).getTime();
    if (t < todayMs || t >= cutoffMs) continue;
    const hr = localHourOf(h.time);
    if (hr < 6 || hr > 22) continue;
    idxs.push(i);
  }
  const cells = idxs.map(i => {
    const h = allHours[i];
    const a = feels(h);
    const eff = effective(a);
    const band = pickBand(eff);
    const next12h = relevantNext(allHours, i, 10);
    const rec = recommend({ current: h, next12h });
    return { ...h, apparent: a, eff, band, rec };
  });
  if (!cells.length) return null;
  const todayCells = cells.filter(c => localDateOf(c.time) === today);
  const todayTemps = todayCells.length ? todayCells.map(c => c.tempC) : cells.map(c => c.tempC);
  const todayApps = todayCells.length ? todayCells.map(c => c.apparent) : cells.map(c => c.apparent);
  const hi = Math.max(...todayTemps), lo = Math.min(...todayTemps);
  const hiCell = (todayCells.length ? todayCells : cells)[todayTemps.indexOf(hi)];
  const loCell = (todayCells.length ? todayCells : cells)[todayTemps.indexOf(lo)];
  const allTemps = cells.map(c => c.tempC);
  const cellsHi = Math.max(...allTemps);
  const cellsLo = Math.min(...allTemps);
  const peakIdx = cells.findIndex(c => c.apparent === Math.max(...todayApps));
  const maxRainProb = Math.max(0, ...todayCells.map(c => c.precipProb || 0));
  return { cells, hi, lo, hiTime: hiCell.time, loTime: loCell.time, cellsHi, cellsLo, peakIdx, maxRainProb };
}

const WMO = {
  0: ["Clear", "☀️"], 1: ["Mostly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
  45: ["Fog", "🌫️"], 48: ["Fog", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
  61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
  71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"],
  80: ["Showers", "🌦️"], 81: ["Showers", "🌧️"], 82: ["Heavy showers", "🌧️"],
  95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"],
};
const BAND_LABEL = { scorching: "Scorching", hot: "Hot", warm: "Warm", mild: "Mild", cool: "Cool", chilly: "Chilly", cold: "Cold", very_cold: "Very cold", freezing: "Freezing" };

const fmt = c => `${Math.round(num(c))}°`;
const wmo = code => WMO[code] || ["Unknown", "🌤️"];
const hour = (iso) => {
  try {
    return new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", hour12: true, timeZone: LOCATION.tz })
      .replace(/\s/g, "").toLowerCase();
  } catch { return ""; }
};
const hourShort = (iso) => {
  try {
    const s = new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", hour12: true, timeZone: LOCATION.tz });
    // "8 AM" -> "8a", "12 PM" -> "12p"
    return s.replace(/\s?AM/i, "a").replace(/\s?PM/i, "p");
  } catch { return ""; }
};
const localHourOf = (iso) => {
  try {
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: LOCATION.tz, hour12: false, hour: "2-digit" }).formatToParts(new Date(iso));
    return parseInt((parts.find(p => p.type === "hour") || { value: "0" }).value, 10);
  } catch { return 0; }
};
const localDateOf = (iso) => {
  try { return new Date(iso).toLocaleDateString("en-CA", { timeZone: LOCATION.tz }); }
  catch { return ""; }
};
const todayDateLocal = () => new Date().toLocaleDateString("en-CA", { timeZone: LOCATION.tz });
const dayLabel = (isoDate) => {
  try {
    const d = new Date(isoDate + "T12:00:00");
    const today = new Date(todayDateLocal() + "T12:00:00");
    const diffDays = Math.round((d.getTime() - today.getTime()) / 86400000);
    if (diffDays === 0) return "Today";
    return d.toLocaleDateString("en-US", { weekday: "short", timeZone: LOCATION.tz });
  } catch { return ""; }
};
const rainLevel = p => p >= 40 ? "wet" : p >= 10 ? "maybe" : "dry";

function describeFeel(rec, c, cLabel) {
  const parts = [];
  const conds = rec.conditions || [];
  if (conds.includes("rain")) parts.push("rainy");
  else if (conds.includes("snow")) parts.push("snowy");
  if (conds.includes("wind")) parts.push("breezy");
  if (conds.includes("sun")) parts.push("sunny");
  const uv = num(c.uv, 0);
  if (c.isDay && uv < 1 && !parts.includes("breezy")) parts.push("low sun");
  if (!parts.length && cLabel) parts.push(String(cLabel).toLowerCase());
  if (!parts.length) return "";
  const joined = parts.join(", ");
  return joined.charAt(0).toUpperCase() + joined.slice(1) + ".";
}

function itemMatchesItem(it, refTemp, currentConds) {
  if (it.minTemp !== null && refTemp < it.minTemp) return false;
  if (it.maxTemp !== null && refTemp > it.maxTemp) return false;
  if (Array.isArray(it.conditions) && it.conditions.length) {
    for (const c of it.conditions) if (!currentConds.includes(c)) return false;
  }
  return true;
}
function renderWear(rec) {

  }).join("");
  const umbrellaItem = rec.layers.acc.find(a => a.v.includes("umbrella"));

function renderHourStrip(today, selectedIdx, nowIdx) {
  const cells = today.cells;
  const range = Math.max(today.cellsHi - today.cellsLo, 1);
  const yOf = t => 28 + (1 - (t - today.cellsLo) / range) * 47;
  const xOf = i => ((i + 0.5) / cells.length) * 100;
  const colRem = 3;
  const path = "M" + cells.map((c, i) => `${xOf(i).toFixed(2)},${yOf(c.tempC).toFixed(2)}`).join(" L");
  let prevDate = null;

    const rainBadge = prob >= 20
      ? `<div class="dg-rain ${prob < 40 ? "maybe" : ""}" style="top: ${hiY}%">☂ ${prob}%</div>`
      : "";
    return `<div class="dg-col${isToday ? " is-today" : ""}" style="left: ${xOf(i).toFixed(2)}%">
      <div class="dg-hi" style="top: ${hiY}%">${fmt(d.hi)}</div>
      <div class="dg-icon" style="top: ${hiY}%">${bigIcon(icon)}</div>
      ${rainBadge}
      <div class="dg-lo" style="top: ${loY}%">${fmt(d.lo)}</div>
      <div class="dg-day">${esc(dayLabel(d.date))}</div>
    </div>`;
  }).join("");
  return `<div class="day-graph" style="width: ${(cols * colRem).toFixed(2)}rem">
    <svg class="dg-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="${loPath}" class="dg-line dg-line-lo" />
      <path d="${hiPath}" class="dg-line dg-line-hi" />
    </svg>
    ${colsHtml}
  </div>`;
}

function renderComing(weather) {
  const days = buildDailySummaries(weather.allHours || []);
  if (!days.length) return "";
  const colRem = 3.6;
  const hint = days.length > 7 ? `<div class="day-hint">Swipe to see all ${days.length} days ›</div>` : "";
  return `<section class="panel">
    <h2>Daily forecast</h2>
    <div class="day-graph-list" id="day-list">
      ${renderDayGraph(days, colRem)}
    </div>
    ${hint}
  </section>`;
}

function pickInitialIdx(today) {
  // Prefer "now" if today has a cell at the current local hour.
  const now = Date.now();
  let nowIdx = -1;
  for (let i = 0; i < today.cells.length; i++) {
    if (new Date(today.cells[i].time).getTime() <= now) nowIdx = i;
    else break;
  }
  if (nowIdx >= 0) return { selectedIdx: nowIdx, nowIdx };
  return { selectedIdx: today.peakIdx, nowIdx: -1 };
}

function render(weather) {
  CFG.adaptiveShift = adaptiveShift(weather.allHours);
  if (APP_MODE === "trip") { renderTripView(); return; }
  const c = weather.current;
  const [cLabel] = wmo(c.code);
  const root = document.getElementById("root");

  const today = buildTodayCells(weather);

  // Fall back when today has no remaining hours (late evening). Use current.
  if (!today) {
    const rec = recommend({ current: c, next12h: weather.next12h });
    weather._lastRec = rec;
    root.innerHTML = `
      ${renderHero(rec, c, cLabel)}
      ${renderBring(rec)}
      ${renderWear(rec)}
      ${renderHeadsUp(weather)}
      ${renderComing(weather)}
      ${renderCloset()}
      ${renderSettings()}
      ${renderPro()}
      ${renderPrivacy()}
      ${renderWhy(rec, (LAST_WEATHER && LAST_WEATHER._sources || ["Open-Meteo"]).join(" + "))}
      <div class="footer">${esc(LOCATION.name)} . v50-hugeicons-base</div>
    `;
    attachToggleHandler(root);
    return;
  }

  const { selectedIdx, nowIdx } = pickInitialIdx(today);
  let currentIdx = selectedIdx;
  const rec = today.cells[currentIdx].rec;
  weather._lastRec = rec;

  root.innerHTML = `
    ${renderHero(rec, today.cells[currentIdx], cLabel)}
    <div class="section-title">Hourly forecast</div>
    ${renderTodayLine(today)}
    ${renderHourStrip(today, currentIdx, nowIdx)}
    ${renderBring(rec)}
    ${renderWear(rec)}
    ${renderHeadsUp(weather)}
    ${renderComing(weather)}
    ${renderCloset()}
    ${renderSettings()}
    ${renderWhy(rec, "Open-Meteo")}
    <div class="footer">${esc(LOCATION.name)} . v50-hugeicons-base</div>
  `;

  // Scroll selected cell into center of strip.
  const strip = root.querySelector("#hour-strip");
  const selBtn = strip && strip.querySelector(`[data-idx="${currentIdx}"]`);
  if (selBtn) {
    requestAnimationFrame(() => selBtn.scrollIntoView({ inline: "center", block: "nearest", behavior: "instant" }));
  }

  // Hour cell taps: swap the dynamic panels in place.
  strip && strip.addEventListener("click", e => {
    const btn = e.target.closest(".hour-cell");
    if (!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    if (!Number.isFinite(idx) || idx === currentIdx) return;
    currentIdx = idx;
    for (const c2 of strip.querySelectorAll(".hour-cell")) c2.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-pressed", "true");
    const cell = today.cells[idx];
    const r2 = cell.rec;
    // For the hero's primary number, use that cell's air temp (what it'll feel
    // like at that hour), not the live current temp.
    const heroCtx = { tempC: cell.tempC, rh: cell.rh, kph: cell.kph };
    const [cLabel2] = wmo(cell.code);
    document.getElementById("hero").outerHTML = renderHero(r2, heroCtx, cLabel2);
    document.getElementById("bring").outerHTML = renderBring(r2);
    document.getElementById("wear").outerHTML = renderWear(r2);
    document.getElementById("why").outerHTML = renderWhy(r2, (LAST_WEATHER && LAST_WEATHER._sources || ["Open-Meteo"]).join(" + "));
  });

  attachToggleHandler(root);
  attachGlobalHandlers(root);
}

let GLOBAL_HANDLERS_ATTACHED = false;
function attachGlobalHandlers(root) {
  if (GLOBAL_HANDLERS_ATTACHED) return;
  GLOBAL_HANDLERS_ATTACHED = true;
  root.addEventListener("click", e => {
    const tripExit = e.target.closest("[data-trip-exit]");
    if (tripExit) { exitTripMode(); return; }
    const tripPick = e.target.closest("[data-trip-pick], [data-trip-search-pick]");
    if (tripPick) {
      TRIP_STATE.dest = {
        lat: num(tripPick.dataset.lat),
        lon: num(tripPick.dataset.lon),
        tz: tripPick.dataset.tz || "auto",
        name: tripPick.dataset.name,
      };
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const tripPlan = e.target.closest("[data-trip-plan]");
    if (tripPlan && !tripPlan.disabled) { runTripPlan(); return; }
    const fb = e.target.closest(".fb-btn");
    if (fb) { recordFeedback(fb.dataset.fb); return; }
    const rem = e.target.closest(".closet-remove");
    if (rem) {
      const slot = rem.dataset.slot;
      const idx = parseInt(rem.dataset.idx, 10);
      if (slot && Number.isFinite(idx)) {
        removeClosetItem(slot, idx);
        if (LAST_WEATHER) render(LAST_WEATHER);
      }
      return;
    }
    const retry = e.target.closest('[data-action="retry"]');
    if (retry) { refreshWeather(); return; }
    const startTrial = e.target.closest('[data-action="start-trial"]');
    if (startTrial) {
      startProTrial();
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const cancelProBtn = e.target.closest('[data-action="cancel-pro"]');
    if (cancelProBtn) {
      if (!confirm("Cancel Pro? You'll lose access to trip planning and any other Pro features.")) return;
      cancelPro();
      if (LAST_WEATHER) render(LAST_WEATHER);
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) {
      if (chip.dataset.action === "set-theme") {
        setTheme(chip.dataset.theme);
        if (LAST_WEATHER) render(LAST_WEATHER);
        return;
      }
      if (chip.dataset.action === "reset-onb") {
        try { localStorage.removeItem("wtwfw-onboarded"); } catch {}
        if (LAST_WEATHER) render(LAST_WEATHER);
        maybeShowOnboarding();
        return;
      }
      if (chip.dataset.action === "wipe-data") {
        if (!confirm("This wipes your closet, snapshots, calibration, location, and settings from this browser. The forecast itself isn't affected. Continue?")) return;
        try {
          for (const k of ["wtwfw-baseline", "wtwfw-activity", "wtwfw-learned", "wtwfw-location", "wtwfw-saved-locations", "wtwfw-closet", "wtwfw-overrides", "wtwfw-snapshots", "wtwfw-onboarded", "wtwfw-pro", "wtwfw-trial-expires", "wtwfw-theme"]) localStorage.removeItem(k);
        } catch {}
        loadLocation();
        applySettings();
        refreshWeather();
        return;
      }
      const pref = chip.dataset.pref;
      const val = chip.dataset.val;
      if (pref && val && PREFS[pref]) {
        setPref(pref, val);
        applySettings();
        if (LAST_WEATHER) render(LAST_WEATHER);
      }
      return;
    }
    if (e.target.closest("[data-loc-open]")) { openLocationModal(); return; }
    if (e.target.closest("[data-snap-open]")) { openSnapshotModal(); return; }
    const row = e.target.closest("[data-row-slot]");
    if (row) {
      openOverridePicker(row.dataset.rowSlot, row.dataset.currentValue || null);
      return;
    }
  });
  root.addEventListener("submit", e => {
    const form = e.target.closest("#closet-form");
    if (!form) return;
    e.preventDefault();
    const name = (form.querySelector('input[name="name"]') || {}).value || "";
    const slot = (form.querySelector('select[name="slot"]') || {}).value || "";
    const minRaw = (form.querySelector('input[name="minTemp"]') || {}).value;
    const maxRaw = (form.querySelector('input[name="maxTemp"]') || {}).value;
    const minTemp = minRaw === "" ? null : Number(minRaw);
    const maxTemp = maxRaw === "" ? null : Number(maxRaw);
    const conds = Array.from(form.querySelectorAll('input[name="cond"]:checked')).map(c => c.value);
    if (name.trim() && CLOSET_SLOTS[slot]) {
      const result = addClosetItem(slot, name, minTemp, maxTemp, conds);
      if (result && result.ok) {
        form.reset();
        if (LAST_WEATHER) render(LAST_WEATHER);
        showToast(`Added "${result.name}" to your closet.`);
      } else if (result && result.reason === "duplicate") {
        showToast(`"${result.name}" is already in your closet (with the same temps).`);
      } else if (result && result.reason === "full") {
        showToast(`That slot is full (24 items max). Remove one first.`);
      }
    }
  });
}

async function refreshWeather() {
  const root = document.getElementById("root");
  if (root) root.innerHTML = `<div class="loading">Checking the sky...</div>`;
  try {
    LAST_WEATHER = await fetchWeather();
    render(LAST_WEATHER);
  } catch (e) {
    renderError(e && e.message || String(e));
  }
}

function maybeShowOnboarding() {
  try { if (localStorage.getItem("wtwfw-onboarded") === "1") return; } catch {}
  if (!LAST_WEATHER || !LAST_WEATHER.current) return;
  showOnboarding();
}

function showOnboarding() {
  if (document.querySelector(".onb-overlay")) return;
  const c = LAST_WEATHER.current;
  const aNow = feels(c);
  const overlay = document.createElement("div");
  overlay.className = "onb-overlay";
  document.body.appendChild(overlay);
  const TOTAL = 5;
  const state = { step: 1, owned: new Set(), wearing: new Set(), comfort: null };
  const close = () => overlay.remove();
  const finishSkip = () => { try { localStorage.setItem("wtwfw-onboarded", "1"); } catch {} close(); };

  function step1() {
    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 1 of ${TOTAL}</div>
      <h2>Welcome.</h2>
      <p>Most weather apps tell you the temperature. We tell you what to wear.</p>
      <details class="onb-science">
        <summary>How it works (the nerdy bit)</summary>
        <p>We blend forecasts from <strong>Open-Meteo</strong> and <strong>Met Norway</strong>, then run them through published thermal-comfort science:</p>
        <ul>
          <li><strong>NWS Wind Chill</strong> when it's cold and windy.</li>
          <li><strong>BOM Apparent Temperature</strong> in the in-between range.</li>
          <li><strong>NOAA Heat Index</strong> when it's hot and humid.</li>
          <li>Our own cloud + UV adjustments for sun, shade and dusk.</li>
          <li>A breeze penalty for the warm-and-windy case the formulas miss.</li>
        </ul>
        <p>Then your personal calibration: body baseline, activity, learned offset from tap-to-teach, and item-level closet preferences.</p>
        <p class="src">Sources: NWS, BOM, NOAA, ISO 7730 / ASHRAE 55, de Dear &amp; Brager 2002.</p>
      </details>
      <div class="onb-actions">
        <button class="onb-next" type="button" id="onb-next">Let's go</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-next").onclick = () => { state.step = 2; render(); };
  }

  function step2() {
    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 2 of ${TOTAL}</div>
      <h2>Where are you?</h2>
      <p>So we pull the right forecast. You can change this any time.</p>
      <button class="onb-here" type="button" id="onb-locate">📍 Use my current location</button>
      <button class="onb-here" type="button" id="onb-keep">Keep ${esc(LOCATION.name)}</button>
      <div class="onb-actions">
        <button class="onb-back" type="button" id="onb-back">Back</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-back").onclick = () => { state.step = 1; render(); };
    overlay.querySelector("#onb-keep").onclick = () => { state.step = 3; render(); };
    overlay.querySelector("#onb-locate").onclick = (e) => {
      const btn = e.currentTarget;
      if (!navigator.geolocation) { btn.textContent = "Geolocation not supported"; return; }
      btn.disabled = true;
      btn.textContent = "Locating...";
      navigator.geolocation.getCurrentPosition(pos => {
        const tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "auto";
        LOCATION = { lat: pos.coords.latitude, lon: pos.coords.longitude, tz, name: "Current location" };
        saveLocation();
        state.step = 3;
        refreshWeather().then(() => render());
      }, () => {
        btn.disabled = false;
        btn.textContent = "Couldn't locate. Tap to try again.";
      }, { timeout: 10000, maximumAge: 60000 });
    };
  }

  function step3() {
    const actChips = PREFS.activity.options.map(o =>

      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-back").onclick = () => { state.step = 3; render(); };
    overlay.querySelector("#onb-next").onclick = () => { state.step = 5; render(); };

      btn.onclick = () => {
        const v = btn.dataset.v;

  }

  function step5() {
    const tempLine = `It's ${fmt(c.tempC)} in ${esc(LOCATION.name)}, feels ${fmt(aNow)} for you.`;
    const ownedList = state.owned.size
      ? ONB_OUTFIT.filter(o => state.owned.has(o.v))

    const groups = SLOT_GROUPS.map(g => {
      const items = ownedList.filter(o => o.slot === g.slot);

      return `<div class="onb-section">

    overlay.innerHTML = `<div class="onb-card">
      <div class="onb-step">Step 5 of ${TOTAL}</div>

      <p>${tempLine} Pick what you'd put on so we can calibrate. If you're inside and not sure, skip it.</p>
      ${emptyHint}
      ${groups}
      <div class="onb-section">
        <div class="onb-label">And how would it feel?</div>
        <div class="onb-comfort">
          <button type="button" data-c="cold" class="${state.comfort === "cold" ? "on" : ""}"><span class="em">${bigIcon("🥶")}</span><span>Too cold</span></button>
          <button type="button" data-c="right" class="${state.comfort === "right" ? "on" : ""}"><span class="em">${bigIcon("👌")}</span><span>Just right</span></button>
          <button type="button" data-c="warm" class="${state.comfort === "warm" ? "on" : ""}"><span class="em">${bigIcon("🥵")}</span><span>Too warm</span></button>
          <button type="button" data-c="unsure" class="${state.comfort === "unsure" ? "on" : ""}"><span class="em">${bigIcon("🤷")}</span><span>I'm inside, not sure</span></button>
        </div>
      </div>
      <div class="onb-actions">
        <button class="onb-back" type="button" id="onb-back">Back</button>
        <button class="onb-next" type="button" id="onb-finish">Finish</button>
      </div>
      <button class="onb-skip" type="button" id="onb-skip">Skip setup</button>
    </div>`;
    overlay.querySelector("#onb-skip").onclick = finishSkip;
    overlay.querySelector("#onb-back").onclick = () => { state.step = 4; render(); };
    overlay.querySelector("#onb-finish").onclick = finish;
    overlay.querySelectorAll(".onb-chip").forEach(btn => {
      btn.onclick = () => {
        const v = btn.dataset.v;
        if (state.wearing.has(v)) state.wearing.delete(v); else state.wearing.add(v);
        btn.setAttribute("aria-pressed", state.wearing.has(v) ? "true" : "false");
      };
    });
    overlay.querySelectorAll(".onb-comfort button").forEach(btn => {
      btn.onclick = () => {
        state.comfort = btn.dataset.c;
        overlay.querySelectorAll(".onb-comfort button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
      };
    });
  }

  function finish() {
    const closet = getCloset();
    // Owned items go in the closet. Anything tapped in the wearing step that
    // wasn't already marked owned (e.g. step 4 was skipped) also lands here.
    const toSave = new Set([...state.owned, ...state.wearing]);
    for (const v of toSave) {
      const opt = ONB_OUTFIT.find(o => o.v === v);
      if (!opt) continue;
      if (!Array.isArray(closet[opt.slot])) closet[opt.slot] = [];
      if (!closet[opt.slot].some(it => it.name.toLowerCase() === opt.label.toLowerCase())) {
        closet[opt.slot].push({ name: opt.label, minTemp: opt.minTemp ?? null, maxTemp: opt.maxTemp ?? null, conditions: opt.conditions || [] });
      }
    }
    setCloset(closet);
    if (state.comfort === "cold") setLearned(getLearned() - 1.5);
    else if (state.comfort === "warm") setLearned(getLearned() + 1.5);
    try { localStorage.setItem("wtwfw-onboarded", "1"); } catch {}
    applySettings();
    close();
    if (LAST_WEATHER) window.render(LAST_WEATHER);
  }

  function render() {
    if (state.step === 1) step1();
    else if (state.step === 2) step2();
    else if (state.step === 3) step3();
    else if (state.step === 4) step4();
    else step5();
  }
  render();
}

        tz: pick.dataset.tz || "auto",

      };

      close();
      refreshWeather();

    if (!navigator.geolocation) { here.textContent = "Geolocation not supported"; return; }
    here.disabled = true;
    here.textContent = "Locating...";
    navigator.geolocation.getCurrentPosition(pos => {
      const tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "auto";
      LOCATION = { lat: pos.coords.latitude, lon: pos.coords.longitude, tz, name: "Current location" };
      saveLocation();
      close();
      refreshWeather();

    }, { timeout: 10000, maximumAge: 60000 });
  });

  const search = overlay.querySelector(".loc-search");
  const results = overlay.querySelector(".loc-results");

        const r = await fetch(url, { cache: "no-store", referrerPolicy: "no-referrer" });
        const d = await r.json();
        results.innerHTML = "";
        const items = (d && d.results) || [];
        if (!items.length) { results.innerHTML = `<li class="loc-empty">No matches</li>`; return; }

          const parts = [item.name, item.admin1, item.country].filter(Boolean);
          btn.textContent = parts.join(", ");
          btn.addEventListener("click", () => {
            const newLoc = {
              lat: num(item.latitude),
              lon: num(item.longitude),
              tz: item.timezone || "auto",
              name: parts.slice(0, 2).join(", ") || item.name,
            };
            addSavedLocation(newLoc);
            LOCATION = newLoc;
            saveLocation();
            close();
            refreshWeather();
          });
          li.appendChild(btn);
          results.appendChild(li);
        }
      } catch (e) {
        results.innerHTML = `<li class="loc-empty">Search failed</li>`;
      }
    }, 250);
  });
}

function renderTripResults(weather, dest, startDate, endDate) {
  const days = buildDailySummaries(weather.allHours).filter(d => d.date >= startDate && d.date <= endDate);
  if (!days.length) return `<section class="panel"><p class="trip-error">No forecast available for those dates.</p></section>`;
  const closet = getCloset();
  const slots = ["outer", "mid", "base", "bottom", "footwear"];
  const packBySlot = { outer: new Set(), mid: new Set(), base: new Set(), bottom: new Set(), footwear: new Set() };
  const accSet = new Set();
  const tempsSeen = days.map(d => d.hi).concat(days.map(d => d.lo));
  const tMin = Math.min(...tempsSeen);
  const tMax = Math.max(...tempsSeen);
  const bandsNeeded = new Set(days.map(d => d.band));
  for (const band of bandsNeeded) {
    const r = RECIPES[band];
    for (const slot of slots) { if (r[slot]) packBySlot[slot].add(r[slot].v); }
    for (const a of (r.acc || [])) accSet.add(a.v);
  }
  for (const slot of slots) {
    const items = closet[slot] || [];
    for (const it of items) {
      const minOK = it.minTemp === null || it.minTemp <= tMax;
      const maxOK = it.maxTemp === null || it.maxTemp >= tMin;
      if (minOK && maxOK) packBySlot[slot].add(it.name + " (yours)");
    }
  }
  const packRows = slots.map(slot => {
    const list = Array.from(packBySlot[slot]);
    if (!list.length) return "";
    const label = { outer: "Jacket", mid: "Mid", base: "Top", bottom: "Bottom", footwear: "Shoes" }[slot];
    return `<div class="outfit-row"><span class="lbl">${esc(label)}</span><span class="val">${list.map(n => esc(n)).join(", ")}</span></div>`;
  }).join("");
  const accRow = accSet.size ? `<div class="outfit-row"><span class="lbl">Plus</span><span class="val">${Array.from(accSet).map(n => esc(n)).join(", ")}</span></div>` : "";
  const dailyGraph = renderDayGraph(days, 3.6);
  const histBanner = weather._historical
    ? `<p class="trip-hist">Estimated from the same dates last year. Real forecast becomes available about 16 days before your trip.</p>`
    : "";
  return `
    <section class="panel">
      <h2>${esc(dest.name)}</h2>
      <p class="trip-summary"><strong>${days.length}</strong> day${days.length === 1 ? "" : "s"} · ${fmt(tMin)} to ${fmt(tMax)}</p>
      ${histBanner}
    </section>
    <section class="panel">
      <h2>Daily forecast</h2>
      <div class="day-graph-list" id="day-list">${dailyGraph}</div>
    </section>
    <section class="panel">
      <h2>Pack list</h2>
      ${packRows}${accRow}
    </section>
  `;
}

const PREFS = {
  baseline: {
    key: "wtwfw-baseline",
    label: "Body baseline",
    default: "neutral",
    options: [
      { val: "runs_cold", label: "Runs cold", offset: -1.5 },
      { val: "neutral", label: "Neutral", offset: 0 },
      { val: "runs_warm", label: "Runs warm", offset: 1.5 },
    ],
  },
  activity: {
    key: "wtwfw-activity",
    label: "Activity",
    default: "walking",
    options: [
      { val: "standing", label: "Standing", offset: 0 },
      { val: "walking", label: "Walking", offset: 1.5 },
      { val: "biking", label: "Biking", offset: 3 },
      { val: "running", label: "Running", offset: 5 },
    ],
  },
};

function getPref(name) {
  const def = PREFS[name];
  try {
    const v = localStorage.getItem(def.key);
    if (v && def.options.some(o => o.val === v)) return v;
  } catch {}
  return def.default;
}
function setPref(name, val) {
  try { localStorage.setItem(PREFS[name].key, val); } catch {}
}
const CLOSET_SLOTS = { outer: "Jackets", mid: "Mid layers", base: "Tops", bottom: "Bottoms", footwear: "Shoes" };
const CLOSET_BANDS = ["scorching", "hot", "warm", "mild", "cool", "chilly", "cold", "very_cold", "freezing"];
const BAND_RANGE = {
  scorching: [30, 50], hot: [24, 29], warm: [19, 23], mild: [14, 18], cool: [10, 13],
  chilly: [6, 9], cold: [1, 5], very_cold: [-5, 0], freezing: [-50, -6],
};
const CONDITIONS = ["rain", "wind", "sun", "snow"];
const CONDITION_LABEL = { rain: "Rain", wind: "Wind", sun: "Sun", snow: "Snow" };
function getCloset() {
  try {
    const s = localStorage.getItem("wtwfw-closet");
    if (s) {
      const obj = JSON.parse(s);
      if (obj && typeof obj === "object") {
        const out = {};
        for (const k of Object.keys(CLOSET_SLOTS)) {
          out[k] = Array.isArray(obj[k]) ? obj[k].filter(it => it && typeof it.name === "string").slice(0, 24).map(it => {
            const name = String(it.name).slice(0, 40);
            let minT = Number.isFinite(it.minTemp) ? it.minTemp : null;
            let maxT = Number.isFinite(it.maxTemp) ? it.maxTemp : null;
            if (minT === null && maxT === null && it.band && BAND_RANGE[it.band]) {
              minT = BAND_RANGE[it.band][0]; maxT = BAND_RANGE[it.band][1];
            }
            const conds = Array.isArray(it.conditions) ? it.conditions.filter(c => CONDITIONS.includes(c)) : [];
            return { name, minTemp: minT, maxTemp: maxT, conditions: conds };
          }) : [];
        }
        return out;
      }
    }
  } catch {}
  return { outer: [], mid: [], base: [], bottom: [], footwear: [] };
}
function setCloset(c) { try { localStorage.setItem("wtwfw-closet", JSON.stringify(c)); } catch {} }
function getOverrides() {
  try {
    const s = localStorage.getItem("wtwfw-overrides");
    if (s) {
      const obj = JSON.parse(s);
      if (obj && typeof obj === "object") return obj;
    }
  } catch {}
  return {};
}
function setOverrides(o) { try { localStorage.setItem("wtwfw-overrides", JSON.stringify(o)); } catch {} }
function overrideKey(band, conds) {
  const sorted = (Array.isArray(conds) ? conds.slice() : []).sort();
  return band + "|" + sorted.join(",");
}
function setOverride(band, conds, slot, value) {
  const o = getOverrides();
  const key = overrideKey(band, conds);
  if (!o[key]) o[key] = {};
  if (value === null || value === undefined) {
    delete o[key][slot];
    if (!Object.keys(o[key]).length) delete o[key];
  } else {
    o[key][slot] = value;
  }
  setOverrides(o);
}
function getOverride(band, conds, slot) {
  const o = getOverrides();
  const key = overrideKey(band, conds);
  return o[key] ? o[key][slot] : undefined;
}
function showToast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); }, 2400);
}

function addClosetItem(slot, name, minTemp, maxTemp, conditions) {
  if (!CLOSET_SLOTS[slot]) return { ok: false, reason: "bad-slot" };
  const trimmed = String(name || "").trim().slice(0, 40);
  if (!trimmed) return { ok: false, reason: "empty" };
  const minT = Number.isFinite(minTemp) ? Math.round(minTemp) : null;
  const maxT = Number.isFinite(maxTemp) ? Math.round(maxTemp) : null;
  const conds = Array.isArray(conditions) ? conditions.filter(c => CONDITIONS.includes(c)) : [];
  const c = getCloset();
  if (c[slot].length >= 24) return { ok: false, reason: "full", name: trimmed };
  if (c[slot].some(it => it.name.toLowerCase() === trimmed.toLowerCase() && (it.minTemp === minT) && (it.maxTemp === maxT))) {
    return { ok: false, reason: "duplicate", name: trimmed };
  }
  c[slot].push({ name: trimmed, minTemp: minT, maxTemp: maxT, conditions: conds });
  setCloset(c);
  return { ok: true, name: trimmed };
}
function removeClosetItem(slot, idx) {
  if (!CLOSET_SLOTS[slot]) return;
  const c = getCloset();
  if (c[slot] && c[slot][idx]) {
    c[slot].splice(idx, 1);
    setCloset(c);
  }
}

function getLearned() {
  try { return clamp(parseFloat(localStorage.getItem("wtwfw-learned") || "0") || 0, -3, 3); }
  catch { return 0; }
}
function setLearned(v) {
  try { localStorage.setItem("wtwfw-learned", clamp(v, -3, 3).toFixed(1)); } catch {}
}
function applySettings() {
  const b = PREFS.baseline.options.find(o => o.val === getPref("baseline"));
  const a = PREFS.activity.options.find(o => o.val === getPref("activity"));
  CFG.baselineOffset = (b ? b.offset : 0) + getLearned();
  CFG.activityOffset = a ? a.offset : 1.5;
}
function guessSlotFromName(name) {
  const n = String(name || "").toLowerCase();
  if (/jacket|coat|parka|hoodie|blazer|cardigan|shell|raincoat|anorak/.test(n)) return "outer";
  if (/sweater|fleece|pullover|jumper/.test(n)) return "mid";
  if (/shirt|tee|tank|polo|blouse|long\s*sleeve/.test(n)) return "base";
  if (/pant|jean|short|skirt|legging|trouser|chino/.test(n)) return "bottom";
  if (/shoe|sneaker|boot|sandal|heel|flat|trainer|loafer/.test(n)) return "footwear";
  return "base";
}

// KNN over previously-logged snapshots. Given the current rec, find the
// closest "comfortable enough" past entry and use its outfit as a hint.
// Score combines temp distance, condition match, and a comfort penalty so
// snapshots where the user said "way too cold" get heavily down-ranked.
function getSnapshots() {
  try {
    const raw = localStorage.getItem("wtwfw-snapshots");
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function findMatchingSnapshot(rec) {
  const all = getSnapshots().filter(s =>
    s && Number.isFinite(s.feels) && Array.isArray(s.worn) && (s.worn.length > 0 || (s.extra || "").trim())
  );
  if (!all.length) return null;
  const cf = rec.aNow;
  const cc = new Set(rec.conditions || []);
  let best = null, bestScore = Infinity;
  for (const s of all) {
    if (Math.abs((s.comfort || 0)) > 1) continue;
    const tempDist = Math.abs(s.feels - cf);
    if (tempDist > 6) continue;
    const sc = new Set(Array.isArray(s.conditions) ? s.conditions : []);
    let match = 0, miss = 0;
    cc.forEach(c => { sc.has(c) ? match++ : miss++; });
    sc.forEach(c => { if (!cc.has(c)) miss++; });
    const comfortPenalty = Math.abs(s.comfort || 0) * 1.5;
    const score = tempDist + miss * 1.5 - match * 0.5 + comfortPenalty;
    if (score < bestScore) { bestScore = score; best = s; }
  }
  return best;
}
function relativeDay(ts) {
  if (!ts) return "";
  const now = Date.now();
  const days = Math.floor((now - ts) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 7) return `${days} days ago`;
  if (days < 14) return "last week";
  return `${Math.floor(days / 7)} weeks ago`;
}
function comfortLabel(c) {
  if (c <= -2) return "way too cold";
  if (c === -1) return "a bit cold";
  if (c === 0) return "just right";
  if (c === 1) return "a bit warm";
  return "way too warm";
}

function saveSnapshot(state) {
  if (!LAST_WEATHER || !LAST_WEATHER.current) return;
  const ctx = state.hour || { tempC: LAST_WEATHER.current.tempC, rh: LAST_WEATHER.current.rh, kph: LAST_WEATHER.current.kph, isDay: LAST_WEATHER.current.isDay, cloud: LAST_WEATHER.current.cloud, time: LAST_WEATHER.current.time };
  const apparent = feels(ctx);
  let conds;
  if (state.hour && state.hour.rec) {
    conds = state.hour.rec.conditions || [];
  } else {
    conds = (LAST_WEATHER._lastRec && LAST_WEATHER._lastRec.conditions) || [];
  }
  const snap = {
    ts: Date.now(),
    forTime: ctx.time || null,
    airTemp: Math.round(ctx.tempC),
    feels: Math.round(apparent),
    conditions: conds,
    location: LOCATION.name,
    worn: Array.from(state.worn),
    extra: (state.extra || "").trim(),
    comfort: state.comfort,
    note: (state.note || "").trim(),
  };
  try {
    const raw = localStorage.getItem("wtwfw-snapshots");
    const arr = raw ? JSON.parse(raw) : [];
    arr.unshift(snap);
    if (arr.length > 50) arr.length = 50;
    localStorage.setItem("wtwfw-snapshots", JSON.stringify(arr));
  } catch {}
  const adj = -state.comfort * 0.75;
  if (adj !== 0) setLearned(getLearned() + adj);
  if (snap.extra) {
    const slot = guessSlotFromName(snap.extra);
    addClosetItem(slot, snap.extra, null, null, []);
  }
  applySettings();
}

function openOverridePicker(slot, currentValue) {
  if (document.querySelector(".ov-overlay")) return;
  if (!LAST_WEATHER || !LAST_WEATHER._lastRec) return;
  const rec = LAST_WEATHER._lastRec;
  const closet = getCloset();
  const slotItems = (closet[slot] || []);
  const label = { outer: "Jacket", mid: "Mid layer", base: "Top", bottom: "Bottom", footwear: "Shoes" }[slot] || slot;
  const bandLabel = BAND_LABEL[rec.band] || rec.band;
  const condStr = (rec.conditions || []).length ? ` ${(rec.conditions || []).map(c => CONDITION_LABEL[c] || c).join(" + ").toLowerCase()}` : "";
  const chipsHtml = slotItems.length
    ? slotItems.map(it => {
      const sel = it.name === currentValue ? " on" : "";
      return `<button type="button" class="ov-chip${sel}" data-name="${esc(it.name)}">${bigIcon(iconForName(it.name) || SLOT_ICON[slot] || "shirt-01")}<span>${esc(it.name)}</span></button>`;
    }).join("")
    : `<span class="ov-empty">No items in this slot yet. Type a new one below or add some in My closet.</span>`;
  const overlay = document.createElement("div");
  overlay.className = "ov-overlay";
  overlay.innerHTML = `
    <div class="ov-card" role="dialog" aria-label="Customize ${esc(label)}">
      <div class="ov-header">
        <h3>${esc(label)} for ${esc(bandLabel.toLowerCase())}${esc(condStr)}</h3>
        <button type="button" class="ov-close" aria-label="Close">×</button>
      </div>
      <p class="ov-hint">What you pick here becomes your usual ${esc(label.toLowerCase())} when it's ${esc(bandLabel.toLowerCase())}${esc(condStr)}.</p>
      <div class="ov-chips">${chipsHtml}</div>
      <input type="text" class="ov-extra" placeholder="Or type a new item" maxlength="40" />
      <div class="ov-actions">
        <button type="button" class="ov-action" data-action="default">Use the default</button>
        <button type="button" class="ov-action" data-action="skip">Skip this layer</button>
      </div>
      <button type="button" class="ov-save" disabled>Save</button>
    </div>`;
  document.body.appendChild(overlay);
  let pendingValue = null;
  let pendingNewName = "";
  const saveBtn = overlay.querySelector(".ov-save");
  const refresh = () => { saveBtn.disabled = pendingValue === null && !pendingNewName.trim(); };
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector(".ov-close").onclick = () => overlay.remove();
  overlay.querySelectorAll(".ov-chip").forEach(btn => {
    btn.onclick = () => {
      pendingValue = btn.dataset.name;
      pendingNewName = "";
      overlay.querySelectorAll(".ov-chip").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      overlay.querySelector(".ov-extra").value = "";
      refresh();
    };
  });
  overlay.querySelector(".ov-extra").addEventListener("input", e => {
    pendingNewName = e.target.value;
    pendingValue = null;
    overlay.querySelectorAll(".ov-chip").forEach(b => b.classList.remove("on"));
    refresh();
  });
  overlay.querySelector('[data-action="default"]').onclick = () => {
    setOverride(rec.band, rec.conditions || [], slot, null);
    overlay.remove();
    if (LAST_WEATHER) render(LAST_WEATHER);
  };
  overlay.querySelector('[data-action="skip"]').onclick = () => {
    setOverride(rec.band, rec.conditions || [], slot, "__skip__");
    overlay.remove();
    if (LAST_WEATHER) render(LAST_WEATHER);
  };
  saveBtn.onclick = () => {
    let name = pendingValue;
    if (!name && pendingNewName.trim()) {
      name = pendingNewName.trim().slice(0, 40);
      addClosetItem(slot, name, null, null, []);
    }
    if (name) {
      setOverride(rec.band, rec.conditions || [], slot, name);
      overlay.remove();
      if (LAST_WEATHER) render(LAST_WEATHER);
    }
  };
}

function openSnapshotModal() {
  if (document.querySelector(".snap-overlay")) return;
  if (!LAST_WEATHER || !LAST_WEATHER.current) return;
  const today = buildTodayCells(LAST_WEATHER);
  const nowMs = Date.now();
  const pastCells = today ? today.cells.filter(c => new Date(c.time).getTime() <= nowMs) : [];
  const defaultIdx = pastCells.length ? pastCells.length - 1 : -1;
  const closet = getCloset();
  const allItems = Object.entries(closet).flatMap(([slot, items]) =>
    items.map(it => ({ slot, name: it.name }))
  );
  const overlay = document.createElement("div");
  overlay.className = "snap-overlay";
  const itemChips = allItems.length
    ? allItems.map(it => `<button type="button" class="snap-chip" data-name="${esc(it.name)}">${bigIcon(iconForName(it.name) || SLOT_ICON[it.slot] || "shirt-01")}<span>${esc(it.name)}</span></button>`).join("")
    : `<span class="snap-empty">Add some items in My closet first to pick from here.</span>`;
  const comfortOpts = [
    { v: -2, label: "Way too cold", ic: "🥶" },
    { v: -1, label: "A bit cold", ic: "🧊" },
    { v: 0, label: "Just right", ic: "👌" },
    { v: 1, label: "A bit warm", ic: "🌤" },
    { v: 2, label: "Way too warm", ic: "🥵" },
  ];
  const comfortBtns = comfortOpts.map(o =>
    `<button type="button" class="snap-comfort-btn" data-v="${o.v}"><span class="em">${bigIcon(o.ic)}</span><span>${esc(o.label)}</span></button>`
  ).join("");
  const whenBtns = pastCells.map((cell, i) => {
    const isLast = i === pastCells.length - 1;
    const label = isLast ? `${hourShort(cell.time)} now` : hourShort(cell.time);
    return `<button type="button" class="snap-when-btn${i === defaultIdx ? " on" : ""}" data-idx="${i}">${esc(label)}</button>`;
  }).join("");
  const whenSection = pastCells.length > 1
    ? `<div class="snap-section"><div class="snap-label">When?</div><div class="snap-when">${whenBtns}</div></div>`
    : "";
  overlay.innerHTML = `
    <div class="snap-card" role="dialog" aria-label="Log what you're wearing">
      <div class="snap-header">
        <h3>What are you wearing?</h3>
        <button type="button" class="snap-close" aria-label="Close">×</button>
      </div>
      <p class="snap-weather" id="snap-weather"></p>
      ${whenSection}
      <div class="snap-section">
        <div class="snap-label">From your closet</div>
        <div class="snap-chips">${itemChips}</div>
      </div>
      <div class="snap-section">
        <div class="snap-label">Add anything else (e.g. Paul's sweater)</div>
        <input type="text" class="snap-extra" placeholder="Item name" maxlength="60" />
      </div>
      <div class="snap-section">
        <div class="snap-label">How does it feel?</div>
        <div class="snap-comfort">${comfortBtns}</div>
      </div>
      <button type="button" class="snap-save" disabled>Save</button>
    </div>`;
  document.body.appendChild(overlay);
  const state = { worn: new Set(), extra: "", comfort: null, hour: pastCells[defaultIdx] || null };
  const weatherEl = overlay.querySelector("#snap-weather");
  function refreshWeather() {
    const ctx = state.hour || LAST_WEATHER.current;
    const a = feels(ctx);
    const time = state.hour ? ` at ${hour(state.hour.time)}` : "";
    const condStr = state.hour && state.hour.rec ? conditionsLabel(state.hour.rec) : conditionsLabel(LAST_WEATHER._lastRec);
    weatherEl.textContent = `${LOCATION.name}${time}: ${fmt(ctx.tempC)}, feels ${fmt(a)}${condStr}`;
  }
  refreshWeather();
  const saveBtn = overlay.querySelector(".snap-save");
  function refreshSave() { saveBtn.disabled = state.comfort === null; }
  overlay.querySelectorAll(".snap-when-btn").forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      state.hour = pastCells[idx] || null;
      overlay.querySelectorAll(".snap-when-btn").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      refreshWeather();
    };
  });
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector(".snap-close").onclick = () => overlay.remove();
  overlay.querySelectorAll(".snap-chip").forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.name;
      if (state.worn.has(name)) { state.worn.delete(name); btn.classList.remove("on"); }
      else { state.worn.add(name); btn.classList.add("on"); }
    };
  });
  overlay.querySelector(".snap-extra").addEventListener("input", e => { state.extra = e.target.value; });
  overlay.querySelectorAll(".snap-comfort-btn").forEach(btn => {
    btn.onclick = () => {
      state.comfort = parseInt(btn.dataset.v, 10);
      overlay.querySelectorAll(".snap-comfort-btn").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      refreshSave();
    };
  });
  saveBtn.onclick = () => {
    saveSnapshot(state);
    overlay.remove();
    if (LAST_WEATHER) render(LAST_WEATHER);
  };
}

function conditionsLabel(rec) {
  if (!rec || !rec.conditions || !rec.conditions.length) return "";
  const labels = rec.conditions.map(c => CONDITION_LABEL[c] || c).join(", ").toLowerCase();
  return ` (${labels})`;
}

function recordFeedback(direction) {
  const step = 1.0;
  const delta = direction === "cold" ? -step : direction === "warm" ? step : 0;
  if (delta !== 0) {
    setLearned(getLearned() + delta);
    applySettings();
  }
  if (LAST_WEATHER) render(LAST_WEATHER);
}

function renderCloset() {
  const c = getCloset();
  const sections = Object.keys(CLOSET_SLOTS).map(slot => {
    const items = c[slot] || [];
    const list = items.length
      ? `<ul class="closet-list">${items.map((it, i) => {
        const tags = [];
        if (it.minTemp !== null || it.maxTemp !== null) {
          const lo = it.minTemp !== null ? `${it.minTemp}°` : "any";
          const hi = it.maxTemp !== null ? `${it.maxTemp}°` : "any";
          tags.push(`<span class="closet-band">${esc(lo)} to ${esc(hi)}</span>`);
        }
        for (const cond of (it.conditions || [])) {
          tags.push(`<span class="closet-cond">${esc(CONDITION_LABEL[cond] || cond)}</span>`);
        }
        return `<li>${bigIcon(iconForName(it.name) || SLOT_ICON[slot] || "shirt-01")}<span class="closet-name">${esc(it.name)}</span>${tags.join("")}<button class="closet-remove" type="button" data-slot="${esc(slot)}" data-idx="${i}" aria-label="Remove ${esc(it.name)}">×</button></li>`;
      }).join("")}</ul>`
      : `<div class="closet-empty">Nothing yet</div>`;
    return `<div class="closet-section"><div class="closet-slot-label">${esc(CLOSET_SLOTS[slot])}</div>${list}</div>`;
  }).join("");
  const slotOpts = Object.entries(CLOSET_SLOTS).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join("");
  const condChips = CONDITIONS.map(c => `<label class="cond-chip"><input type="checkbox" name="cond" value="${esc(c)}" /><span>${esc(CONDITION_LABEL[c])}</span></label>`).join("");
  const form = `<form class="closet-form" id="closet-form" autocomplete="off">
    <input type="text" name="name" placeholder="Add an item, e.g. brown leather jacket" maxlength="40" />
    <select name="slot" aria-label="Slot">${slotOpts}</select>
    <div class="range-row">
      <input type="number" name="minTemp" inputmode="numeric" placeholder="Min °C" />
      <input type="number" name="maxTemp" inputmode="numeric" placeholder="Max °C" />
    </div>
    <div class="cond-row">${condChips}</div>
    <button type="submit">Add</button>
  </form>`;
  return `<section id="closet" class="panel"><h2>My closet</h2><p class="closet-hint">Set the temperature range you'd wear each item in. Tag a rain jacket with rain, sunglasses with sun, etc. Untagged items show in any conditions.</p>${form}${sections}</section>`;
}

function renderSettings() {
  const rowFor = (name) => {
    const def = PREFS[name];
    const cur = getPref(name);
    const chips = def.options.map(o => `<button class="chip" type="button" data-pref="${esc(name)}" data-val="${esc(o.val)}" aria-pressed="${o.val === cur ? "true" : "false"}">${esc(o.label)}</button>`).join("");
    return `<div class="pref-row"><span class="pref-label">${esc(def.label)}</span><div class="pref-chips">${chips}</div></div>`;
  };
  const reset = `<div class="pref-row"><span class="pref-label">Setup</span><div class="pref-chips"><button class="chip" type="button" data-action="reset-onb">Run setup again</button></div></div>`;
  const curTheme = getTheme();
  const themeChips = ["system", "light", "dark"].map(t => {
    const label = { system: "Match system", light: "Light", dark: "Dark" }[t];
    return `<button class="chip" type="button" data-action="set-theme" data-theme="${esc(t)}" aria-pressed="${t === curTheme ? "true" : "false"}">${esc(label)}</button>`;
  }).join("");
  const theme = `<div class="pref-row"><span class="pref-label">Theme</span><div class="pref-chips">${themeChips}</div></div>`;
  return `<section id="settings" class="panel"><h2>You</h2>${rowFor("baseline")}${rowFor("activity")}${theme}${reset}</section>`;
}

let LAST_WEATHER = null;
let APP_MODE = "home";
let TRIP_STATE = { dest: null, startDate: null, endDate: null, weather: null, error: null, loading: false };
function enterTripMode() { APP_MODE = "trip"; if (LAST_WEATHER) render(LAST_WEATHER); window.scrollTo(0, 0); }
function exitTripMode() {
  APP_MODE = "home";
  TRIP_STATE = { dest: null, startDate: null, endDate: null, weather: null, error: null, loading: false };
  if (LAST_WEATHER) render(LAST_WEATHER);
  window.scrollTo(0, 0);
}
async function runTripPlan() {
  if (!TRIP_STATE.dest || !TRIP_STATE.startDate || !TRIP_STATE.endDate) return;
  TRIP_STATE.loading = true;
  TRIP_STATE.error = null;
  TRIP_STATE.weather = null;
  if (LAST_WEATHER) render(LAST_WEATHER);
  try {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const horizon = new Date(today.getTime() + 16 * 86400000);
    const endParsed = new Date(TRIP_STATE.endDate + "T00:00:00");
    if (endParsed <= horizon) {
      TRIP_STATE.weather = await fetchFromOpenMeteo(TRIP_STATE.dest);
    } else {
      TRIP_STATE.weather = await fetchFromArchive(TRIP_STATE.dest, TRIP_STATE.startDate, TRIP_STATE.endDate);
    }
  } catch (e) {
    TRIP_STATE.error = e && e.message || String(e);
  }
  TRIP_STATE.loading = false;
  if (LAST_WEATHER) render(LAST_WEATHER);
}

function renderError(msg) {
  document.getElementById("root").innerHTML =
    `<section class="panel err" role="alert"><strong>Couldn't load the forecast</strong><p>${esc(msg)}</p><button class="err-retry" type="button" data-action="retry">Try again</button></section>`;
}

(async () => {
  try {
    applyTheme();
    try { window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (getTheme() === "system") applyTheme(); }); } catch {}
    loadLocation();
    applySettings();
    LAST_WEATHER = await fetchWeather();
    render(LAST_WEATHER);
    maybeShowOnboarding();
  } catch (e) {
    renderError(e && e.message || String(e));
  }
})();
